name: Refresh FA Dashboard Data

on:
  schedule:
    - cron: '0 6 5 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance --quiet

      - name: Test Gemini API key
  run: |
    python -c "
    import urllib.request, json
    key = '${{ secrets.ANTHROPIC_API_KEY }}'
    print('Key prefix:', key[:10] if key else 'None')
    if not key.startswith('AIza'):
        print('ERROR: Key does not start with AIza')
    else:
        req = urllib.request.Request(
            'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + key,
            data=json.dumps({'contents': [{'parts': [{'text': 'Say hello'}]}]}).encode(),
            headers={'Content-Type': 'application/json'}
        )
        try:
            resp = urllib.request.urlopen(req)
            print('API test SUCCESS:', resp.read()[:100])
        except Exception as e:
            print('API test FAILED:', e)
    "
      
      - name: Fetch financial data & generate AI profiles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Auto-refresh data.json $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
