name: Refresh FA Dashboard Data

on:
  push:                 # temporary trigger for debugging; remove after success
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests --quiet

      - name: Debug – check secret availability
        env:
          TEST_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ -z "$TEST_KEY" ]; then
            echo "❌ FMP_API_KEY is EMPTY or not set. Check secret name and value."
            exit 1
          else
            echo "✅ FMP_API_KEY is present (length ${#TEST_KEY})"
          fi

      - name: Fetch financial data
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Auto-refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push          git pu
