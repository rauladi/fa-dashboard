<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FA Dashboard — Fundamental Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07111e;--surf:#0d1c2e;--surf2:#122336;--surf3:#192d42;
  --bdr:#1a3050;--bdr2:#22405e;
  --txt:#d8eaf8;--muted:#4e7398;--muted2:#7aa0be;
  --cyan:#00c4e0;--cyan2:#0096ae;
  --green:#00d97e;--red:#ff4060;
  --orange:#ff8c40;--yellow:#ffd060;--purple:#b49dff;--blue:#4da0ff;
  --r:10px; --font:'Outfit',system-ui,sans-serif;
}
html{font-size:14px}
body{background:var(--bg);color:var(--txt);font-family:var(--font);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:var(--font)}
::-webkit-scrollbar{width:5px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}

/* ── HEADER ── */
#hdr{background:var(--surf);border-bottom:1px solid var(--bdr);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  position:sticky;top:0;z-index:200}
.h-logo{width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--cyan2),#004f6e);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.h-title{font-size:15px;font-weight:700;line-height:1.2}
.h-sub{font-size:10px;color:var(--muted);margin-top:1px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;
  border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.btn-cyan{background:var(--cyan2);color:#fff}.btn-cyan:hover{background:var(--cyan);color:#000}
.btn-green{background:#006640;color:#fff}.btn-green:hover{background:var(--green);color:#000}
.btn-ghost{background:var(--surf2);color:var(--muted2);border:1px solid var(--bdr2)}
.btn-ghost:hover{background:var(--surf3);color:var(--txt)}
.btn-red{background:#5a0e1e;color:#ff9aaa;border:none}.btn-red:hover{background:#8a1530}
.btn-sm{padding:4px 10px;font-size:11px}.btn-xs{padding:3px 8px;font-size:10px}

/* ── STOCK BAR ── */
#sBar{background:var(--surf);border-bottom:1px solid var(--bdr);padding:8px 14px;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
#sBar::-webkit-scrollbar{height:3px}
.s-list{display:flex;gap:5px;min-width:max-content}
.s-btn{padding:5px 10px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:700;
  background:var(--surf2);color:var(--muted2);transition:all .15s;
  display:inline-flex;align-items:center;gap:4px}
.s-btn:hover{background:var(--surf3);color:var(--txt)}
.s-btn.on{background:var(--cyan2);color:#fff;box-shadow:0 0 12px rgba(0,150,174,.4)}
.xbadge{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700}
.x-asx{background:rgba(255,208,96,.15);color:#ffd060}
.x-idx{background:rgba(77,160,255,.15);color:#4da0ff}
.x-us{background:rgba(0,217,126,.15);color:#00d97e}
.s-dot-ok{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}
.s-dot-ld{width:5px;height:5px;border-radius:50%;background:var(--yellow);flex-shrink:0;animation:pulse 1s infinite}
.s-dot-er{width:5px;height:5px;border-radius:50%;background:var(--red);flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── TAB BAR ── */
#tBar{background:var(--surf);border-bottom:1px solid var(--bdr);padding:0 16px;display:flex;overflow-x:auto}
#tBar::-webkit-scrollbar{display:none}
.t-btn{padding:11px 15px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;transition:all .15s}
.t-btn:hover{color:var(--txt)}
.t-btn.on{border-color:var(--cyan);color:var(--cyan)}

/* ── CONTENT ── */
#cont{padding:14px;max-width:1700px;margin:0 auto}

/* ── SECTION ── */
.sec{margin-bottom:20px}
.sec-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--cyan);margin-bottom:10px;padding-left:8px;border-left:2px solid var(--cyan)}

/* ── STOCK HEADER ── */
.sk-hdr{margin-bottom:14px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px}
.sk-hdr h2{font-size:17px;font-weight:700}
.sk-hdr p{font-size:11px;color:var(--muted);margin-top:3px}

/* ── LOADING / ERROR STATES ── */
.state-box{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);
  padding:40px;text-align:center}
.spinner{width:36px;height:36px;border:3px solid var(--bdr2);border-top-color:var(--cyan);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.state-title{font-size:14px;font-weight:600;margin-bottom:6px}
.state-sub{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.data-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:3px 8px;
  border-radius:20px;font-weight:600}
.db-ok{background:rgba(0,217,126,.1);color:var(--green);border:1px solid rgba(0,217,126,.3)}
.db-er{background:rgba(255,64,96,.1);color:var(--red);border:1px solid rgba(255,64,96,.3)}
.db-ld{background:rgba(255,208,96,.1);color:var(--yellow);border:1px solid rgba(255,208,96,.3)}

/* ── TABLES ── */
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--bdr);-webkit-overflow-scrolling:touch}
.tw::-webkit-scrollbar{height:4px}
table{width:100%;border-collapse:collapse;background:var(--bg);font-size:12px;font-family:var(--font)}
thead th{background:var(--surf2);padding:8px 10px;text-align:left;font-size:10px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;font-weight:600}
th.tc,td.tc{text-align:center}
tbody td{padding:6px 10px;border-bottom:1px solid rgba(26,48,80,.5);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(18,35,54,.7)}
tbody tr.ev td{background:rgba(18,35,54,.4)}
td.lbl{font-size:11px;font-weight:600;color:var(--txt);min-width:160px}
td.num{font-size:12px;font-weight:500}
.pos{color:var(--green)}.neg{color:var(--red)}
.cya{color:var(--cyan)}.ylo{color:var(--yellow)}.pur{color:var(--purple)}.blu{color:var(--blue)}

/* ── CARDS ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px;margin-bottom:14px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 13px}
.card-l{font-size:10px;color:var(--muted);margin-bottom:5px;font-weight:500}
.card-v{font-size:19px;font-weight:700;letter-spacing:-.01em}

/* ── WEIGHTS ── */
.wt-wrap{border-radius:12px;padding:14px;margin-bottom:16px}
.wt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.wt-card{background:var(--surf);border:1px solid var(--bdr);border-radius:9px;padding:10px}
.wt-card.ov{border-color:var(--orange);background:rgba(255,140,64,.07)}
.wt-l{font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:600;line-height:1.3}
.wt-card.ov .wt-l{color:var(--orange)}
.wt-row{display:flex;align-items:center;gap:4px}
.wt-inp{width:52px;background:var(--bg);border:1px solid var(--bdr2);border-radius:6px;
  padding:4px 7px;font-size:13px;font-weight:700;color:var(--txt)}
.wt-inp.ov{border-color:var(--orange);color:var(--orange)}
.wt-inp:focus{outline:none;border-color:var(--cyan)}
.wt-u{font-size:11px;color:var(--muted)}
.tw-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;
  font-size:12px;font-weight:700}
.tw-ok{background:rgba(0,217,126,.15);color:var(--green)}
.tw-bad{background:rgba(255,64,96,.15);color:var(--red)}

/* ── AI TABS (Profile & News) ── */
.ai-panel{padding:18px 20px;max-width:900px;margin:0 auto}
.ai-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:220px;gap:14px;color:var(--muted2)}
.ai-loading .spinner{width:32px;height:32px;border-width:3px}
.ai-content{font-size:13px;line-height:1.75;color:var(--txt)}
.ai-content h2{font-size:15px;font-weight:700;color:var(--cyan);margin:18px 0 8px;
  border-bottom:1px solid var(--bdr);padding-bottom:6px}
.ai-content h3{font-size:13px;font-weight:700;color:var(--muted2);margin:14px 0 5px}
.ai-content p{margin-bottom:10px;color:var(--muted2)}
.ai-content ul{margin:6px 0 12px 18px;color:var(--muted2)}
.ai-content li{margin-bottom:4px}
.ai-content strong{color:var(--txt)}
.ai-content .tag{display:inline-block;background:var(--surf2);border:1px solid var(--bdr2);
  border-radius:5px;padding:2px 8px;font-size:10px;color:var(--cyan);margin:2px}
.ai-error{background:rgba(255,64,96,.08);border:1px solid rgba(255,64,96,.3);
  border-radius:10px;padding:14px 18px;color:#ff9aaa;font-size:12px;margin:16px 0}
.news-card{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;
  padding:14px 16px;margin-bottom:12px}
.news-card:hover{border-color:var(--bdr2);background:var(--surf2)}
.news-card .nc-title{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:5px;line-height:1.4}
.news-card .nc-meta{font-size:10px;color:var(--muted);margin-bottom:7px}
.news-card .nc-body{font-size:12px;color:var(--muted2);line-height:1.6}
.news-card .nc-tag{font-size:9px;padding:2px 6px;border-radius:4px;margin-left:6px;
  background:rgba(0,196,224,.12);color:var(--cyan);border:1px solid rgba(0,196,224,.2)}
.sh-row{display:flex;align-items:center;gap:10px;padding:9px 12px;
  background:var(--surf);border:1px solid var(--bdr);border-radius:8px;margin-bottom:7px}
.sh-rank{width:24px;height:24px;border-radius:50%;background:var(--surf2);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
  color:var(--cyan);flex-shrink:0}
.sh-name{flex:1;font-size:12px;font-weight:600;color:var(--txt)}
.sh-pct{font-size:12px;font-weight:700;color:var(--yellow)}
.sh-type{font-size:10px;color:var(--muted);margin-left:auto}
.ai-cache-note{font-size:10px;color:var(--muted);text-align:right;margin-top:8px}
.ai-refresh-btn{font-size:10px;padding:3px 10px;margin-left:8px}
.rc{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;font-size:10px;font-weight:700}
.rc1{background:rgba(255,208,96,.25);color:#ffd060;box-shadow:0 0 6px rgba(255,208,96,.5)}
.rc2{background:rgba(180,190,210,.15);color:#b0c4d8;box-shadow:0 0 5px rgba(180,190,210,.4)}
.rc3{background:rgba(255,140,64,.2);color:#ffa060;box-shadow:0 0 5px rgba(255,140,64,.4)}
.rc4{background:rgba(0,217,126,.12);color:#00d97e;box-shadow:0 0 4px rgba(0,217,126,.3)}
.rc5{background:rgba(77,160,255,.12);color:#4da0ff;box-shadow:0 0 4px rgba(77,160,255,.3)}
.rc-g{color:var(--green)}.rc-m{color:var(--muted)}

/* ── RANK ROW COLORS ── */
.fr1{background:rgba(255,208,96,.06)!important}
.fr2,.fr3{background:rgba(0,217,126,.04)!important}
.fr4{background:rgba(77,160,255,.03)!important}
.frb{background:rgba(255,64,96,.03)!important}

/* ── CHART ── */
.chart-box{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:14px}
#chartWrap{position:relative;height:420px}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(5px);
  z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--surf);border:1px solid var(--bdr2);border-radius:16px;
  width:100%;max-width:980px;max-height:93vh;overflow-y:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;
  align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surf);z-index:10}
.modal-h h3{font-size:15px;font-weight:700}
.modal-x{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 2px}
.modal-x:hover{color:var(--txt)}
.modal-b{padding:18px}

/* ── FORM ── */
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin-bottom:18px}
.fld label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;
  font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld select{width:100%;background:var(--bg);border:1px solid var(--bdr2);
  border-radius:7px;padding:7px 10px;font-size:12px;color:var(--txt)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--cyan)}
.fld select option{background:var(--surf)}
.err{color:var(--red);font-size:11px;margin-top:8px;font-weight:600}

/* ── NOTICE ── */
.notice{background:rgba(0,196,224,.07);border:1px solid rgba(0,196,224,.2);
  border-radius:8px;padding:10px 13px;font-size:11px;color:var(--muted2);
  margin-bottom:14px;line-height:1.6}
.notice strong{color:var(--cyan)}

/* ── SOURCE INFO BAR ── */
.src-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  background:var(--surf);border:1px solid var(--bdr);border-radius:9px;padding:9px 13px;margin-bottom:14px}
.src-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.src-meta{font-size:10px;color:var(--muted);line-height:1.5}
.src-meta strong{color:var(--muted2)}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  #hdr{padding:8px 12px}
  .h-title{font-size:13px}.h-sub{display:none}
  .h-logo{width:28px;height:28px;font-size:9px}
  #cont{padding:10px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .wt-grid{grid-template-columns:repeat(2,1fr)}
  .card-v{font-size:16px}
  #chartWrap{height:300px}
  .sk-hdr h2{font-size:14px}
  .btn{padding:5px 10px;font-size:11px}
  .state-box{padding:24px 16px}
}
@media(min-width:1200px){.cards{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<div id="hdr">
  <div style="display:flex;align-items:center;gap:10px">
    <div class="h-logo">FA</div>
    <div>
      <div class="h-title">Fundamental Analysis Dashboard</div>
      <div class="h-sub" id="hSub">ASX · IDX · NYSE/NASDAQ — loading...</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <button class="btn btn-ghost btn-sm" onclick="showSync()">🔄 Sync</button>
    <button class="btn btn-green btn-sm" onclick="showAdd()">＋ Add Stock</button>
  </div>
</div>

<div id="sBar"><div class="s-list" id="sList"></div></div>

<div id="tBar">
  <button class="t-btn on" id="t-data"     onclick="setTab('data')">📋 Data</button>
  <button class="t-btn"    id="t-ratios"   onclick="setTab('ratios')">📐 Ratios</button>
  <button class="t-btn"    id="t-chart"    onclick="setTab('chart')">📈 Chart</button>
  <button class="t-btn"    id="t-rankings" onclick="setTab('rankings')">🏆 Rankings</button>
  <button class="t-btn"    id="t-insights" onclick="setTab('insights')">💡 Insights</button>
</div>

<div id="cont"></div>

<!-- ADD STOCK MODAL -->
<div id="addModal" class="modal-bg" style="display:none">
  <div class="modal">
    <div class="modal-h"><h3>＋ Add New Stock</h3><button class="modal-x" onclick="hideAdd()">×</button></div>
    <div class="modal-b" id="addBody"></div>
  </div>
</div>

<!-- SYNC MODAL -->
<div id="syncModal" class="modal-bg" style="display:none">
  <div class="modal" style="max-width:520px">
    <div class="modal-h"><h3>🔄 Sync Between Devices</h3><button class="modal-x" onclick="hideSync()">×</button></div>
    <div class="modal-b" id="syncBody"></div>
  </div>
</div>

<script>
// ======================== CONSTANTS & GLOBALS ========================
const CURRENT_YEAR = new Date().getFullYear();
const LATEST_YEAR  = CURRENT_YEAR - 1;
const YEARS        = Array.from({length:5}, (_,i) => LATEST_YEAR - 4 + i).concat([CURRENT_YEAR]);
const N_YEARS      = YEARS.length;
let ANNUALISATION  = {};

const LS_KEY='fa_v5';
const BASE_STOCKS={
  BHP: {name:"BHP Group", exchange:"ASX", currency:"B AUD"},
  WDS: {name:"Woodside Energy", exchange:"ASX", currency:"B AUD"},
  CBA: {name:"Commonwealth Bank", exchange:"ASX", currency:"B AUD"},
  BBRI:{name:"Bank Rakyat Indonesia", exchange:"IDX", currency:"T IDR"},
  ADRO:{name:"Alamtri Resources Indonesia", exchange:"IDX", currency:"T IDR"},
  SMSM:{name:"Selamat Sempurna", exchange:"IDX", currency:"T IDR"},
  UNTR:{name:"United Tractors", exchange:"IDX", currency:"T IDR"},
  ITMG:{name:"Indo Tambangraya Megah", exchange:"IDX", currency:"T IDR"},
  POWR:{name:"Cikarang Listrindo", exchange:"IDX", currency:"T IDR"},
  MPMX:{name:"Mitra Pinasthika Mustika", exchange:"IDX", currency:"T IDR"},
  BTPS:{name:"Bank BTPN Syariah", exchange:"IDX", currency:"T IDR"},
  DMAS:{name:"Puradelta Lestari", exchange:"IDX", currency:"T IDR"},
  SPTO:{name:"Surya Toto Indonesia", exchange:"IDX", currency:"T IDR"},
  TSM: {name:"Taiwan Semiconductor", exchange:"NYSE", currency:"B USD"},
  V:   {name:"Visa Inc.", exchange:"NYSE", currency:"B USD"},
  MA:  {name:"Mastercard Inc.", exchange:"NYSE", currency:"B USD"},
  "PBR-A":{name:"Petrobras Pref ADR", exchange:"NYSE", currency:"B USD"},
  MSFT:{name:"Microsoft Corp.", exchange:"NASDAQ", currency:"B USD"},
  AMZN:{name:"Amazon.com Inc.", exchange:"NASDAQ", currency:"B USD"},
  AAPL:{name:"Apple Inc.", exchange:"NASDAQ", currency:"B USD"},
  META:{name:"Meta Platforms Inc.", exchange:"NASDAQ", currency:"B USD"},
  NVDA:{name:"NVIDIA Corporation", exchange:"NASDAQ", currency:"B USD"},
  GOOG:{name:"Alphabet Inc (Google)", exchange:"NASDAQ", currency:"B USD"},
  BKNG:{name:"Booking Holdings Inc", exchange:"NASDAQ", currency:"B USD"},
};

const DEF_WTS={cashToAsset:10,debtToEquity:5,revenueCagr:5,gpmAvg:0,
  netProfitCagr:5,npmAvg:30,epsCagr:5,dpsCagr:0,
  roeAvg:25,dividendPayout:0,buffettTest:15};

const CRITERIA=[
  {key:"cashToAsset",  wKey:"cashToAsset",   label:"Cash/Asset", hi:true},
  {key:"debtToEquity", wKey:"debtToEquity",  label:"D/E Ratio",  hi:false},
  {key:"revenueCagr",  wKey:"revenueCagr",   label:"Rev CAGR",   hi:true},
  {key:"gpmAvg",       wKey:"gpmAvg",        label:"GP Margin",  hi:true},
  {key:"netProfitCagr",wKey:"netProfitCagr", label:"NP CAGR",    hi:true},
  {key:"npmAvg",       wKey:"npmAvg",        label:"NP Margin",  hi:true},
  {key:"epsCagr",      wKey:"epsCagr",       label:"EPS CAGR",   hi:true},
  {key:"dpsCagr",      wKey:"dpsCagr",       label:"DPS CAGR",   hi:true},
  {key:"roeAvg",       wKey:"roeAvg",        label:"ROE",        hi:true},
  {key:"dividendPayout",wKey:"dividendPayout",label:"Div Payout",hi:true},
  {key:"buffettTest",  wKey:"buffettTest",   label:"Buffett $1", hi:true},
];

const MKEYS=[
  {k:"totalAsset",l:"Total Asset"}, {k:"cash",l:"Cash"},
  {k:"totalDebt",l:"Total Debt"},   {k:"totalEquity",l:"Total Equity"},
  {k:"revenue",l:"Total Revenue"},  {k:"grossProfit",l:"Gross Profit"},
  {k:"netProfit",l:"Net Profit"},   {k:"eps",l:"EPS"},
  {k:"dps",l:"DPS"},
];

// ======================== STATE ========================
let S={
  stocks:{...BASE_STOCKS},
  custom:{},
  deleted:{},
  data:{},
  status:{},
  errmsg:{},
  sel:"BHP",
  tab:"data",

// ======================== STORAGE & SYNC ========================
function saveLS(){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify({
      custom:S.custom, wts:S.wts, sel:S.sel,
      data:S.data, status:S.status, deleted:S.deleted||{}
    }));
  }catch(e){}
}
function loadLS(){
  try{
    const h=location.hash;
    if(h&&h.startsWith('#d=')){
      applyImport(JSON.parse(atob(decodeURIComponent(h.slice(3)))));
      history.replaceState(null,'',location.pathname);return;
    }
    const raw=localStorage.getItem(LS_KEY);
    if(raw) applyImport(JSON.parse(raw),true);
  }catch(e){}
}
function applyImport(d,quiet){
  if(d.custom){S.custom=d.custom||{};S.stocks={...BASE_STOCKS,...S.custom};}
  if(d.wts) S.wts={...DEF_WTS,...d.wts};
  if(d.sel&&S.stocks[d.sel]) S.sel=d.sel;
  if(d.data)   S.data={...d.data};
  if(d.deleted) S.deleted={...d.deleted};
  if(d.status){Object.keys(d.status).forEach(k=>{S.status[k]=d.status[k]==='ok'?'ok':'idle';});}
  if(!quiet) saveLS();
}
function exportJSON(){
  const d={custom:S.custom,wts:S.wts,sel:S.sel,data:S.data,status:S.status,at:new Date().toISOString()};
  const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='FA_Dashboard_sync.json';a.click();URL.revokeObjectURL(u);
}
function importFile(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      applyImport(JSON.parse(e.target.result));
      render();hideSync();
      showToast('✓ Imported successfully','green');
    }catch(x){showToast('Error importing file: '+x.message,'red');}
  };
  r.readAsText(file);
}
function genLink(){
  const d={custom:S.custom,wts:S.wts,sel:S.sel,data:S.data};
  return location.href.split('#')[0]+'#d='+encodeURIComponent(btoa(JSON.stringify(d)));
}

}

function yahooTicker(symbol, exchange){
  if(exchange==='ASX') return symbol+'.AX';

}

// ======================== MATH UTILITIES ========================
const isOK=v=>v!==null&&v!==undefined&&isFinite(v)&&!isNaN(v);
const avg=a=>{const v=a.filter(isOK);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
const N2=(v,d=2)=>isOK(v)?Number(v).toFixed(d):'N/A';
const P1=(v,d=1)=>isOK(v)?Number(v).toFixed(d)+'%':'N/A';
function cagr(a){
  const v=a.filter(isOK);
  if(v.length<2)return null;
  const s=v[0],e=v[v.length-1],n=v.length-1;
  if(s===0||n===0)return null;
  if(s>0&&e>0)return(Math.pow(e/s,1/n)-1)*100;
  return null;
}

function calcM(symbol){
  const data=S.data[symbol];
  if(!data) return null;
  const sl=k=>(data[k]||Array(N_YEARS).fill(null)).slice(0,N_YEARS);
  const ta=sl('totalAsset'),ca=sl('cash'),td=sl('totalDebt'),te=sl('totalEquity');
  const rv2=sl('revenue'),gp=sl('grossProfit'),np=sl('netProfit'),ep=sl('eps'),dp=sl('dps');

  const Y=YEARS.map((yr,i)=>({
    year:yr,
    totalAsset:ta[i],cash:ca[i],totalDebt:td[i],totalEquity:te[i],
    revenue:rv2[i],grossProfit:gp[i],netProfit:np[i],eps:ep[i],dps:dp[i],
    cashToAsset: isOK(ta[i])&&ta[i]>0&&isOK(ca[i]) ? ca[i]/ta[i]*100 : null,
    debtToEquity: isOK(te[i])&&te[i]!==0&&isOK(td[i]) ? td[i]/te[i]*100 : null,
    gpm:     isOK(rv2[i])&&rv2[i]>0&&isOK(gp[i])  ? gp[i]/rv2[i]*100  : null,
    npm:     isOK(rv2[i])&&rv2[i]>0&&isOK(np[i])  ? np[i]/rv2[i]*100  : null,
    roa:     isOK(ta[i])&&ta[i]>0&&isOK(np[i])    ? np[i]/ta[i]*100   : null,
    roe:     isOK(te[i])&&te[i]!==0&&isOK(np[i])  ? np[i]/te[i]*100   : null,
    divPayout: isOK(ep[i])&&ep[i]>0&&isOK(dp[i])  ? dp[i]/ep[i]*100   : null,
    valLow:  isOK(dp[i]) ? dp[i]*10  : null,
    valHigh: isOK(dp[i]) ? dp[i]*20  : null,
    retEps:  null,
  }));

  const av={
    cashToAsset:avg(Y.map(y=>y.cashToAsset)), debtToEquity:avg(Y.map(y=>y.debtToEquity)),
    gpm:avg(Y.map(y=>y.gpm)), npm:avg(Y.map(y=>y.npm)),
    roa:avg(Y.map(y=>y.roa)), roe:avg(Y.map(y=>y.roe)),
    divPayout:avg(Y.map(y=>y.divPayout)),
  };
  const cg={rev:cagr(rv2),np:cagr(np),eps:cagr(ep),dps:cagr(dp)};

  const N_COMPLETED = N_YEARS - 1;
  const epCompleted = ep.slice(0, N_COMPLETED);
  const dpCompleted = dp.slice(0, N_COMPLETED);
  const retEpsCompleted = epCompleted.map((e, i) => {
    if (!isOK(e)) return null;
    const d = isOK(dpCompleted[i]) ? dpCompleted[i] : 0;
    return e - d;
  });
  const retEpsVals = retEpsCompleted.filter(isOK);
  const totRet = retEpsVals.length > 0 ? retEpsVals.reduce((s,v) => s+v, 0) : null;
  const epCompletedOK = epCompleted.filter(isOK);
  const epsInc = epCompletedOK.length >= 2 ? epCompletedOK[epCompletedOK.length-1] - epCompletedOK[0] : null;
  const buff = isOK(totRet) && Math.abs(totRet) > 0.001 && isOK(epsInc) ? epsInc / totRet * 100 : null;

  Y.forEach((y, i) => {
    if (!isOK(y.eps)) { y.retEps = null; return; }
    const d = isOK(y.dps) ? y.dps : 0;
    y.retEps = y.eps - d;
  });

  return{Y,av,cg,epsInc,totRet,buff,raw:{ta,ca,td,te,rv:rv2,gp,np,ep,dp},
    rm:{cashToAsset:av.cashToAsset,debtToEquity:av.debtToEquity,revenueCagr:cg.rev,
      gpmAvg:av.gpm,netProfitCagr:cg.np,npmAvg:av.npm,epsCagr:cg.eps,dpsCagr:cg.dps,
      roeAvg:av.roe,dividendPayout:av.divPayout,buffettTest:buff}};
}

function yearColHeader(sym, yr) {
  if (yr !== CURRENT_YEAR) return `<th class="tc">${yr}</th>`;
  const ann = ANNUALISATION[sym];
  if (!ann || !ann.label || ann.label === 'FY') {
    const tag = ann?.label === 'FY' ? 'FY' : 'Est.';
    return `<th class="tc" style="color:var(--yellow)">${yr}<br><span style="font-size:8px;color:var(--yellow);opacity:.85">${tag}</span></th>`;
  }
  const asOf = ann.asOf ? ` ${ann.asOf.slice(5)}` : '';
  return `<th class="tc" style="color:var(--orange)">${yr}<br><span style="font-size:8px;color:var(--orange);opacity:.9">${ann.label}${asOf}</span></th>`;
}

function calcRanks(wts){
  const ks=Object.keys(S.stocks).filter(k=>S.status[k]==='ok');
  const N=ks.length; if(!N) return{ranks:{},scores:{},fr:{}};
  const allM=Object.fromEntries(ks.map(k=>[k,calcM(k)]));
  const ranks=Object.fromEntries(ks.map(k=>[k,{}]));
  CRITERIA.forEach(c=>{
    const vs=ks.map(k=>({k,v:allM[k]?.rm[c.key]}));
    vs.sort((a,b)=>{if(!isOK(a.v)&&!isOK(b.v))return 0;if(!isOK(a.v))return 1;if(!isOK(b.v))return -1;return c.hi?b.v-a.v:a.v-b.v;});
    vs.forEach((x,i)=>{ranks[x.k][c.key]=i+1;});
  });
  const scores=Object.fromEntries(ks.map(k=>{const ws=CRITERIA.reduce((s,c)=>s+(ranks[k][c.key]||N)*(wts[c.wKey]||0)/100,0); return[k,{ranks:ranks[k],ws,m:allM[k]}];}));
  const sorted=[...ks].sort((a,b)=>scores[a].ws-scores[b].ws);
  const fr=Object.fromEntries(sorted.map((k,i)=>[k,i+1]));
  return{ranks,scores,fr};
}

function markdownToHtml(md) {
  if (!md) return '';
  return md
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
    .replace(/\n/g, '<br>');
}

function generateSWOT(sym, st, m) {
  const strengths = [], weaknesses = [], opportunities = [], threats = [];
  if (m.av.roe > 20) strengths.push(`High return on equity (${fmtPct(m.av.roe)}) – excellent capital efficiency.`);
  if (m.av.gpm > 40) strengths.push(`Strong gross margin (${fmtPct(m.av.gpm)}), indicating pricing power or cost leadership.`);
  if (m.av.debtToEquity < 50) strengths.push(`Low debt-to-equity (${fmtPct(m.av.debtToEquity)}), conservative balance sheet.`);
  if (m.cg.rev > 10) strengths.push(`Double‑digit revenue growth (${fmtPct(m.cg.rev)} CAGR).`);
  if (m.buff > 100) strengths.push(`Passes Buffett $1 test (${fmtPct(m.buff)}) – retained earnings create value.`);
  if (m.av.roe < 10) weaknesses.push(`Low return on equity (${fmtPct(m.av.roe)}) – capital may be underutilized.`);
  if (m.av.npm < 10) weaknesses.push(`Thin net margin (${fmtPct(m.av.npm)}), vulnerable to cost pressures.`);
  if (m.av.debtToEquity > 100) weaknesses.push(`High leverage (D/E ${fmtPct(m.av.debtToEquity)}), interest rate sensitivity.`);
  if (m.cg.rev < 0) weaknesses.push(`Revenue decline (${fmtPct(m.cg.rev)} CAGR) – top‑line contraction.`);
  if (m.cg.np < 0) weaknesses.push(`Earnings shrinking (${fmtPct(m.cg.np)} CAGR).`);
  if (m.cashToAsset > 20) opportunities.push(`Strong cash position (${fmtPct(m.cashToAsset)} of assets) enables M&A or shareholder returns.`);
  if (m.cg.rev > 0) opportunities.push(`Continue growth trajectory in core markets.`);
  if (m.av.npm < 20 && m.av.gpm > 30) opportunities.push(`Margin expansion potential through cost optimisation.`);
  if (CO_INFO[sym]?.sector === 'Technology') opportunities.push(`AI and digital transformation could drive new revenue streams.`);
  if (CO_INFO[sym]?.sector === 'Mining') opportunities.push(`Commodity price upside could boost earnings.`);
  if (CO_INFO[sym]?.sector === 'Banking') opportunities.push(`Digital banking and cross‑selling opportunities.`);
  if (m.av.debtToEquity > 80) threats.push(`High debt increases risk in rising interest rate environment.`);
  if (m.cg.rev < 0) threats.push(`Persistent revenue decline may signal structural issues.`);
  if (CO_INFO[sym]?.sector === 'Mining') threats.push(`Commodity price volatility, regulatory/ESG pressure.`);
  if (CO_INFO[sym]?.sector === 'Banking') threats.push(`Credit cycle deterioration, fintech disruption.`);
  if (CO_INFO[sym]?.sector === 'Technology') threats.push(`Intense competition, rapid technological change, regulatory scrutiny.`);
  if (strengths.length === 0) strengths.push('Financial data not sufficient to determine strengths.');
  if (weaknesses.length === 0) weaknesses.push('No major weaknesses identified from available data.');
  if (opportunities.length === 0) opportunities.push('Opportunities are sector‑dependent; monitor industry trends.');
  if (threats.length === 0) threats.push('Standard industry risks apply; see sensitivity chart.');
  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div><strong>✅ Strengths</strong><ul>${strengths.map(s => `<li>${s}</li>`).join('')}</ul></div>
      <div><strong>❌ Weaknesses</strong><ul>${weaknesses.map(w => `<li>${w}</li>`).join('')}</ul></div>
      <div><strong>🚀 Opportunities</strong><ul>${opportunities.map(o => `<li>${o}</li>`).join('')}</ul></div>
      <div><strong>⚠️ Threats</strong><ul>${threats.map(t => `<li>${t}</li>`).join('')}</ul></div>
    </div>
  `;
}

function futureOutlook(sym, st, m) {
  const revTrend = m.cg.rev > 5 ? 'strongly growing' : m.cg.rev > 0 ? 'modestly growing' : m.cg.rev < -5 ? 'declining' : 'stable';
  const npTrend = m.cg.np > 5 ? 'strongly growing' : m.cg.np > 0 ? 'modestly growing' : m.cg.np < -5 ? 'declining' : 'stable';
  let outlookText = `Over the past ${YEARS.length-1} years, revenue has been ${revTrend} (${fmtPct(m.cg.rev)} CAGR) and net profit ${npTrend} (${fmtPct(m.cg.np)} CAGR). `;
  if (m.av.npm > 20) outlookText += `The business enjoys high profitability with an average net margin of ${fmtPct(m.av.npm)}. `;
  else if (m.av.npm > 10) outlookText += `The business maintains solid profitability (avg net margin ${fmtPct(m.av.npm)}). `;
  else outlookText += `Margins are thin (avg net margin ${fmtPct(m.av.npm)}), requiring focus on cost management. `;
  if (m.av.roe > 20) outlookText += `With ROE at ${fmtPct(m.av.roe)}, management has been effective at generating returns. `;
  else if (m.av.roe < 10) outlookText += `ROE of ${fmtPct(m.av.roe)} suggests capital efficiency needs improvement. `;
  if (m.av.debtToEquity > 100) outlookText += `High leverage (D/E ${fmtPct(m.av.debtToEquity)}) increases financial risk. `;
  else if (m.av.debtToEquity < 30) outlookText += `The balance sheet is conservatively funded (D/E ${fmtPct(m.av.debtToEquity)}). `;
  if (m.buff > 100) outlookText += `The company passes the Buffett $1 test (${fmtPct(m.buff)}), meaning retained earnings create value. `;
  else if (m.buff !== null) outlookText += `Retained earnings generate some value (${fmtPct(m.buff)}), but room for improvement. `;
  const sector = CO_INFO[sym]?.sector || 'General';
  let sectorOutlook = '';
  if (sector === 'Mining') sectorOutlook = 'Commodity demand from energy transition and infrastructure may support prices, but ESG pressures remain.';
  else if (sector === 'Banking') sectorOutlook = 'Digital transformation and interest rate trends will drive profitability; credit quality is key.';
  else if (sector === 'Technology') sectorOutlook = 'Innovation cycles and AI adoption present growth catalysts, but competition and regulation are headwinds.';
  else sectorOutlook = 'The company’s future will depend on its ability to adapt to industry trends and execute strategy.';
  outlookText += `<br><br><strong>Industry context:</strong> ${sectorOutlook}`;
  return `<p>${outlookText}</p>`;
}

function generateCustomTornado(sym, st, m) {
  const sector = CO_INFO[sym]?.sector || 'Technology';
  let risks = (SECTOR_RISKS[sector] || SECTOR_RISKS['Technology']).map(r => ({...r}));
  if (m.av.debtToEquity > 80) risks.push({ name: 'Interest Rate Sensitivity', low: -15, high: 5 });
  if (m.cg.rev < 0) risks.push({ name: 'Revenue Decline Persistence', low: -20, high: 5 });
  if (m.av.gpm > 40 && m.av.npm < 15) risks.push({ name: 'Operating Cost Inflation', low: -12, high: 3 });
  if (m.cg.np < 0 && m.cg.np < -10) risks.push({ name: 'Profit Margin Compression', low: -18, high: 4 });
  risks = risks.slice(0,7);
  risks.sort((a,b) => Math.abs(b.high - b.low) - Math.abs(a.high - a.low));
  return risks;
}

function renderTornadoChart(variables) {
  if (!variables || !variables.length) return "";
  const sorted = [...variables].sort((a,b) => Math.abs(b.high - b.low) - Math.abs(a.high - a.low));
  const maxAbs = Math.max(...sorted.flatMap(v => [Math.abs(v.low||0), Math.abs(v.high||0)]), 1);
  const labelW = 160, barH = 28, gap = 8, axisH = 30, chartW = 380, mid = chartW/2;
  const scale = v => (Math.abs(v)/maxAbs) * (mid * 0.90);
  const fmt = v => v != null ? (v>=0 ? "+" : "") + Number(v).toFixed(1) + "%" : "?";
  const bars = sorted.map((v,i) => {
    const y = i * (barH + gap);
    const nw = scale(v.low||0);
    const pw = scale(v.high||0);
    return `<g transform="translate(0,${y})">
      <rect x="${mid - nw}" y="0" width="${nw}" height="${barH}" fill="#ff4060" rx="3" opacity="0.85"/>
      <rect x="${mid}" y="0" width="${pw}" height="${barH}" fill="#4da0ff" rx="3" opacity="0.85"/>
      <text x="${mid - nw - 4}" y="${barH/2 + 4}" fill="#ff4060" font-size="9" text-anchor="end">${fmt(v.low)}</text>
      <text x="${mid + pw + 4}" y="${barH/2 + 4}" fill="#4da0ff" font-size="9" text-anchor="start">${fmt(v.high)}</text>
      <text x="-4" y="${barH/2 + 4}" fill="#7aa0be" font-size="10" text-anchor="end" font-weight="500">${v.name||""}</text>
    </g>`;
  }).join("");
  const h = sorted.length * (barH + gap) + axisH;
  const ticks = [-75,-50,-25,0,25,50,75].filter(t => Math.abs(t) <= maxAbs * 1.05);
  const axis = ticks.map(t => {
    const x = mid + (t / maxAbs) * (mid * 0.90);
    return `<line x1="${x}" y1="0" x2="${x}" y2="${h - axisH}" stroke="#1a3050" stroke-width="1"/>
      <text x="${x}" y="${h - axisH + 13}" fill="#4e7398" font-size="8" text-anchor="middle">${t>0?"+":""}${t}%</text>`;
  }).join("");
  return `<div style="overflow-x:auto;margin:12px 0">
    <div style="font-size:10px;color:var(--muted);margin-bottom:6px;display:flex;gap:14px">
      <span><span style="color:#ff4060">■</span> Downside risk to net profit</span>
      <span><span style="color:#4da0ff">■</span> Upside potential</span>
    </div>
    <svg viewBox="-${labelW} 0 ${labelW+chartW+60} ${h}" style="width:100%;max-width:${labelW+chartW+60}px;height:${h}px;font-family:var(--font)">
      ${axis}
      ${bars}
    </svg>
  </div>`;
}

function bottomLine(sym, st, m, tornadoVars, mgmtHtml) {
  const sorted = [...tornadoVars].sort((a,b) => (Math.abs(b.high - b.low)) - (Math.abs(a.high - a.low)));
  const topRisk = sorted[0];
  const topOpportunity = sorted.find(v => v.high > Math.abs(v.low)) || sorted[0];
  let verdict = '', reason = '';
  if (m.buff > 100 && m.cg.rev > 5 && m.av.roe > 15) {
    verdict = 'High‑quality compounder – suitable for long‑term core portfolio.';
    reason = `Passes the Buffett test (${fmtPct(m.buff)}), strong growth (${fmtPct(m.cg.rev)} CAGR), high returns (ROE ${fmtPct(m.av.roe)}). Management's rational capital allocation reinforces this view.`;
  } else if (m.buff > 80 && m.cg.rev > 0 && m.av.roe > 10) {
    verdict = 'Solid, stable business – attractive for dividend/income investors.';
    reason = `Consistent performance (${fmtPct(m.cg.rev)} CAGR) and capital allocation – a core holding candidate.`;
  } else if (m.cg.rev < 0 && m.av.roe < 10) {
    verdict = 'Challenged business – requires deep value or turnaround thesis.';
    reason = `Declining revenue (${fmtPct(m.cg.rev)} CAGR) and low returns (ROE ${fmtPct(m.av.roe)}) – requires turnaround or valuation margin of safety. Management's capital allocation needs scrutiny.`;
  } else {
    verdict = 'Mixed signals – selective entry points required.';
    reason = `Strengths and weaknesses balanced; further analysis needed before committing. Watch management's response to the key sensitivities.`;
  }
  let tornadoLink = `<p style="margin-top:12px;font-size:12px;"><strong>Key sensitivities from tornado chart:</strong><br>
    The most significant downside risk is <strong>${topRisk.name}</strong> (${fmtPct(topRisk.low)} impact).<br>
    The largest upside potential comes from <strong>${topOpportunity.name}</strong> (${fmtPct(topOpportunity.high)} impact).<br>
    A long‑term investor should monitor these factors and how management navigates them.
  </p>`;
  return `<div style="background:var(--surf);border-left:3px solid var(--cyan);padding:12px 16px;margin:8px 0;">
    <strong style="font-size:14px;">${verdict}</strong>
    <p style="margin-top:8px;font-size:12px;">${reason}</p>
    ${tornadoLink}
    <p style="margin-top:12px;font-size:11px;color:var(--muted);">Key watchpoints: revenue growth, margin stability, capital allocation, industry dynamics.</p>
  </div>`;
}

}
function showSync(){
  document.getElementById('syncBody').innerHTML=`
    <div class="notice"><strong>📱 ↔ 💻 Cross-Device Sync</strong><br>Your portfolio (custom stocks, weights, cached data) is auto-saved locally. Use one of these methods to sync to another device.</div>
    <div class="sec"><div class="sec-t">Method 1 · Download & Import File</div><p style="font-size:12px;color:var(--muted2);margin-bottom:10px;line-height:1.7">Downloads a JSON file with your full portfolio including all cached financial data. Transfer via email, AirDrop, Google Drive, WhatsApp — then import on other device. <strong style="color:var(--txt)">This also carries your fetched data so the other device won't need to re-fetch.</strong></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-cyan" onclick="exportJSON()">⬇ Download Portfolio JSON</button><input type="file" accept=".json" id="impFile" style="display:none" onchange="importFile(this.files[0])"/><button class="btn btn-ghost" onclick="document.getElementById('impFile').click()">⬆ Import JSON File</button></div></div>
    <div class="sec" style="margin-top:18px"><div class="sec-t">Method 2 · Share Link</div><p style="font-size:12px;color:var(--muted2);margin-bottom:10px;line-height:1.7">Generates a URL with your full configuration. Copy and open on any device. Note: the URL may be long if you have many stocks with cached data.</p><button class="btn btn-green" onclick="doGenLink()" style="margin-bottom:10px">🔗 Generate Link</button><div id="linkOut" style="display:none"><textarea id="linkTxt" readonly style="width:100%;background:var(--bg);border:1px solid var(--bdr2);border-radius:8px;padding:10px;color:var(--muted2);font-size:10px;resize:vertical;min-height:70px;font-family:var(--font);line-height:1.5"></textarea><div style="display:flex;align-items:center;gap:8px;margin-top:8px"><button class="btn btn-ghost btn-sm" onclick="copyLink()">📋 Copy Link</button><span id="cpMsg" style="font-size:11px;color:var(--green);display:none">✓ Copied!</span></div></div></div>
    <div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="btn btn-ghost" onclick="hideSync()">Close</button></div>`;
  document.getElementById('syncModal').style.display='flex';
}
function hideSync(){document.getElementById('syncModal').style.display='none';}
function doGenLink(){const u=genLink(); document.getElementById('linkOut').style.display='block'; document.getElementById('linkTxt').value=u;}
function copyLink(){const t=document.getElementById('linkTxt'); navigator.clipboard.writeText(t.value).then(()=>{const m=document.getElementById('cpMsg');m.style.display='inline';setTimeout(()=>m.style.display='none',3000);}).catch(()=>{t.select();document.execCommand('copy');});}
function showAdd(){
  AF={sym:'',name:'',exch:'ASX',cur:'B AUD',ticker:'',hintCur:'AUD'};
  renderAddForm();
  document.getElementById('addModal').style.display='flex';
}
function hideAdd(){document.getElementById('addModal').style.display='none';}
let AF={sym:'',name:'',exch:'ASX',cur:'B AUD',ticker:'',hintCur:'AUD'};
function renderAddForm(){
  document.getElementById('addBody').innerHTML=`<div class="notice" style="margin-bottom:14px"><strong>How adding a stock works:</strong><br>1. Fill in the stock details below<br>2. Copy the generated <code style="background:rgba(0,0,0,.3);padding:1px 5px;border-radius:3px">stocks_config.json</code> entry<br>3. Add it to <code style="background:rgba(0,0,0,.3);padding:1px 5px;border-radius:3px">stocks_config.json</code> in your GitHub repo<br>4. Go to <strong>Actions → Refresh Financial Data → Run workflow</strong><br>Data will be fetched automatically and your dashboard will update.</div>
    <div class="fg" style="margin-bottom:12px"><div class="fld"><label>Ticker Symbol *</label><input id="aSym" placeholder="e.g. CBA, TSM, TLKM" oninput="AF.sym=this.value.toUpperCase();this.value=AF.sym;updateTickerDefault();updateConfigPreview()"/></div><div class="fld"><label>Company Name *</label><input id="aName" placeholder="e.g. Commonwealth Bank" oninput="AF.name=this.value;updateConfigPreview()"/></div><div class="fld"><label>Exchange</label><select id="aExch" onchange="AF.exch=this.value;updateCurDefault();updateTickerDefault();updateConfigPreview()">${['ASX','IDX','NYSE','NASDAQ'].map(e=>`<option${e===AF.exch?' selected':''}>${e}</option>`).join('')}</select></div><div class="fld"><label>Display Currency</label><input id="aCur" value="${AF.cur}" oninput="AF.cur=this.value;updateConfigPreview()"/></div><div class="fld"><label>Yahoo Finance Ticker</label><input id="aTicker" placeholder="e.g. CBA.AX" oninput="AF.ticker=this.value;updateConfigPreview()"/></div></div>
    <div style="background:var(--bg);border:1px solid var(--bdr);border-radius:9px;padding:12px;margin-bottom:12px"><div style="font-size:10px;color:var(--cyan);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">📋 Copy this into <code>stocks_config.json</code> in your GitHub repo → "custom_stocks" array:</div><pre id="cfgPreview" style="font-size:11px;color:var(--muted2);line-height:1.6;white-space:pre;overflow-x:auto;margin:0"></pre><button class="btn btn-ghost btn-xs" style="margin-top:8px" onclick="copyCfgEntry()">📋 Copy to clipboard</button><span id="cfgCopyMsg" style="font-size:10px;color:var(--green);display:none;margin-left:8px">✓ Copied!</span></div>
    <div id="aErr" class="err" style="display:none;margin-bottom:10px"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:4px"><a href="https://github.com/rauladi/fa-dashboard/blob/main/stocks_config.json" target="_blank" class="btn btn-ghost btn-sm" style="text-decoration:none">📂 Open stocks_config.json on GitHub</a><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="hideAdd()">Cancel</button><button class="btn btn-ghost btn-sm" onclick="submitManualShell()">✏ Enter Data Manually</button><button class="btn btn-cyan" onclick="submitAddStock()">＋ Add to Dashboard</button></div></div>`;
  updateTickerDefault();
  updateConfigPreview();
}
function updateCurDefault(){const m={IDX:'T IDR',ASX:'B AUD',NYSE:'B USD',NASDAQ:'B USD'}; const v=m[AF.exch]||'B USD'; const el=document.getElementById('aCur'); if(el){el.value=v;AF.cur=v;}}
function updateTickerDefault(){const sym=AF.sym; if(!sym) return; let ticker=sym; if(AF.exch==='ASX') ticker=sym+'.AX'; else if(AF.exch==='IDX') ticker=sym+'.JK'; AF.ticker=ticker; const el=document.getElementById('aTicker'); if(el) el.value=ticker; AF.hintCur = (AF.exch==='IDX') ? 'IDR' : 'USD'; if(AF.exch==='ASX') AF.hintCur='AUD';}
function updateConfigPreview(){const sym=(document.getElementById('aSym')?.value||'').toUpperCase()||'SYMBOL'; const name=document.getElementById('aName')?.value||'Company Name'; const exch=document.getElementById('aExch')?.value||'ASX'; const cur=document.getElementById('aCur')?.value||'B AUD'; const ticker=document.getElementById('aTicker')?.value||(sym+(exch==='ASX'?'.AX':exch==='IDX'?'.JK':'')); const hintCur=exch==='IDX'?'IDR':exch==='ASX'?'AUD':'USD'; const entry=`    {\n      "symbol": "${sym}",\n      "name": "${name}",\n      "exchange": "${exch}",\n      "currency": "${cur}",\n      "ticker": "${ticker}",\n      "hint_cur": "${hintCur}"\n    }`; const pre=document.getElementById('cfgPreview'); if(pre) pre.textContent=entry;}
function copyCfgEntry(){const pre=document.getElementById('cfgPreview'); if(!pre) return; navigator.clipboard.writeText(pre.textContent).then(()=>{const m=document.getElementById('cfgCopyMsg'); if(m){m.style.display='inline';setTimeout(()=>m.style.display='none',2500);}}).catch(()=>{const r=document.createRange();r.selectNode(pre);window.getSelection().removeAllRanges();window.getSelection().addRange(r);document.execCommand('copy');});}
function validateAddForm(){const sym=(document.getElementById('aSym')?.value||'').trim().toUpperCase(); const name=(document.getElementById('aName')?.value||'').trim(); const exch=document.getElementById('aExch')?.value; const cur=document.getElementById('aCur')?.value||''; if(!sym||!name){showAErr('Ticker symbol and company name are required.');return null;} return{sym,name,exch,cur};}
function showAErr(m){const e=document.getElementById('aErr');if(e){e.textContent='⚠ '+m;e.style.display='block';}}
function submitAddStock(){const f=validateAddForm();if(!f)return; const sd={name:f.name,exchange:f.exch,currency:f.cur}; S.custom[f.sym]=sd;S.stocks[f.sym]=sd;S.sel=f.sym;S.tab='data'; S.status[f.sym]='idle'; saveLS(); hideAdd(); render(); showToast(`✓ ${f.sym} added. Add it to stocks_config.json and run the GitHub Actions workflow to fetch data.`,'cyan');}
function submitManualShell(){const f=validateAddForm();if(!f)return; const sd={name:f.name,exchange:f.exch,currency:f.cur}; S.custom[f.sym]=sd;S.stocks[f.sym]=sd;S.sel=f.sym;S.tab='data'; hideAdd(); showManual(f.sym);}
let MA={sym:'',vals:{}};
function showManual(sym){const st=S.stocks[sym]; MA.sym=sym; MA.vals=Object.fromEntries(MKEYS.map(m=>[m.k, S.data[sym]?[...S.data[sym][m.k]]:Array(N_YEARS).fill('')])); const yH=YEARS.map(y=>`<th class="tc" style="min-width:60px">${y}</th>`).join(''); const rows=MKEYS.map((r,i)=>{const cells=YEARS.map((_,j)=>`<td style="padding:2px 2px"><input type="number" value="${isOK(MA.vals[r.k][j])?MA.vals[r.k][j]:''}" oninput="MA.vals['${r.k}'][${j}]=this.value" style="width:58px;background:var(--bg);border:1px solid var(--bdr);border-radius:5px;padding:3px 5px;font-size:11px;color:var(--txt);text-align:center"/></td>`).join(''); return`<tr class="${i%2?'ev':''}"><td class="lbl" style="padding:5px 10px;font-size:11px">${r.l}</td>${cells}</td>`; }).join(''); document.getElementById('addBody').innerHTML=`<p style="font-size:12px;color:var(--muted2);margin-bottom:12px"><strong style="color:var(--txt)">${sym} — ${st.name}</strong> · ${st.exchange} · ${st.currency}<br>Enter data for ${YEARS[0]}–${YEARS[YEARS.length-1]}. Leave blank for unavailable years.</p><div class="tw"><tr><thead><tr><th style="min-width:150px">Metric</th>${yH}</tr></thead><tbody>${rows}</tbody></table></div><div id="aErr" class="err" style="display:none"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn btn-ghost" onclick="hideAdd()">Cancel</button><button class="btn btn-cyan" onclick="submitManualData()">✓ Save Data</button></div>`; document.getElementById('addModal').style.display='flex';}
function submitManualData(){const sym=MA.sym; const parsed={}; for(const r of MKEYS){parsed[r.k]=MA.vals[r.k].map(v=>v===''||v===null||v===undefined?null:parseFloat(v)); if(parsed[r.k].some(v=>v!==null&&isNaN(v))){showAErr(`Invalid number in "${r.l}"`);return;}} S.data[sym]={...parsed, fetchedAt:Date.now(), source:'user-edited'}; S.status[sym]='ok'; saveLS();hideAdd();render(); showToast(`✓ ${sym} data saved`,'green');}
function delStock(k){const isBuiltIn=!!BASE_STOCKS[k]; const isConfigStock=!S.custom[k]&&!isBuiltIn; let msg; if(isBuiltIn){msg=`Remove ${k} from the dashboard view?\n\nNote: it will reappear on next page refresh since it's built-in. To permanently remove it you'd need to edit fetch_data.py.`;} else if(isConfigStock){msg=`Remove ${k} from the dashboard?\n\nIMPORTANT: Also remove it from stocks_config.json on GitHub, then run the workflow — otherwise it will reappear next time the page loads from data.json.`;} else {msg=`Remove ${k} from the dashboard?`;} if(!confirm(msg)) return; if(!S.deleted) S.deleted={}; S.deleted[k]=true; delete S.custom[k]; delete S.stocks[k]; delete S.data[k]; delete S.status[k]; if(S.sel===k) S.sel = Object.keys(S.stocks)[0] || 'BHP'; saveLS(); render(); showToast(`${k} removed`,'cyan');}

// ======================== RENDER ENGINE ========================
function renderSBar(){
  const ks=Object.keys(S.stocks);
  document.getElementById('sList').innerHTML=ks.map(k=>{
    const st=S.stocks[k];
    const ex=(st.exchange||'').toUpperCase();
    const bc=ex==='ASX'?'x-asx':ex==='IDX'?'x-idx':'x-us';
    const st2=S.status[k];
    const dot=st2==='ok'?'<span class="s-dot-ok"></span>':st2==='loading'?'<span class="s-dot-ld"></span>':st2==='error'?'<span class="s-dot-er"></span>':'';
    return`<button class="s-btn${S.sel===k?' on':''}" onclick="selStock('${k}')">${dot}${k}<span class="xbadge ${bc}">${ex}</span></button>`;
  }).join('');
}
function renderTabBtns(){
  ['data','ratios','chart','rankings','insights'].forEach(t=>{
    const e=document.getElementById('t-'+t);
    if(e) e.className='t-btn'+(S.tab===t?' on':'');
  });
}
function stateBox(st,sym,stock){
  const ticker=yahooTicker(sym, stock.exchange||'');
  if(st==='loading'){
    return`<div class="state-box"><div class="spinner"></div><div class="state-title">Refreshing ${sym} from Yahoo Finance…</div><div class="state-sub">Attempting live refresh for <em>${stock.name}</em><br>Ticker: <code style="background:rgba(0,0,0,.3);padding:1px 7px;border-radius:4px">${ticker}</code><br>Built-in data remains active if refresh fails.</div><span class="data-badge db-ld">⏳ Trying Yahoo Finance…</span></div>`;
  }
  const isCustom=!!S.custom[sym];
  return`<div class="state-box"><div style="font-size:36px;margin-bottom:12px">📋</div><div class="state-title">No data for ${sym}</div><div class="state-sub" style="max-width:500px;margin:0 auto 16px">${isCustom?`<strong>${stock.name}</strong> was added but data hasn't been fetched yet.<br><br>To fetch automatically:<br>1. Make sure <code style="background:rgba(0,0,0,.2);padding:1px 6px;border-radius:3px">${sym}</code> is in your <strong>stocks_config.json</strong> on GitHub<br>2. Go to <strong>Actions → Refresh Financial Data → Run workflow</strong><br>3. Refresh this page after the workflow completes (~1 min)`: `This stock has no data yet.`}</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn btn-cyan" onclick="showManual('${sym}')">✏ Enter Data Manually</button>${isCustom?`<button class="btn btn-red btn-sm" onclick="delStock('${sym}')">🗑 Remove ${sym}</button>`:''}</div>${isCustom?`<div style="margin-top:12px"><a href="https://github.com/rauladi/fa-dashboard/actions" target="_blank" class="btn btn-ghost btn-sm" style="text-decoration:none">🚀 Open GitHub Actions</a></div>`:''}</div>`;
}
function renderMain(){
  const cont=document.getElementById('cont');
  try{
    if(S.tab==='rankings'){ cont.innerHTML=tabRankings(); return; }
    if(S.tab==='insights'){
      const st=S.stocks[S.sel];
      cont.innerHTML=tabInsights(S.sel, st);
      return;
    }
    const st=S.stocks[S.sel];
    const stat=S.status[S.sel]||'idle';
    if(stat==='loading'){ cont.innerHTML=stateBox('loading',S.sel,st); return; }
    if(!S.data[S.sel]){ cont.innerHTML=stateBox('none',S.sel,st); return; }
    if(S.tab==='data') cont.innerHTML=tabData(S.sel,st);
    else if(S.tab==='ratios') cont.innerHTML=tabRatios(S.sel,st);
    else if(S.tab==='chart'){
      cont.innerHTML=tabChartHTML(S.sel,st);
      setTimeout(()=>makeChart(S.sel),80);
    }
  }catch(e){
    console.error('Render error',e);
    cont.innerHTML=`<div class="state-box"><div class="state-title">⚠️ Render Error</div><div class="state-sub">${e.message}</div></div>`;
  }
}
function render(){ renderSBar(); renderTabBtns(); renderMain(); saveLS(); }

// ======================== BOOT ========================
async function boot(){
  loadLS();
  initPreloadedData();
  let liveData = null;
  if(location.protocol !== 'file:'){
    try{
      const r = await fetch('./data.json?_='+Date.now());
      if(r.ok){
        liveData = await r.json();
        console.log('Loaded data.json — generated:', liveData.generated);
      }
    }catch(e){ console.log('data.json not available, using built-in data'); }
  }
  if(liveData && liveData.stocks){
    ANNUALISATION = liveData.annualisation || {};
    const ts = Date.now();
    S.stocks = {...BASE_STOCKS};
    S.custom = {};
    S.deleted = {};
    Object.entries(liveData.stocks).forEach(([sym, sd])=>{
      const hasData = Array.isArray(sd.revenue) && sd.revenue.some(v=>v!==null);
      S.stocks[sym] = { name: sd.name||sym, exchange: sd.exchange||'NYSE', currency: sd.currency||'B USD' };
      S.data[sym] = {
        totalAsset: sd.totalAsset, cash: sd.cash, totalDebt: sd.totalDebt, totalEquity: sd.totalEquity,
        revenue: sd.revenue, grossProfit: sd.grossProfit, netProfit: sd.netProfit, eps: sd.eps, dps: sd.dps,
        fetchedAt: ts, source: sd.source==='yfinance'?'yfinance':'built-in', ticker: sd.ticker, generated: liveData.generated,
        profile: sd.profile, profileDate: sd.profileDate, news: sd.news, newsDate: sd.newsDate
      };
      S.status[sym] = hasData ? 'ok' : 'idle';
    });
    const genDate = new Date(liveData.generated).toLocaleDateString();
    const n = Object.keys(liveData.stocks).length;
    const hSub = document.getElementById('hSub');
    if(hSub) hSub.textContent = `ASX · IDX · NYSE/NASDAQ — Auto-refreshed ${genDate} · ${n} stocks · ${YEARS[0]}–${YEARS[N_YEARS-1]}`;
    if(!S.stocks[S.sel]) S.sel = Object.keys(S.stocks)[0] || 'BHP';
  } else {
    const hSub = document.getElementById('hSub');
    if(hSub) hSub.textContent = `ASX · IDX · NYSE/NASDAQ — Built-in data · ${YEARS[0]}–${YEARS[N_YEARS-1]} · Host on GitHub Pages for auto-refresh`;
    if(!S.stocks[S.sel]) S.sel = 'BHP';
  }
  Object.keys(S.stocks).forEach(k=>{ if(!S.status[k]) S.status[k]=S.data[k]?'ok':'idle'; });
  render();
}
boot();

function fetchAll(){ showToast('Manual refresh not needed – data is built‑in. Use Edit button to update numbers.','cyan'); }
