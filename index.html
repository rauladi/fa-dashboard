<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>FA Dashboard — Fundamental Analysis | Modern Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-deep: #0a0c12; --bg-surface-1: rgba(15, 25, 35, 0.75); --bg-surface-2: rgba(20, 32, 45, 0.85);
  --border-glow: rgba(0, 224, 255, 0.3); --border-light: rgba(72, 110, 144, 0.4);
  --accent-cyan: #00e4ff; --accent-cyan-glow: rgba(0, 228, 255, 0.25); --accent-green: #00f5a0;
  --accent-red: #ff5a7a; --accent-gold: #ffcf4a; --accent-purple: #c0a5ff; --accent-blue: #5a9eff;
  --text-primary: #f0f6ff; --text-secondary: #b8d0ea; --text-muted: #6c8db0;
  --glass-blur: blur(16px); --shadow-sm: 0 8px 20px rgba(0,0,0,0.3); --transition-fast: 0.2s ease;
}
body { background: radial-gradient(circle at 10% 20%, #0f1722, #03050b); color: var(--text-primary); font-family: 'Inter', sans-serif; min-height: 100vh; line-height: 1.4; letter-spacing: -0.01em; }
::-webkit-scrollbar { width: 5px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 10px; }
#hdr { background: rgba(8, 16, 24, 0.75); backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--border-glow); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 200; box-shadow: var(--shadow-sm); }
.h-logo { width: 42px; height: 42px; border-radius: 16px; background: linear-gradient(135deg, var(--accent-cyan), #0077b3); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #fff; box-shadow: 0 0 12px var(--accent-cyan-glow); }
.h-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; background: linear-gradient(135deg, #fff, var(--accent-cyan)); background-clip: text; -webkit-background-clip: text; color: transparent; }
.h-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 40px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; transition: var(--transition-fast); backdrop-filter: blur(4px); }
.btn-cyan { background: linear-gradient(105deg, var(--accent-cyan), #0088aa); color: #03050b; }
.btn-green { background: linear-gradient(105deg, var(--accent-green), #00b87a); color: #03050b; }
.btn-ghost { background: rgba(255,255,255,0.05); color: var(--text-secondary); border: 1px solid rgba(0,228,255,0.2); }
.btn-ghost:hover { background: rgba(0,228,255,0.1); color: var(--accent-cyan); }
.btn-red { background: rgba(255,90,122,0.15); color: #ff8aab; border: 1px solid rgba(255,90,122,0.3); }
.btn-sm { padding: 5px 12px; font-size: 11px; }
.btn-xs { padding: 3px 10px; font-size: 10px; }
#sBar { background: rgba(8, 16, 24, 0.6); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-light); padding: 10px 20px; overflow-x: auto; position: sticky; top: 66px; z-index: 199; }
.s-list { display: flex; gap: 8px; min-width: max-content; }
.s-btn { padding: 6px 14px; border-radius: 40px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; background: rgba(20, 32, 45, 0.8); color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
.s-btn:hover { background: rgba(0,228,255,0.15); color: var(--accent-cyan); }
.s-btn.on { background: linear-gradient(95deg, var(--accent-cyan), #0099bb); color: #03050b; box-shadow: 0 0 12px var(--accent-cyan-glow); }
.xbadge { font-size: 9px; padding: 2px 8px; border-radius: 20px; font-weight: 700; background: rgba(0,0,0,0.3); }
#tBar { background: rgba(8, 16, 24, 0.6); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-light); padding: 0 24px; display: flex; overflow-x: auto; position: sticky; top: 108px; z-index: 198; }
.t-btn { padding: 12px 18px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; }
.t-btn:hover { color: var(--text-secondary); }
.t-btn.on { border-bottom-color: var(--accent-cyan); color: var(--accent-cyan); }
#cont { padding: 24px; max-width: 1600px; margin: 0 auto; }
.sec { margin-bottom: 28px; }
.sec-t { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-cyan); margin-bottom: 14px; padding-left: 12px; border-left: 3px solid var(--accent-cyan); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.card { background: var(--bg-surface-2); backdrop-filter: blur(4px); border: 1px solid rgba(0,228,255,0.15); border-radius: 20px; padding: 14px 16px; }
.card:hover { border-color: var(--accent-cyan); }
.card-l { font-size: 10px; color: var(--text-muted); margin-bottom: 8px; }
.card-v { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #fff, var(--accent-cyan)); background-clip: text; -webkit-background-clip: text; color: transparent; }
.tw { overflow-x: auto; border-radius: 20px; border: 1px solid rgba(0,228,255,0.15); background: rgba(8, 16, 24, 0.5); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th { background: rgba(0, 150, 180, 0.2); padding: 12px 12px; text-align: left; font-size: 10px; text-transform: uppercase; color: var(--accent-cyan); font-weight: 700; }
tbody td { padding: 10px 12px; border-bottom: 1px solid rgba(72, 110, 144, 0.2); white-space: nowrap; }
tbody tr:hover td { background: rgba(0, 228, 255, 0.05); }
.s-dot-ok, .s-dot-ld, .s-dot-er { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.s-dot-ok { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
.s-dot-er { background: var(--accent-red); }
.wt-wrap { border-radius: 24px; padding: 20px; background: var(--bg-surface-2); backdrop-filter: blur(8px); border: 1px solid rgba(0,228,255,0.2); }
.wt-card { background: var(--bg-surface-1); border-radius: 18px; padding: 12px; }
.wt-card.ov { border: 1px solid var(--accent-gold); background: rgba(255,207,74,0.08); }
.wt-inp { width: 65px; background: #0c121c; border: 1px solid var(--border-light); border-radius: 12px; padding: 6px 8px; font-size: 13px; font-weight: 700; color: var(--text-primary); }
.wt-inp:focus { outline: none; border-color: var(--accent-cyan); }
.state-box { background: var(--bg-surface-2); backdrop-filter: blur(8px); border: 1px solid rgba(0,228,255,0.2); border-radius: 32px; padding: 48px 24px; text-align: center; }
.spinner { width: 40px; height: 40px; border: 2px solid rgba(0,228,255,0.2); border-top-color: var(--accent-cyan); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.rc { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 30px; font-size: 11px; font-weight: 800; }
.rc1 { background: var(--accent-gold); color: #0a0c12; }
.rc2 { background: #adc6ff; color: #03050b; }
.rc3 { background: var(--accent-purple); color: #03050b; }
.rc4 { background: var(--accent-green); color: #03050b; }
.rc5 { background: var(--accent-blue); color: #03050b; }
.insights-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.ai-content { background: var(--bg-surface-1); backdrop-filter: blur(8px); border-radius: 24px; padding: 20px; border: 1px solid rgba(0,228,255,0.15); margin-bottom: 16px; }
.ai-content h2 { font-size: 16px; font-weight: 700; color: var(--accent-cyan); margin-bottom: 14px; border-left: 3px solid var(--accent-cyan); padding-left: 12px; }
.ai-content ul { list-style: none; padding-left: 0; }
.ai-content li { font-size: 12px; color: var(--b8d0ea, #b8d0ea); line-height: 1.6; padding-left: 14px; position: relative; margin-bottom: 6px; }
.ai-content li:before { content: "▸"; position: absolute; left: 0; color: var(--accent-cyan); }
.chart-box { background: var(--bg-surface-2); border-radius: 24px; padding: 18px; border: 1px solid rgba(0,228,255,0.2); }
#chartWrap { position: relative; height: 450px; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--bg-surface-2); border: 1px solid var(--accent-cyan); border-radius: 32px; width: 100%; max-width: 980px; max-height: 90vh; overflow-y: auto; }
.modal-h { padding: 18px 24px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: inherit; backdrop-filter: blur(12px); }
@media (max-width: 640px) { #cont { padding: 16px; } .cards { grid-template-columns: repeat(2,1fr); } .insights-two-col { grid-template-columns: 1fr; } .h-title { font-size: 15px; } #chartWrap { height: 280px; } }
.pos { color: var(--accent-green); font-weight: 600; }
.neg { color: var(--accent-red); }
.cya { color: var(--accent-cyan); }
.src-bar { background: rgba(8, 16, 24, 0.7); border-radius: 20px; padding: 12px 20px; margin-bottom: 20px; border: 1px solid rgba(0,228,255,0.2); }
#debugPanel { position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); border: 1px solid var(--accent-cyan); border-radius: 12px; padding: 10px 15px; font-size: 10px; color: var(--text-muted); z-index: 9999; display: none; }
#debugPanel.visible { display: block; }

/* --- NEW RANKINGS TAB STYLES --- */
.rankings-grid { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 20px; margin-bottom: 24px; }
@media (max-width: 1100px) { .rankings-grid { grid-template-columns: 1fr 1fr; } .rankings-grid > div:last-child { grid-column: span 2; } }
@media (max-width: 768px) { .rankings-grid { grid-template-columns: 1fr; } .rankings-grid > div:last-child { grid-column: span 1; } }

/* Podium */
.podium-card { background: var(--bg-surface-2); border-radius: 24px; padding: 20px; text-align: center; border: 1px solid var(--border-light); position: relative; transition: transform 0.2s; cursor: pointer; }
.podium-card:hover { transform: translateY(-4px); }
.podium-card.rank-1 { border-color: var(--accent-gold); background: linear-gradient(180deg, rgba(255,207,74,0.1) 0%, rgba(20,32,45,0.9) 100%); box-shadow: 0 0 20px rgba(255,207,74,0.15); }
.podium-card.rank-2 { border-color: #adc6ff; background: linear-gradient(180deg, rgba(173,198,255,0.1) 0%, rgba(20,32,45,0.9) 100%); }
.podium-card.rank-3 { border-color: var(--accent-purple); background: linear-gradient(180deg, rgba(192,165,255,0.1) 0%, rgba(20,32,45,0.9) 100%); }
.podium-rank { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
.rank-1 .podium-rank { background: var(--accent-gold); color: #000; box-shadow: 0 0 10px var(--accent-gold); }
.rank-2 .podium-rank { background: #adc6ff; color: #000; }
.rank-3 .podium-rank { background: var(--accent-purple); color: #000; }
.podium-logo { width: 48px; height: 48px; border-radius: 14px; margin: 10px auto 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; background: rgba(0,0,0,0.3); }
.podium-ticker { font-size: 20px; font-weight: 800; }
.podium-name { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
.podium-score { font-size: 24px; font-weight: 800; color: var(--accent-gold); }

/* Scatter Plot */
.chart-container { background: var(--bg-surface-2); border-radius: 24px; padding: 16px; border: 1px solid var(--border-light); position: relative; height: 100%; min-height: 320px; }
.chart-container canvas { max-height: 280px; }

/* Selected Stock Panel */
.selected-panel { background: var(--bg-surface-2); border-radius: 24px; padding: 20px; border: 1px solid var(--border-light); height: 100%; display: flex; flex-direction: column; }
.selected-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border-light); }
.selected-logo { width: 42px; height: 42px; border-radius: 12px; background: rgba(0,228,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: var(--accent-cyan); }
.selected-info { flex: 1; }
.selected-ticker { font-size: 16px; font-weight: 700; }
.selected-name { font-size: 11px; color: var(--text-muted); }
.selected-score-box { text-align: right; }
.selected-score { font-size: 20px; font-weight: 800; color: var(--accent-cyan); }
.selected-rank { font-size: 10px; color: var(--text-muted); }
.factor-row { margin-bottom: 10px; }
.factor-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-secondary); margin-bottom: 4px; }
.factor-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.factor-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
.strengths-weaknesses { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-light); }
.sw-item { font-size: 11px; margin-bottom: 6px; display: flex; align-items: flex-start; gap: 6px; }
.sw-icon { font-size: 12px; margin-top: 1px; }

/* Heatmap Table */
.heatmap-table { width: 100%; border-collapse: separate; border-spacing: 4px; }
.heatmap-table th { background: transparent; color: var(--text-muted); font-size: 9px; text-transform: uppercase; padding: 6px 4px; text-align: center; border: none; }
.heatmap-table td { padding: 8px 6px; border-radius: 8px; text-align: center; font-size: 11px; font-weight: 600; transition: transform 0.1s; cursor: pointer; }
.heatmap-table td:hover { transform: scale(1.05); }
.heatmap-table .stock-cell { text-align: left; display: flex; align-items: center; gap: 8px; padding-left: 12px; }
.heatmap-table .stock-cell .ticker { font-weight: 800; font-size: 12px; }
.heatmap-table .stock-cell .name { font-size: 10px; color: var(--text-muted); }
.heatmap-cell-1 { background: rgba(0, 245, 160, 0.9); color: #000; box-shadow: 0 0 8px rgba(0,245,160,0.4); }
.heatmap-cell-2 { background: rgba(0, 245, 160, 0.7); color: #000; }
.heatmap-cell-3 { background: rgba(0, 228, 255, 0.6); color: #000; }
.heatmap-cell-4 { background: rgba(90, 158, 255, 0.5); color: #fff; }
.heatmap-cell-5 { background: rgba(192, 165, 255, 0.5); color: #fff; }
.heatmap-cell-6 { background: rgba(255, 207, 74, 0.5); color: #000; }
.heatmap-cell-7 { background: rgba(255, 150, 74, 0.5); color: #000; }
.heatmap-cell-8 { background: rgba(255, 90, 122, 0.5); color: #fff; }
.heatmap-cell-9 { background: rgba(255, 90, 122, 0.7); color: #fff; }
.heatmap-cell-10 { background: rgba(255, 90, 122, 0.9); color: #fff; box-shadow: 0 0 8px rgba(255,90,122,0.4); }

/* Category Leaders */
.cat-leaders { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.cat-card { background: var(--bg-surface-2); border-radius: 16px; padding: 12px; border: 1px solid var(--border-light); display: flex; align-items: center; gap: 10px; cursor: pointer; transition: border-color 0.2s; }
.cat-card:hover { border-color: var(--accent-cyan); }
.cat-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.cat-info { flex: 1; }
.cat-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; }
.cat-ticker { font-size: 13px; font-weight: 700; }
.cat-value { font-size: 10px; color: var(--accent-cyan); }
</style>
</head>
<body>
<div id="hdr">
  <div style="display:flex;align-items:center;gap:12px">
    <div class="h-logo">FA</div>
    <div>
      <div class="h-title">Fundamental Analysis Dashboard</div>
      <div class="h-sub" id="hSub">ASX · IDX · NYSE/NASDAQ — loading...</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <button class="btn btn-ghost btn-sm" onclick="forceRefresh()">🔄 Force Refresh</button>
    <button class="btn btn-ghost btn-sm" onclick="showSync()">🔄 Sync</button>
    <button class="btn btn-green btn-sm" onclick="showAdd()">＋ Add Stock</button>
  </div>
</div>
<div id="sBar"><div class="s-list" id="sList"></div></div>
<div id="tBar">
  <button class="t-btn on" id="t-data" onclick="setTab('data')">📋 Data</button>
  <button class="t-btn" id="t-ratios" onclick="setTab('ratios')">📐 Ratios</button>
  <button class="t-btn" id="t-chart" onclick="setTab('chart')">📈 Chart</button>
  <button class="t-btn" id="t-rankings" onclick="setTab('rankings')">🏆 Rankings</button>
  <button class="t-btn" id="t-insights" onclick="setTab('insights')">💡 Insights</button>
</div>
<div id="cont"></div>
<div id="addModal" class="modal-bg" style="display:none"><div class="modal"><div class="modal-h"><h3>＋ Add New Stock</h3><button onclick="hideAdd()">×</button></div><div id="addBody" style="padding:20px"></div></div></div>
<div id="syncModal" class="modal-bg" style="display:none"><div class="modal"><div class="modal-h"><h3>🔄 Sync Between Devices</h3><button onclick="hideSync()">×</button></div><div id="syncBody" style="padding:20px"></div></div></div>
<div id="debugPanel"></div>
<script>
const CURRENT_YEAR = new Date().getFullYear();
const LATEST_YEAR = CURRENT_YEAR - 1;
const YEARS = Array.from({length:5}, (_,i) => LATEST_YEAR - 4 + i).concat([CURRENT_YEAR]);
const N_YEARS = YEARS.length;
let ANNUALISATION = {};
const LS_KEY='fa_v5';
const DATA_VERSION_KEY = 'fa_data_version';

const BASE_STOCKS={
  BHP:{name:"BHP Group",exchange:"ASX",currency:"B AUD"}, WDS:{name:"Woodside Energy",exchange:"ASX",currency:"B AUD"}, CBA:{name:"Commonwealth Bank",exchange:"ASX",currency:"B AUD"},
  NAB:{name:"National Australia Bank",exchange:"ASX",currency:"B AUD"}, ANZ:{name:"ANZ Group Holdings Ltd",exchange:"ASX",currency:"B AUD"},
  BBRI:{name:"Bank Rakyat Indonesia",exchange:"IDX",currency:"T IDR"}, ADRO:{name:"Alamtri Resources Indonesia",exchange:"IDX",currency:"T IDR"}, SMSM:{name:"Selamat Sempurna",exchange:"IDX",currency:"T IDR"},
  UNTR:{name:"United Tractors",exchange:"IDX",currency:"T IDR"}, ITMG:{name:"Indo Tambangraya Megah",exchange:"IDX",currency:"T IDR"}, POWR:{name:"Cikarang Listrindo",exchange:"IDX",currency:"T IDR"},
  MPMX:{name:"Mitra Pinasthika Mustika",exchange:"IDX",currency:"T IDR"}, BTPS:{name:"Bank BTPN Syariah",exchange:"IDX",currency:"T IDR"}, DMAS:{name:"Puradelta Lestari",exchange:"IDX",currency:"T IDR"},
  SPTO:{name:"Surya Toto Indonesia",exchange:"IDX",currency:"T IDR"}, TSM:{name:"Taiwan Semiconductor",exchange:"NYSE",currency:"B USD"}, V:{name:"Visa Inc.",exchange:"NYSE",currency:"B USD"},
  MA:{name:"Mastercard Inc.",exchange:"NYSE",currency:"B USD"}, "PBR-A":{name:"Petrobras Pref ADR",exchange:"NYSE",currency:"B USD"}, MSFT:{name:"Microsoft Corp.",exchange:"NASDAQ",currency:"B USD"},
  AMZN:{name:"Amazon.com Inc.",exchange:"NASDAQ",currency:"B USD"}, AAPL:{name:"Apple Inc.",exchange:"NASDAQ",currency:"B USD"}, META:{name:"Meta Platforms Inc.",exchange:"NASDAQ",currency:"B USD"},
  NVDA:{name:"NVIDIA Corporation",exchange:"NASDAQ",currency:"B USD"}, GOOG:{name:"Alphabet Inc (Google)",exchange:"NASDAQ",currency:"B USD"}, BKNG:{name:"Booking Holdings Inc",exchange:"NASDAQ",currency:"B USD"},
  AVGO:{name:"Broadcom Inc",exchange:"NASDAQ",currency:"B USD"}, CVX:{name:"Chevron Corporation",exchange:"NYSE",currency:"B USD"},
  AXP:{name:"American Express",exchange:"NYSE",currency:"B USD"}, BAC:{name:"Bank of America",exchange:"NYSE",currency:"B USD"},

  ALD:{name:"Ampol Limited",exchange:"ASX",currency:"B AUD"},
  MQG:{name:"Macquarie Group Limited",exchange:"ASX",currency:"B AUD"},
  ASML:{name:"ASML Holding NV",exchange:"NASDAQ",currency:"B USD"}

const DEF_WTS={cashToAsset:10,debtToEquity:5,revenueCagr:5,gpmAvg:0,netProfitCagr:5,npmAvg:30,epsCagr:5,dpsCagr:0,roeAvg:25,dividendPayout:0,buffettTest:15};
const CRITERIA=[
  {key:"cashToAsset",wKey:"cashToAsset",label:"Cash/Asset",hi:true},{key:"debtToEquity",wKey:"debtToEquity",label:"D/E Ratio",hi:false},
  {key:"revenueCagr",wKey:"revenueCagr",label:"Rev CAGR",hi:true},{key:"gpmAvg",wKey:"gpmAvg",label:"GP Margin",hi:true},
  {key:"netProfitCagr",wKey:"netProfitCagr",label:"NP CAGR",hi:true},{key:"npmAvg",wKey:"npmAvg",label:"NP Margin",hi:true},
  {key:"epsCagr",wKey:"epsCagr",label:"EPS CAGR",hi:true},{key:"dpsCagr",wKey:"dpsCagr",label:"DPS CAGR",hi:true},
  {key:"roeAvg",wKey:"roeAvg",label:"ROE",hi:true},{key:"dividendPayout",wKey:"dividendPayout",label:"Div Payout",hi:true},

function calcM(symbol){

  const sl=k=>(data[k]||Array(N_YEARS).fill(null)).slice(0,N_YEARS);
  const ta=sl('totalAsset'),ca=sl('cash'),td=sl('totalDebt'),te=sl('totalEquity');
  const rv2=sl('revenue'),gp=sl('grossProfit'),np=sl('netProfit'),ep=sl('eps'),dp=sl('dps');
  const Y=YEARS.map((yr,i)=>({year:yr,totalAsset:ta[i],cash:ca[i],totalDebt:td[i],totalEquity:te[i],revenue:rv2[i],grossProfit:gp[i],netProfit:np[i],eps:ep[i],dps:dp[i],
    cashToAsset:(isOK(ta[i])&&ta[i]>0&&isOK(ca[i]))?ca[i]/ta[i]*100:null,

    divPayout:(isOK(ep[i])&&ep[i]>0&&isOK(dp[i]))?dp[i]/ep[i]*100:null,
    valLow:isOK(dp[i])?dp[i]*10:null,valHigh:isOK(dp[i])?dp[i]*20:null,retEps:null}));
  const av={cashToAsset:avg(Y.map(y=>y.cashToAsset)),debtToEquity:avg(Y.map(y=>y.debtToEquity)),gpm:avg(Y.map(y=>y.gpm)),npm:avg(Y.map(y=>y.npm)),roa:avg(Y.map(y=>y.roa)),roe:avg(Y.map(y=>y.roe)),divPayout:avg(Y.map(y=>y.divPayout))};
  const cg={rev:cagr(rv2),np:cagr(np),eps:cagr(ep),dps:cagr(dp)};
  const NC=N_YEARS-1,epCompleted=ep.slice(0,NC),dpCompleted=dp.slice(0,NC);
  const retEpsCompleted=epCompleted.map((e,i)=>{if(!isOK(e))return null;const d=isOK(dpCompleted[i])?dpCompleted[i]:0;return e-d;});
  const retEpsVals=retEpsCompleted.filter(isOK);
  const totRet=retEpsVals.length>0?retEpsVals.reduce((s,v)=>s+v,0):null;
  const epCompletedOK=epCompleted.filter(isOK);
  const epsInc=epCompletedOK.length>=2?epCompletedOK[epCompletedOK.length-1]-epCompletedOK[0]:null;
  const buff=(isOK(totRet)&&Math.abs(totRet)>0.001&&isOK(epsInc))?epsInc/totRet*100:null;
  Y.forEach((y,i)=>{if(!isOK(y.eps)){y.retEps=null;return;}const d=isOK(y.dps)?y.dps:0;y.retEps=y.eps-d;});
  return {Y,av,cg,epsInc,totRet,buff,raw:{ta,ca,td,te,rv:rv2,gp,np,ep,dp},rm:{cashToAsset:av.cashToAsset,debtToEquity:av.debtToEquity,revenueCagr:cg.rev,gpmAvg:av.gpm,netProfitCagr:cg.np,npmAvg:av.npm,epsCagr:cg.eps,dpsCagr:cg.dps,roeAvg:av.roe,dividendPayout:av.divPayout,buffettTest:buff}};
}

function calcRanks(wts){const ks=Object.keys(S.stocks).filter(k=>S.status[k]==='ok');const N=ks.length;if(!N)return{ranks:{},scores:{},fr:{}};const allM=Object.fromEntries(ks.map(k=>[k,calcM(k)]));const ranks=Object.fromEntries(ks.map(k=>[k,{}]));CRITERIA.forEach(c=>{const vs=ks.map(k=>({k,v:allM[k]?.rm[c.key]}));vs.sort((a,b)=>{if(!isOK(a.v)&&!isOK(b.v))return 0;if(!isOK(a.v))return 1;if(!isOK(b.v))return-1;return c.hi?b.v-a.v:a.v-b.v;});vs.forEach((x,i)=>{ranks[x.k][c.key]=i+1;});});const scores=Object.fromEntries(ks.map(k=>{const ws=CRITERIA.reduce((s,c)=>s+(ranks[k][c.key]||N)*(wts[c.wKey]||0)/100,0);return[k,{ranks:ranks[k],ws,m:allM[k]}];}));const sorted=[...ks].sort((a,b)=>scores[a].ws-scores[b].ws);const fr=Object.fromEntries(sorted.map((k,i)=>[k,i+1]));return{ranks,scores,fr};}

          <thead>

              <th style="text-align:left;padding-left:12px;">Stock</th>
              ${CRITERIA.map(c => `<th>${c.label}<br><span style="color:var(--accent-cyan);font-size:8px;">${S.wts[c.wKey]||0}%</span></th>`).join('')}
              <th style="text-align:right;padding-right:12px;">Score</th>
            </tr>
          </thead>
          <tbody>${heatmapRows}</tbody>
        </table>
      </div>
    </div>
  `;

  // 5. Category Leaders
  const catLeaders = [
    { label: 'Best Balance Sheet', icon: '⚖️', key: 'cashToAsset', color: 'var(--accent-blue)' },
    { label: 'Best Growth', icon: '📈', key: 'revenueCagr', color: 'var(--accent-green)' },
    { label: 'Best Profitability', icon: '💰', key: 'npmAvg', color: 'var(--accent-gold)' },
    { label: 'Best Earnings', icon: '📊', key: 'epsCagr', color: 'var(--accent-purple)' },
    { label: 'Best Dividends', icon: '💵', key: 'dpsCagr', color: 'var(--accent-cyan)' },
    { label: 'Best ROE', icon: '🚀', key: 'roeAvg', color: 'var(--accent-red)' },
    { label: 'Lowest Payout', icon: '🛡️', key: 'dividendPayout', color: 'var(--text-secondary)' },
    { label: 'Buffett $1 Test', icon: '🧠', key: 'buffettTest', color: 'var(--accent-gold)' },
    { label: 'Most Well-Rounded', icon: '⭐', key: 'overall', color: 'var(--accent-cyan)' }
  ];

  const catHtml = catLeaders.map(cat => {
    let bestSym = '';
    let bestVal = -Infinity;
    if (cat.key === 'overall') {
      bestSym = rankedKs[0];
      bestVal = scores[bestSym].ws;
    } else {
      rankedKs.forEach(k => {
        const m = calcM(k);
        const val = m.rm[cat.key];
        if (isOK(val) && val > bestVal) {
          bestVal = val;
          bestSym = k;
        }
      });
    }
    if (!bestSym) return '';
    const st = S.stocks[bestSym];
    const valStr = cat.key === 'overall' ? bestVal.toFixed(2) : P1(bestVal);
    return `
      <div class="cat-card" onclick="selStock('${bestSym}');render();">
        <div class="cat-icon" style="background:${cat.color}20;color:${cat.color};">${cat.icon}</div>
        <div class="cat-info">
          <div class="cat-label">${cat.label}</div>
          <div class="cat-ticker">${bestSym}</div>
          <div class="cat-value">${valStr}</div>
        </div>
      </div>
    `;
  }).join('');

  const catLeadersHtml = `
    <div class="sec">
      <div class="sec-t">Category Leaders</div>
      <div class="cat-leaders">${catHtml}</div>
    </div>
  `;

  // 6. Weights UI (Collapsible)
  const wCatBlocks = CAT_GROUPS.map(g => {
    const sub = catSubtotal(g.keys);
    const cards = g.keys.map(wk => {
      const c = CRIT_MAP[wk];
      const w = S.wts[wk] || 0;
      const ov = w > 5;
      return `<div class="wt-card${ov?' ov':''}" style="flex:1;min-width:100px"><div style="font-size:10px;margin-bottom:6px">${c.label}${ov?'<br><span style="font-size:9px;color:var(--accent-gold)">⚠ High</span>':''}</div><div style="display:flex;align-items:center;gap:4px"><input type="number" min="0" max="100" step="1" value="${w}" class="wt-inp" onchange="setWt('${wk}',this.value)"/><span style="font-size:11px">%</span></div></div>`;
    }).join('');
    return `<div style="border:1px solid ${g.border};background:${g.bg};border-radius:20px;padding:12px;flex:1;min-width:200px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><span style="font-size:11px;font-weight:700;color:${g.color}">${g.label}</span><span style="font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;background:${g.bg};border:1px solid ${g.border};color:${g.color}">${sub.toFixed(0)}%</span></div><div style="display:flex;flex-wrap:wrap;gap:8px">${cards}</div></div>`;
  }).join('');

  const weightsHtml = `
    <details style="margin-bottom:20px;background:var(--bg-surface-2);border-radius:20px;border:1px solid var(--border-light);padding:12px;">
      <summary style="cursor:pointer;font-size:12px;font-weight:700;color:var(--accent-cyan);">⚙️ Adjust Scoring Weights</summary>
      <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">${wCatBlocks}</div>
    </details>
  `;

  return `
    <div>
      ${weightsHtml}
      <div class="rankings-grid">
        <div>
          <div class="sec-t" style="margin-bottom:10px;">Top 3 Overall</div>
          <div style="display:flex;flex-direction:column;gap:16px;">${podiumHtml}</div>
        </div>
        <div>
          <div class="sec-t" style="margin-bottom:10px;">Quality vs Growth</div>
          <div class="chart-container">
            <canvas id="scatterChart"></canvas>
          </div>
        </div>
        <div>
          <div class="sec-t" style="margin-bottom:10px;">Selected Stock</div>
          ${selectedPanelHtml}
        </div>
      </div>
      ${heatmapHtml}
      ${catLeadersHtml}
    </div>
  `;
}

function renderMain(){
  const cont=document.getElementById('cont');

  if(S.tab==='data')cont.innerHTML=tabData(S.sel,st);else if(S.tab==='ratios')cont.innerHTML=tabRatios(S.sel,st);else if(S.tab==='chart'){cont.innerHTML=tabChartHTML(S.sel,st);setTimeout(()=>makeChart(S.sel),80);}
}

  }

    Object.entries(liveData.stocks).forEach(([sym,sd])=>{const hasData=Array.isArray(sd.revenue)&&sd.revenue.some(v=>v!==null);S.stocks[sym]={name:sd.name||sym,exchange:sd.exchange||'NYSE',currency:sd.currency||'B USD'};const existing=S.data[sym];if(!existing||existing.source!=='user-edited'){const base=existing?{...existing}:{};const fields=['totalAsset','cash','totalDebt','totalEquity','revenue','grossProfit','netProfit','eps','dps'];fields.forEach(f=>{const liveArr=sd[f]||[];const baseArr=base[f]||Array(N_YEARS).fill(null);base[f]=baseArr.map((v,idx)=>(idx<liveArr.length&&liveArr[idx]!==null&&liveArr[idx]!==undefined)?liveArr[idx]:v);});S.data[sym]={...base,fetchedAt:ts,source:sd.source==='yfinance'?'yfinance':'built-in',ticker:sd.ticker,generated:liveData.generated,profile:sd.profile,profileDate:sd.profileDate};S.status[sym]=hasData?'ok':'idle';}});
    const genDate=new Date(liveData.generated).toLocaleDateString();const n=Object.keys(liveData.stocks).length;const hSub=document.getElementById('hSub');if(hSub)hSub.textContent=`ASX · IDX · NYSE/NASDAQ — Auto-refreshed ${genDate} · ${n} stocks · ${YEARS[0]}–${YEARS[N_YEARS-1]} · 📡 Live`;
    if(!S.stocks[S.sel])S.sel=Object.keys(S.stocks)[0]||'BHP';
  }else{

  }
  Object.keys(S.stocks).forEach(k=>{if(!S.status[k])S.status[k]=S.data[k]?'ok':'idle';});
  render();
}

function generateCustomTornado(sym,st,m){
  const customRisks={

    "BBRI":[{name:"Microfinance NPL",low:-35,high:8},{name:"IDR depreciation",low:-20,high:10},{name:"KUR program changes",low:-25,high:5},{name:"Digital bank competition",low:-15,high:10},{name:"Rural downturn",low:-28,high:12}],

    "NAB":[{name:"Business credit cycle",low:-30,high:15},{name:"NIM compression",low:-20,high:10},{name:"Home loan competition",low:-15,high:5},{name:"Tech execution risk",low:-18,high:8},{name:"Regulatory capital",low:-12,high:3}],
    "WBC":[{name:"NIM compression",low:-20,high:10},{name:"Housing downturn",low:-25,high:8},{name:"Home loan competition",low:-15,high:5},{name:"Digital competition",low:-15,high:5},{name:"Regulatory capital",low:-12,high:3}],

    "ALD":[{name:"Refining margin volatility",low:-35,high:30},{name:"Oil price volatility",low:-30,high:25},{name:"EV transition",low:-25,high:5},{name:"Convenience retail execution",low:-15,high:15},{name:"AUD/USD",low:-12,high:8}],
    "MQG":[{name:"Market volatility",low:-30,high:25},{name:"Commodity cycles",low:-25,high:20},{name:"Infrastructure valuations",low:-20,high:15},{name:"Regulatory changes",low:-15,high:5},{name:"Interest rate changes",low:-18,high:10}],

  };

  const sector=CO_INFO[sym]?.sector||'General';
  let risks=(SECTOR_RISKS[sector]||SECTOR_RISKS['General']).map(r=>({...r}));

  if(m.av.gpm>40&&m.av.npm<15)risks.push({name:'Cost Inflation',low:-12,high:3});

}
function renderTornadoChart(variables){
  if(!variables||!variables.length)return "";
  const sorted=[...variables].sort((a,b)=>Math.abs(b.high-b.low)-Math.abs(a.high-a.low));
  const maxAbs=Math.max(...sorted.flatMap(v=>[Math.abs(v.low||0),Math.abs(v.high||0)]),1);
  const labelW=160,barH=28,gap=8,axisH=30,chartW=380,mid=chartW/2;
  const scale=v=>(Math.abs(v)/maxAbs)*(mid*0.90);
  const fmt=v=>v!=null?(v>=0?"+":"")+Number(v).toFixed(1)+"%":"?";
  const bars=sorted.map((v,i)=>{const y=i*(barH+gap);const nw=scale(v.low||0);const pw=scale(v.high||0);return `<g transform="translate(0,${y})"><rect x="${mid-nw}" y="0" width="${nw}" height="${barH}" fill="#ff5a7a" rx="3" opacity="0.85"/><rect x="${mid}" y="0" width="${pw}" height="${barH}" fill="#5a9eff" rx="3" opacity="0.85"/><text x="${mid-nw-4}" y="${barH/2+4}" fill="#ff5a7a" font-size="9" text-anchor="end">${fmt(v.low)}</text><text x="${mid+pw+4}" y="${barH/2+4}" fill="#5a9eff" font-size="9" text-anchor="start">${fmt(v.high)}</text><text x="-4" y="${barH/2+4}" fill="#b8d0ea" font-size="10" text-anchor="end" font-weight="500">${v.name||""}</text></g>`;}).join("");
  const h=sorted.length*(barH+gap)+axisH;
  const ticks=[-75,-50,-25,0,25,50,75].filter(t=>Math.abs(t)<=maxAbs*1.05);
  const axis=ticks.map(t=>{const x=mid+(t/maxAbs)*(mid*0.90);return `<line x1="${x}" y1="0" x2="${x}" y2="${h-axisH}" stroke="rgba(72,110,144,0.5)" stroke-width="1"/><text x="${x}" y="${h-axisH+13}" fill="#6c8db0" font-size="8" text-anchor="middle">${t>0?"+":""}${t}%</text>`;}).join("");
  return `<div style="overflow-x:auto;margin:12px 0"><div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;display:flex;gap:14px"><span><span style="color:#ff5a7a">■</span> Downside</span><span><span style="color:#5a9eff">■</span> Upside</span></div><svg viewBox="-${labelW} 0 ${labelW+chartW+60} ${h}" style="width:100%;max-width:${labelW+chartW+60}px;height:${h}px;font-family:Inter">${axis}${bars}</svg></div>`;
}
function extractKeyTakeaways(profileText,m,sym){
  const takeaways=[];
  if(m.av.gpm>40)takeaways.push(`✅ High gross margin (${P1(m.av.gpm)}) – strong pricing power or low costs.`);
  else if(m.av.gpm>20)takeaways.push(`📊 Healthy gross margin of ${P1(m.av.gpm)}.`);
  else takeaways.push(`⚠️ Thin gross margin (${P1(m.av.gpm)}).`);
  if(m.av.npm>20)takeaways.push(`💰 Excellent net profitability (${P1(m.av.npm)}).`);
  else if(m.av.npm>10)takeaways.push(`💵 Solid net margin (${P1(m.av.npm)}).`);
  else takeaways.push(`📉 Low net margin (${P1(m.av.npm)}).`);
  if(m.av.roe>20)takeaways.push(`🚀 Outstanding ROE (${P1(m.av.roe)}).`);
  else if(m.av.roe>12)takeaways.push(`📈 Good ROE (${P1(m.av.roe)}).`);
  else takeaways.push(`🐢 Mediocre ROE (${P1(m.av.roe)}).`);
  if(m.buff>100)takeaways.push(`🧠 Passes Buffett $1 test – retained earnings create value.`);
  else if(m.buff>0)takeaways.push(`📊 Buffett test score ${P1(m.buff)}.`);
  else if(m.buff!==null)takeaways.push(`⚠️ Buffett test ${P1(m.buff)} – destroys value.`);
  if(m.cg.rev>10)takeaways.push(`📈 Strong revenue growth (${P1(m.cg.rev)} CAGR).`);
  else if(m.cg.rev<0)takeaways.push(`📉 Revenue declining (${P1(m.cg.rev)} CAGR).`);
  if(m.av.debtToEquity>80)takeaways.push(`⚠️ High leverage (D/E ${P1(m.av.debtToEquity)}).`);
  else if(m.av.debtToEquity<30)takeaways.push(`✅ Low debt (D/E ${P1(m.av.debtToEquity)}).`);
  return takeaways;
}

function tabInsights(sym,st){
  const stockData=S.data[sym];
  const profileMd=stockData?.profile||"";
  const m=calcM(sym);
  if(!m)return `<div class="state-box"><p>No data for ${sym}</p></div>`;
  let leftHtml="",rightHtml="";
  if(profileMd&&profileMd.length>100){
    const sections={};
    const parts=profileMd.split(/(?=^## )/gm);
    for(const part of parts){const match=part.match(/^## (.+)$/m);if(match)sections[match[1].trim()]=part;}
    const leftOrder=["Business Model Canvas","SWOT Analysis","PESTLE Analysis","Porter's Five Forces"];
    const rightOrder=["Management & Decision Making","Future Outlook","Leadership"];
    for(const title of leftOrder)if(sections[title])leftHtml+=`<div class="ai-content">${markdownToHtml(sections[title])}</div>`;
    for(const title of rightOrder)if(sections[title])rightHtml+=`<div class="ai-content">${markdownToHtml(sections[title])}</div>`;
  }
  const tornadoVars=generateCustomTornado(sym,st,m);
  if(tornadoVars.length){rightHtml+=`<div class="ai-content"><h2>🌪️ Sensitivity Analysis</h2>${renderTornadoChart(tornadoVars)}</div>`;}
  const takeaways=extractKeyTakeaways(profileMd,m,sym);
  if(takeaways.length){rightHtml+=`<div class="ai-content"><h2>🔑 Key Takeaways</h2><ul>${takeaways.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;}
  if(!leftHtml&&!rightHtml){return `<div class="state-box"><p>No insights available for ${sym} yet.</p></div>`;}
  return `<div><div style="margin-bottom:20px;"><div style="font-size:18px;font-weight:700"><span>${st.name}</span> <span style="font-size:12px;color:var(--text-muted)">${sym} · ${st.exchange} · ${st.currency}</span></div></div><div class="insights-two-col"><div>${leftHtml||'<div class="ai-content"><p>Business model analysis will appear after data refresh.</p></div>'}</div><div>${rightHtml}</div></div><div style="font-size:10px;color:var(--text-muted);margin-top:12px;">📚 Sources: Company filings · Annual Reports · Yahoo Finance${stockData?.profileDate?`<br>Generated: ${new Date(stockData.profileDate).toLocaleString()}`:''}</div></div>`;
}
