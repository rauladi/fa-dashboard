<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>FA Dashboard — Fundamental Analysis | Modern Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
:root {
  --bg-deep: #0a0c12;
  --bg-surface-1: rgba(15, 25, 35, 0.75);
  --bg-surface-2: rgba(20, 32, 45, 0.85);
  --bg-elevated: rgba(28, 42, 58, 0.7);
  --border-glow: rgba(0, 224, 255, 0.3);
  --border-light: rgba(72, 110, 144, 0.4);
  --accent-cyan: #00e4ff;
  --accent-cyan-glow: rgba(0, 228, 255, 0.25);
  --accent-green: #00f5a0;
  --accent-red: #ff5a7a;
  --accent-gold: #ffcf4a;
  --accent-purple: #c0a5ff;
  --accent-blue: #5a9eff;
  --text-primary: #f0f6ff;
  --text-secondary: #b8d0ea;
  --text-muted: #6c8db0;
  --card-radius: 24px;
  --glass-blur: blur(16px);
  --shadow-sm: 0 8px 20px rgba(0,0,0,0.3);
  --transition-fast: 0.2s ease;
}
body {
  background: radial-gradient(circle at 10% 20%, #0f1722, #03050b);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  line-height: 1.4;
  letter-spacing: -0.01em;
}
::-webkit-scrollbar { width: 5px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 10px; }
#hdr {
  background: rgba(8, 16, 24, 0.75);
  backdrop-filter: var(--glass-blur);
  border-bottom: 1px solid var(--border-glow);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: var(--shadow-sm);
}
.h-logo {
  width: 42px;
  height: 42px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--accent-cyan), #0077b3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  color: #fff;
  box-shadow: 0 0 12px var(--accent-cyan-glow);
}
.h-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
  background: linear-gradient(135deg, #fff, var(--accent-cyan));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}
.h-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 40px;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: var(--transition-fast);
  backdrop-filter: blur(4px);
}
.btn-cyan { background: linear-gradient(105deg, var(--accent-cyan), #0088aa); color: #03050b; box-shadow: 0 2px 6px rgba(0,228,255,0.3); }
.btn-cyan:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0,228,255,0.4); }
.btn-green { background: linear-gradient(105deg, var(--accent-green), #00b87a); color: #03050b; }
.btn-green:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0,245,160,0.3); }
.btn-ghost { background: rgba(255,255,255,0.05); color: var(--text-secondary); border: 1px solid rgba(0,228,255,0.2); }
.btn-ghost:hover { background: rgba(0,228,255,0.1); color: var(--accent-cyan); border-color: var(--accent-cyan); }
.btn-red { background: rgba(255,90,122,0.15); color: #ff8aab; border: 1px solid rgba(255,90,122,0.3); }
.btn-red:hover { background: rgba(255,90,122,0.3); color: #ffb0c4; }
.btn-sm { padding: 5px 12px; font-size: 11px; }
.btn-xs { padding: 3px 10px; font-size: 10px; }
#sBar {
  background: rgba(8, 16, 24, 0.6);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border-light);
  padding: 10px 20px;
  overflow-x: auto;
  position: sticky;
  top: 66px;
  z-index: 199;
}
.s-list { display: flex; gap: 8px; min-width: max-content; }
.s-btn {
  padding: 6px 14px;
  border-radius: 40px;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  background: rgba(20, 32, 45, 0.8);
  color: var(--text-secondary);
  transition: all 0.2s;
  backdrop-filter: blur(4px);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.s-btn:hover { background: rgba(0,228,255,0.15); color: var(--accent-cyan); transform: translateY(-1px); }
.s-btn.on { background: linear-gradient(95deg, var(--accent-cyan), #0099bb); color: #03050b; box-shadow: 0 0 12px var(--accent-cyan-glow); }
.xbadge { font-size: 9px; padding: 2px 8px; border-radius: 20px; font-weight: 700; background: rgba(0,0,0,0.3); }
#tBar {
  background: rgba(8, 16, 24, 0.6);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border-light);
  padding: 0 24px;
  display: flex;
  overflow-x: auto;
  position: sticky;
  top: 108px;
  z-index: 198;
}
.t-btn {
  padding: 12px 18px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: 0.2s;
}
.t-btn:hover { color: var(--text-secondary); }
.t-btn.on { border-bottom-color: var(--accent-cyan); color: var(--accent-cyan); text-shadow: 0 0 4px rgba(0,228,255,0.3); }
#cont { padding: 24px; max-width: 1600px; margin: 0 auto; }
.sec { margin-bottom: 28px; }
.sec-t {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-cyan);
  margin-bottom: 14px;
  padding-left: 12px;
  border-left: 3px solid var(--accent-cyan);
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.card {
  background: var(--bg-surface-2);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(0,228,255,0.15);
  border-radius: 20px;
  padding: 14px 16px;
  transition: var(--transition-fast);
}
.card:hover { border-color: var(--accent-cyan); transform: translateY(-2px); background: rgba(20, 40, 55, 0.9); }
.card-l { font-size: 10px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
.card-v {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #fff, var(--accent-cyan));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}
.tw {
  overflow-x: auto;
  border-radius: 20px;
  border: 1px solid rgba(0,228,255,0.15);
  background: rgba(8, 16, 24, 0.5);
  backdrop-filter: blur(4px);
}
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th { background: rgba(0, 150, 180, 0.2); padding: 12px 12px; text-align: left; font-size: 10px; text-transform: uppercase; color: var(--accent-cyan); font-weight: 700; }
tbody td { padding: 10px 12px; border-bottom: 1px solid rgba(72, 110, 144, 0.2); white-space: nowrap; }
tbody tr:hover td { background: rgba(0, 228, 255, 0.05); }
.s-dot-ok, .s-dot-ld, .s-dot-er { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.s-dot-ok { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
.s-dot-ld { background: var(--accent-gold); animation: pulse 1.2s infinite; }
.s-dot-er { background: var(--accent-red); }
@keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }
.wt-wrap { border-radius: 24px; padding: 20px; background: var(--bg-surface-2); backdrop-filter: blur(8px); border: 1px solid rgba(0,228,255,0.2); }
.wt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.wt-card { background: var(--bg-surface-1); border-radius: 18px; padding: 12px; transition: 0.2s; }
.wt-card.ov { border: 1px solid var(--accent-gold); background: rgba(255,207,74,0.08); }
.wt-inp { width: 65px; background: #0c121c; border: 1px solid var(--border-light); border-radius: 12px; padding: 6px 8px; font-size: 13px; font-weight: 700; color: var(--text-primary); }
.wt-inp:focus { outline: none; border-color: var(--accent-cyan); }
.state-box { background: var(--bg-surface-2); backdrop-filter: blur(8px); border: 1px solid rgba(0,228,255,0.2); border-radius: 32px; padding: 48px 24px; text-align: center; }
.spinner { width: 40px; height: 40px; border: 2px solid rgba(0,228,255,0.2); border-top-color: var(--accent-cyan); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.rc { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 30px; font-size: 11px; font-weight: 800; }
.rc1 { background: var(--accent-gold); color: #0a0c12; box-shadow: 0 0 8px gold; }
.rc2 { background: #adc6ff; color: #03050b; }
.rc3 { background: var(--accent-purple); color: #03050b; }
.rc4 { background: var(--accent-green); color: #03050b; }
.rc5 { background: var(--accent-blue); color: #03050b; }
.insights-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.ai-content { background: var(--bg-surface-1); backdrop-filter: blur(8px); border-radius: 24px; padding: 20px; border: 1px solid rgba(0,228,255,0.15); }
.ai-content h2 { font-size: 16px; font-weight: 700; color: var(--accent-cyan); margin-bottom: 14px; border-left: 3px solid var(--accent-cyan); padding-left: 12px; }
.chart-box { background: var(--bg-surface-2); backdrop-filter: blur(4px); border-radius: 24px; padding: 18px; border: 1px solid rgba(0,228,255,0.2); }
#chartWrap { position: relative; height: 450px; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--bg-surface-2); backdrop-filter: blur(20px); border: 1px solid var(--accent-cyan); border-radius: 32px; width: 100%; max-width: 980px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-sm); }
.modal-h { padding: 18px 24px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: inherit; backdrop-filter: blur(12px); }
@media (max-width: 640px) {
  #cont { padding: 16px; }
  .cards { grid-template-columns: repeat(2,1fr); }
  .insights-two-col { grid-template-columns: 1fr; }
  .h-title { font-size: 15px; }
  #chartWrap { height: 280px; }
}
.pos { color: var(--accent-green); font-weight: 600; }
.neg { color: var(--accent-red); }
.cya { color: var(--accent-cyan); }
.ylo { color: var(--accent-gold); }
.pur { color: var(--accent-purple); }
.blu { color: var(--accent-blue); }
.src-bar { background: rgba(8, 16, 24, 0.7); backdrop-filter: blur(8px); border-radius: 20px; padding: 12px 20px; margin-bottom: 20px; border: 1px solid rgba(0,228,255,0.2); }
</style>
</head>
<body>
<div id="hdr"><div style="display:flex;align-items:center;gap:12px"><div class="h-logo">FA</div><div><div class="h-title">Fundamental Analysis Dashboard</div><div class="h-sub" id="hSub">ASX · IDX · NYSE/NASDAQ — loading...</div></div></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="showSync()">🔄 Sync</button><button class="btn btn-green btn-sm" onclick="showAdd()">＋ Add Stock</button></div></div>
<div id="sBar"><div class="s-list" id="sList"></div></div>
<div id="tBar"><button class="t-btn on" id="t-data" onclick="setTab('data')">📋 Data</button><button class="t-btn" id="t-ratios" onclick="setTab('ratios')">📐 Ratios</button><button class="t-btn" id="t-chart" onclick="setTab('chart')">📈 Chart</button><button class="t-btn" id="t-rankings" onclick="setTab('rankings')">🏆 Rankings</button><button class="t-btn" id="t-insights" onclick="setTab('insights')">💡 Insights</button></div>
<div id="cont"></div>
<div id="addModal" class="modal-bg" style="display:none"><div class="modal"><div class="modal-h"><h3>＋ Add New Stock</h3><button class="modal-x" onclick="hideAdd()">×</button></div><div class="modal-b" id="addBody"></div></div></div>
<div id="syncModal" class="modal-bg" style="display:none"><div class="modal" style="max-width:520px"><div class="modal-h"><h3>🔄 Sync Between Devices</h3><button class="modal-x" onclick="hideSync()">×</button></div><div class="modal-b" id="syncBody"></div></div></div>

<script>
// ======================== FULL ORIGINAL SCRIPT + RESTORED INSIGHTS ========================
const CURRENT_YEAR = new Date().getFullYear();
const LATEST_YEAR = CURRENT_YEAR - 1;
const YEARS = Array.from({length:5}, (_,i) => LATEST_YEAR - 4 + i).concat([CURRENT_YEAR]);
const N_YEARS = YEARS.length;
let ANNUALISATION = {};
const LS_KEY='fa_v5';

const BASE_STOCKS={
  BHP:{name:"BHP Group",exchange:"ASX",currency:"B AUD"}, WDS:{name:"Woodside Energy",exchange:"ASX",currency:"B AUD"}, CBA:{name:"Commonwealth Bank",exchange:"ASX",currency:"B AUD"},
  BBRI:{name:"Bank Rakyat Indonesia",exchange:"IDX",currency:"T IDR"}, ADRO:{name:"Alamtri Resources Indonesia",exchange:"IDX",currency:"T IDR"}, SMSM:{name:"Selamat Sempurna",exchange:"IDX",currency:"T IDR"},
  UNTR:{name:"United Tractors",exchange:"IDX",currency:"T IDR"}, ITMG:{name:"Indo Tambangraya Megah",exchange:"IDX",currency:"T IDR"}, POWR:{name:"Cikarang Listrindo",exchange:"IDX",currency:"T IDR"},
  MPMX:{name:"Mitra Pinasthika Mustika",exchange:"IDX",currency:"T IDR"}, BTPS:{name:"Bank BTPN Syariah",exchange:"IDX",currency:"T IDR"}, DMAS:{name:"Puradelta Lestari",exchange:"IDX",currency:"T IDR"},
  SPTO:{name:"Surya Toto Indonesia",exchange:"IDX",currency:"T IDR"}, TSM:{name:"Taiwan Semiconductor",exchange:"NYSE",currency:"B USD"}, V:{name:"Visa Inc.",exchange:"NYSE",currency:"B USD"},
  MA:{name:"Mastercard Inc.",exchange:"NYSE",currency:"B USD"}, "PBR-A":{name:"Petrobras Pref ADR",exchange:"NYSE",currency:"B USD"}, MSFT:{name:"Microsoft Corp.",exchange:"NASDAQ",currency:"B USD"},
  AMZN:{name:"Amazon.com Inc.",exchange:"NASDAQ",currency:"B USD"}, AAPL:{name:"Apple Inc.",exchange:"NASDAQ",currency:"B USD"}, META:{name:"Meta Platforms Inc.",exchange:"NASDAQ",currency:"B USD"},
  NVDA:{name:"NVIDIA Corporation",exchange:"NASDAQ",currency:"B USD"}, GOOG:{name:"Alphabet Inc (Google)",exchange:"NASDAQ",currency:"B USD"}, BKNG:{name:"Booking Holdings Inc",exchange:"NASDAQ",currency:"B USD"},
  NAB:{name:"National Australia Bank",exchange:"ASX",currency:"B AUD"}, CVX:{name:"Chevron Corporation",exchange:"NYSE",currency:"B USD"},
  AXP:{name:"American Express",exchange:"NYSE",currency:"B USD"}, BAC:{name:"Bank of America",exchange:"NYSE",currency:"B USD"}
};
const DEF_WTS={cashToAsset:10,debtToEquity:5,revenueCagr:5,gpmAvg:0,netProfitCagr:5,npmAvg:30,epsCagr:5,dpsCagr:0,roeAvg:25,dividendPayout:0,buffettTest:15};
const CRITERIA=[
  {key:"cashToAsset",wKey:"cashToAsset",label:"Cash/Asset",hi:true},{key:"debtToEquity",wKey:"debtToEquity",label:"D/E Ratio",hi:false},
  {key:"revenueCagr",wKey:"revenueCagr",label:"Rev CAGR",hi:true},{key:"gpmAvg",wKey:"gpmAvg",label:"GP Margin",hi:true},
  {key:"netProfitCagr",wKey:"netProfitCagr",label:"NP CAGR",hi:true},{key:"npmAvg",wKey:"npmAvg",label:"NP Margin",hi:true},
  {key:"epsCagr",wKey:"epsCagr",label:"EPS CAGR",hi:true},{key:"dpsCagr",wKey:"dpsCagr",label:"DPS CAGR",hi:true},
  {key:"roeAvg",wKey:"roeAvg",label:"ROE",hi:true},{key:"dividendPayout",wKey:"dividendPayout",label:"Div Payout",hi:true},
  {key:"buffettTest",wKey:"buffettTest",label:"Buffett $1",hi:true},
];
const MKEYS=[{k:"totalAsset",l:"Total Asset"},{k:"cash",l:"Cash"},{k:"totalDebt",l:"Total Debt"},{k:"totalEquity",l:"Total Equity"},{k:"revenue",l:"Total Revenue"},{k:"grossProfit",l:"Gross Profit"},{k:"netProfit",l:"Net Profit"},{k:"eps",l:"EPS"},{k:"dps",l:"DPS"}];
let S={stocks:{...BASE_STOCKS},custom:{},deleted:{},data:{},status:{},errmsg:{},sel:"BHP",tab:"data",wts:{...DEF_WTS}};

function saveLS(){try{localStorage.setItem(LS_KEY,JSON.stringify({custom:S.custom,wts:S.wts,sel:S.sel,data:S.data,status:S.status,deleted:S.deleted||{}}));}catch(e){}}
function loadLS(){try{const h=location.hash;if(h&&h.startsWith('#d=')){applyImport(JSON.parse(atob(decodeURIComponent(h.slice(3)))));history.replaceState(null,'',location.pathname);return;}const raw=localStorage.getItem(LS_KEY);if(raw)applyImport(JSON.parse(raw),true);}catch(e){}}
function applyImport(d,quiet){if(d.custom){S.custom=d.custom||{};S.stocks={...BASE_STOCKS,...S.custom};}if(d.wts)S.wts={...DEF_WTS,...d.wts};if(d.sel&&S.stocks[d.sel])S.sel=d.sel;if(d.data)S.data={...d.data};if(d.deleted)S.deleted={...d.deleted};if(d.status){Object.keys(d.status).forEach(k=>{S.status[k]=d.status[k]==='ok'?'ok':'idle';});}if(!quiet)saveLS();}
function exportJSON(){const d={custom:S.custom,wts:S.wts,sel:S.sel,data:S.data,status:S.status,at:new Date().toISOString()};const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='FA_Dashboard_sync.json';a.click();URL.revokeObjectURL(u);}
function importFile(file){const r=new FileReader();r.onload=e=>{try{applyImport(JSON.parse(e.target.result));render();hideSync();showToast('✓ Imported successfully','green');}catch(x){showToast('Error importing file: '+x.message,'red');}};r.readAsText(file);}

function yahooTicker(symbol,exchange){if(exchange==='ASX')return symbol+'.AX';if(exchange==='IDX')return symbol+'.JK';return symbol;}
const isOK=v=>v!==null&&v!==undefined&&isFinite(v)&&!isNaN(v);
const avg=a=>{const v=a.filter(isOK);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
const N2=(v,d=2)=>isOK(v)?Number(v).toFixed(d):'N/A';
const P1=(v,d=1)=>isOK(v)?Number(v).toFixed(d)+'%':'N/A';
function cagr(a){const v=a.filter(isOK);if(v.length<2)return null;const s=v[0],e=v[v.length-1],n=v.length-1;if(s===0||n===0)return null;if(s>0&&e>0)return(Math.pow(e/s,1/n)-1)*100;return null;}

function calcM(symbol){
  const data = S.data[symbol];
  if (!data) return { Y: YEARS.map(yr => ({ year: yr, cashToAsset: null, debtToEquity: null, gpm: null, npm: null, roa: null, roe: null, divPayout: null, valLow: null, valHigh: null, retEps: null })), av: { cashToAsset: null, debtToEquity: null, gpm: null, npm: null, roa: null, roe: null, divPayout: null }, cg: { rev: null, np: null, eps: null, dps: null }, epsInc: null, totRet: null, buff: null, raw: { ta: [], ca: [], td: [], te: [], rv: [], gp: [], np: [], ep: [], dp: [] }, rm: { cashToAsset: null, debtToEquity: null, revenueCagr: null, gpmAvg: null, netProfitCagr: null, npmAvg: null, epsCagr: null, dpsCagr: null, roeAvg: null, dividendPayout: null, buffettTest: null } };
  const sl = k => (data[k] || Array(N_YEARS).fill(null)).slice(0, N_YEARS);
  const ta = sl('totalAsset'), ca = sl('cash'), td = sl('totalDebt'), te = sl('totalEquity');
  const rv2 = sl('revenue'), gp = sl('grossProfit'), np = sl('netProfit'), ep = sl('eps'), dp = sl('dps');
  const Y = YEARS.map((yr,i) => ({ year: yr, totalAsset: ta[i], cash: ca[i], totalDebt: td[i], totalEquity: te[i], revenue: rv2[i], grossProfit: gp[i], netProfit: np[i], eps: ep[i], dps: dp[i], cashToAsset: (isOK(ta[i]) && ta[i] > 0 && isOK(ca[i])) ? ca[i]/ta[i]*100 : null, debtToEquity: (isOK(te[i]) && te[i] !== 0 && isOK(td[i])) ? td[i]/te[i]*100 : null, gpm: (isOK(rv2[i]) && rv2[i] > 0 && isOK(gp[i])) ? gp[i]/rv2[i]*100 : null, npm: (isOK(rv2[i]) && rv2[i] > 0 && isOK(np[i])) ? np[i]/rv2[i]*100 : null, roa: (isOK(ta[i]) && ta[i] > 0 && isOK(np[i])) ? np[i]/ta[i]*100 : null, roe: (isOK(te[i]) && te[i] !== 0 && isOK(np[i])) ? np[i]/te[i]*100 : null, divPayout: (isOK(ep[i]) && ep[i] > 0 && isOK(dp[i])) ? dp[i]/ep[i]*100 : null, valLow: isOK(dp[i]) ? dp[i]*10 : null, valHigh: isOK(dp[i]) ? dp[i]*20 : null, retEps: null }));
  const av = { cashToAsset: avg(Y.map(y => y.cashToAsset)), debtToEquity: avg(Y.map(y => y.debtToEquity)), gpm: avg(Y.map(y => y.gpm)), npm: avg(Y.map(y => y.npm)), roa: avg(Y.map(y => y.roa)), roe: avg(Y.map(y => y.roe)), divPayout: avg(Y.map(y => y.divPayout)) };
  const cg = { rev: cagr(rv2), np: cagr(np), eps: cagr(ep), dps: cagr(dp) };
  const N_COMPLETED = N_YEARS - 1;
  const epCompleted = ep.slice(0, N_COMPLETED);
  const dpCompleted = dp.slice(0, N_COMPLETED);
  const retEpsCompleted = epCompleted.map((e,i) => { if(!isOK(e)) return null; const d = isOK(dpCompleted[i]) ? dpCompleted[i] : 0; return e - d; });
  const retEpsVals = retEpsCompleted.filter(isOK);
  const totRet = retEpsVals.length > 0 ? retEpsVals.reduce((s,v)=>s+v,0) : null;
  const epCompletedOK = epCompleted.filter(isOK);
  const epsInc = epCompletedOK.length >= 2 ? epCompletedOK[epCompletedOK.length-1] - epCompletedOK[0] : null;
  const buff = (isOK(totRet) && Math.abs(totRet) > 0.001 && isOK(epsInc)) ? epsInc / totRet * 100 : null;
  Y.forEach((y,i) => { if(!isOK(y.eps)) { y.retEps = null; return; } const d = isOK(y.dps) ? y.dps : 0; y.retEps = y.eps - d; });
  return { Y, av, cg, epsInc, totRet, buff, raw: { ta, ca, td, te, rv: rv2, gp, np: np, ep, dp }, rm: { cashToAsset: av.cashToAsset, debtToEquity: av.debtToEquity, revenueCagr: cg.rev, gpmAvg: av.gpm, netProfitCagr: cg.np, npmAvg: av.npm, epsCagr: cg.eps, dpsCagr: cg.dps, roeAvg: av.roe, dividendPayout: av.divPayout, buffettTest: buff } };
}

function yearColHeader(sym, yr) {
  if (yr !== CURRENT_YEAR) return `<th class="tc" style="white-space:nowrap">${yr}</th>`;
  const ann = ANNUALISATION[sym] || { label: null };
  if (!ann.label || ann.label === 'FY') { const tag = ann?.label === 'FY' ? 'FY' : 'Est.'; return `<th class="tc" style="white-space:nowrap;color:var(--accent-gold)">${yr}<br><span style="font-size:8px;">${tag}</span></th>`; }
  const asOf = ann.asOf ? ` ${ann.asOf.slice(5)}` : '';
  return `<th class="tc" style="white-space:nowrap;color:#ffaa44">${yr}<br><span style="font-size:8px;">${ann.label}${asOf}</span></th>`;

ss="sec-t">Key Metrics Summary</div><div class="cards">${cards}</div></div>`;}

'Inter'}},grid:{drawOnChartArea:false},title:{display:true,text:'Margin %',color:'#5a9eff',font:{size:10,family:'Inter'}}}}}});}
function calcRanks(wts){const ks=Object.keys(S.stocks).filter(k=>S.status[k]==='ok');const N=ks.length;if(!N)return{ranks:{},scores:{},fr:{}};const allM=Object.fromEntries(ks.map(k=>[k,calcM(k)]));const ranks=Object.fromEntries(ks.map(k=>[k,{}]));CRITERIA.forEach(c=>{const vs=ks.map(k=>({k,v:allM[k]?.rm[c.key]}));vs.sort((a,b)=>{if(!isOK(a.v)&&!isOK(b.v))return 0;if(!isOK(a.v))return 1;if(!isOK(b.v))return -1;return c.hi?b.v-a.v:a.v-b.v;});vs.forEach((x,i)=>{ranks[x.k][c.key]=i+1;});});const scores=Object.fromEntries(ks.map(k=>{const ws=CRITERIA.reduce((s,c)=>s+(ranks[k][c.key]||N)*(wts[c.wKey]||0)/100,0);return[k,{ranks:ranks[k],ws,m:allM[k]}];}));const sorted=[...ks].sort((a,b)=>scores[a].ws-scores[b].ws);const fr=Object.fromEntries(sorted.map((k,i)=>[k,i+1]));return{ranks,scores,fr};}
function tabRankings(){const {ranks,scores,fr}=calcRanks(S.wts);const rankedKs=Object.keys(fr);const unrankedKs=Object.keys(S.stocks).filter(k=>!fr[k]);const CAT_GROUPS=[{id:'risk',label:'🛡 Risk',color:'var(--accent-blue)',bg:'rgba(90,158,255,0.07)',border:'rgba(90,158,255,0.3)',keys:['cashToAsset','debtToEquity']},{id:'profgrow',label:'📈 Profitability & Growth',color:'var(--accent-green)',bg:'rgba(0,245,160,0.06)',border:'rgba(0,245,160,0.25)',keys:['revenueCagr','gpmAvg','netProfitCagr','npmAvg','epsCagr','dpsCagr']},{id:'mgmt',label:'🎯 Management Effectiveness',color:'var(--accent-purple)',bg:'rgba(192,165,255,0.06)',border:'rgba(192,165,255,0.25)',keys:['roeAvg','dividendPayout','buffettTest']}];const CRIT_MAP=Object.fromEntries(CRITERIA.map(c=>[c.wKey,c]));function catSubtotal(keys){return keys.reduce((s,k)=>s+(S.wts[k]||0),0);}const wCatBlocks=CAT_GROUPS.map(g=>{const sub=catSubtotal(g.keys);const cards=g.keys.map(wk=>{const c=CRIT_MAP[wk];const w=S.wts[wk]||0;const ov=w>5;return`<div class="wt-card${ov?' ov':''}" style="flex:1;min-width:100px"><div class="wt-l">${c.label}${ov?'<br><span style="font-size:9px;color:var(--accent-gold)">⚠ High weight</span>':''}</div><div class="wt-row"><input type="number" min="0" max="100" step="1" value="${w}" class="wt-inp${ov?' ov':''}" oninput="setWt('${wk}',this.value)"/><span class="wt-u">%</span></div></div>`;}).join('');return`<div style="border:1px solid ${g.border};background:${g.bg};border-radius:20px;padding:12px;flex:1;min-width:200px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><span style="font-size:11px;font-weight:700;color:${g.color}">${g.label}</span><span style="font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;background:${g.bg};border:1px solid ${g.border};color:${g.color}">${sub.toFixed(0)}%</span></div><div style="display:flex;flex-wrap:wrap;gap:8px">${cards}</div></div>`;}).join('');const riskSub=catSubtotal(CAT_GROUPS[0].keys),profSub=catSubtotal(CAT_GROUPS[1].keys),mgmtSub=catSubtotal(CAT_GROUPS[2].keys);const totalW=riskSub+profSub+mgmtSub,tot100=Math.abs(totalW-100)<0.01;const sumRow=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light)">${[{l:'🛡 Risk',v:riskSub,c:'var(--accent-blue)'},{l:'📈 Profitability & Growth',v:profSub,c:'var(--accent-green)'},{l:'🎯 Management Effectiveness',v:mgmtSub,c:'var(--accent-purple)'}].map(x=>`<div style="flex:1;min-width:120px;background:var(--bg-surface-1);border:1px solid var(--border-light);border-radius:16px;padding:8px 12px;display:flex;justify-content:space-between;"><span style="font-size:10px;font-weight:600">${x.l}</span><span style="font-size:15px;font-weight:700;color:${x.c}">${x.v.toFixed(0)}%</span></div>`).join('')}<div style="min-width:110px;padding:8px 14px;border-radius:16px;display:flex;justify-content:space-between;font-weight:700;background:${tot100?'rgba(0,245,160,0.15)':'rgba(255,90,122,0.15)'};border:1px solid ${tot100?'rgba(0,245,160,0.4)':'rgba(255,90,122,0.5)'};color:${tot100?'var(--accent-green)':'var(--accent-red)'}"><span style="font-size:10px;">Total</span>${totalW.toFixed(0)}% ${tot100?'✓':totalW>100?'▲':'▼'}</div></div>`;const thCrit=CRITERIA.map(c=>`<th class="tc" style="min-width:50px;font-size:9px">${c.label}<br><span style="color:var(--accent-cyan)">${S.wts[c.wKey]||0}%</span></th>`).join('');const rRows=rankedKs.map(k=>{const r=fr[k];const medal=r===1?'🥇':r===2?'🥈':r===3?'🥉':r===4?'🎖️':r===5?'🏅':r;const medalFontSize=r<=5?'18':'13';const rc=r===1?'fr1':r<=3?'fr2':r<=5?'fr4':r>Math.floor(rankedKs.length*0.65)?'frb':'';const rcells=CRITERIA.map(c=>{const rk=ranks[k][c.key]||'?';const mv=scores[k]?.m?.rm[c.key];const cls=rk===1?'rc1':rk===2?'rc2':rk===3?'rc3':rk===4?'rc4':rk===5?'rc5':rk<=Math.ceil(rankedKs.length/3)?'rc-g':'rc-m';return`<td class="tc" style="padding:5px 3px"><div style="display:flex;flex-direction:column;align-items:center;gap:2px"><span class="rc ${cls}">${rk}</span><span style="font-size:9px;color:var(--text-muted)">${isOK(mv)?N2(mv,1):'-'}</span></div></td>`;}).join('');return`<tr class="${rc}"><td class="tc" style="font-size:${medalFontSize}px;font-weight:900;padding:8px">${medal}</td><td style="padding:8px"><div style="font-weight:700">${k}</div><div style="font-size:10px;color:var(--text-muted)">${S.stocks[k].name}</div></td>${rcells}<td class="tc num" style="font-weight:700">${scores[k].ws.toFixed(2)}</td></tr>`;}).join('');const uRows=unrankedKs.length?`<tr><td colspan="17" style="padding:10px;font-size:11px;color:var(--text-muted)">Not yet ranked: ${unrankedKs.map(k=>`<button class="btn btn-ghost btn-xs" onclick="selStock('${k}');setTab('data')">${k}</button>`).join('')}</td></tr>`:'';return`<div class="sec"><div class="sec-t">Scoring Weights</div><div class="wt-wrap" style="border:1px solid ${tot100?'rgba(0,245,160,0.3)':'var(--accent-red)'};background:${tot100?'rgba(0,245,160,0.02)':'rgba(255,90,122,0.04)'}"><div style="display:flex;gap:10px;flex-wrap:wrap">${wCatBlocks}</div>${sumRow}${!tot100?`<p class="err" style="margin-top:10px">⛔ Weights must sum to exactly 100%.</p>`:''}</div></div><div class="sec"><div class="sec-t">Multi-Criteria Rankings</div><div class="tw"><table><thead><tr><th style="min-width:38px">Rank</th><th style="min-width:140px">Stock</th>${thCrit}<th class="tc" style="color:var(--accent-cyan);min-width:55px">Score</th></tr></thead><tbody>${rankedKs.length?rRows:'<tr><td colspan="13" style="padding:20px;text-align:center">No ranked stocks</td></tr>'}${uRows}</tbody></table></div></div>`;}

function markdownToHtml(md) { if (!md) return ''; return md.replace(/^## (.+)$/gm, '<h2>$1</h2>').replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/^- (.+)$/gm, '<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>').replace(/\n/g, '<br>'); }
const LEADERSHIP = { BHP:{ceo:"Mike Henry (since 2020)",cfo:"David Lamont (since 2021)",track:"Henry drove portfolio simplification, disciplined capital returns."}, WDS:{ceo:"Meg O'Neill (since 2021)",cfo:"Graham Tiver (since 2020)",track:"O'Neill led acquisition of BHP's petroleum assets."}, CBA:{ceo:"Matt Comyn (since 2018)",cfo:"Alan Docherty (since 2021)",track:"Comyn led cloud migration, digital transformation."}, BBRI:{ceo:"Sunarso (since 2019)",cfo:"Viviana Dyah Ayu (since 2020)",track:"Sunarso drove BRIvolution digital transformation."}, MSFT:{ceo:"Satya Nadella (since 2014)",cfo:"Amy Hood (since 2013)",track:"Cloud and AI leadership, OpenAI partnership."}, NVDA:{ceo:"Jensen Huang (founder)",cfo:"Colette Kress (since 2013)",track:"AI dominance, Blackwell ramp, CUDA moat."}, TSM:{ceo:"C.C. Wei (since 2018)",cfo:"Wendell Huang",track:"Wei led 2nm/3nm ramp, global expansion."}, V:{ceo:"Ryan McInerney (since 2023)",cfo:"Chris Suh (since 2023)",track:"Focus on tokenisation, cross-border solutions."}, MA:{ceo:"Michael Miebach (since 2020)",cfo:"Sachin Mehra",track:"Multi-rail expansion, crypto partnerships."} };
function generateCustomTornado(sym, st, m) { const customRisks = { "CBA":[{name:"Net Interest Margin compression", low:-20, high:10},{name:"Mortgage delinquencies", low:-25, high:5},{name:"Housing downturn", low:-30, high:8}], "WDS":[{name:"LNG price volatility", low:-40, high:35},{name:"Project execution", low:-25, high:15}], "BBRI":[{name:"Microfinance NPL", low:-35, high:8},{name:"Rupiah depreciation", low:-20, high:10}] }; if (customRisks[sym]) return customRisks[sym]; const sector = { BHP:"Mining", TSM:"Semiconductors", MSFT:"Technology" }[sym] || "General"; const base = { "Mining":[{name:"Commodity Price",low:-40,high:30}], "Semiconductors":[{name:"AI Demand",low:-40,high:50},{name:"Geopolitical Risk",low:-60,high:10}], "Technology":[{name:"Cloud Growth",low:-20,high:30}], "General":[{name:"Economic Slowdown",low:-25,high:15}] }[sector] || []; let risks = base.map(r => ({...r})); if (m.av.debtToEquity > 80) risks.push({ name: 'Interest Rate Sensitivity', low: -15, high: 5 }); return risks.slice(0,5); }
function renderTornadoChart(variables) { if (!variables || !variables.length) return ""; const sorted = [...variables].sort((a,b) => Math.abs(b.high - b.low) - Math.abs(a.high - a.low)); const maxAbs = Math.max(...sorted.flatMap(v => [Math.abs(v.low||0), Math.abs(v.high||0)]), 1); const labelW = 160, barH = 28, gap = 8, axisH = 30, chartW = 380, mid = chartW/2; const scale = v => (Math.abs(v)/maxAbs) * (mid * 0.90); const fmt = v => v != null ? (v>=0 ? "+" : "") + Number(v).toFixed(1) + "%" : "?"; const bars = sorted.map((v,i) => { const y = i * (barH + gap); const nw = scale(v.low||0); const pw = scale(v.high||0); return `<g transform="translate(0,${y})"><rect x="${mid - nw}" y="0" width="${nw}" height="${barH}" fill="#ff5a7a" rx="3" opacity="0.85"/><rect x="${mid}" y="0" width="${pw}" height="${barH}" fill="#5a9eff" rx="3" opacity="0.85"/><text x="${mid - nw - 4}" y="${barH/2 + 4}" fill="#ff5a7a" font-size="9" text-anchor="end">${fmt(v.low)}</text><text x="${mid + pw + 4}" y="${barH/2 + 4}" fill="#5a9eff" font-size="9" text-anchor="start">${fmt(v.high)}</text><text x="-4" y="${barH/2 + 4}" fill="#b8d0ea" font-size="10" text-anchor="end" font-weight="500">${v.name||""}</text></g>`; }).join(""); const h = sorted.length * (barH + gap) + axisH; const ticks = [-50,-25,0,25,50].filter(t => Math.abs(t) <= maxAbs * 1.05); const axis = ticks.map(t => { const x = mid + (t / maxAbs) * (mid * 0.90); return `<line x1="${x}" y1="0" x2="${x}" y2="${h - axisH}" stroke="rgba(72,110,144,0.5)" stroke-width="1"/><text x="${x}" y="${h - axisH + 13}" fill="#6c8db0" font-size="8" text-anchor="middle">${t>0?"+":""}${t}%</text>`; }).join(""); return `<div style="overflow-x:auto;margin:12px 0"><div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;display:flex;gap:14px"><span><span style="color:#ff5a7a">■</span> Downside risk</span><span><span style="color:#5a9eff">■</span> Upside potential</span></div><svg viewBox="-${labelW} 0 ${labelW+chartW+60} ${h}" style="width:100%;max-width:${labelW+chartW+60}px;height:${h}px;font-family:Inter">${axis}${bars}</svg></div>`; }
function extractKeyTakeaways(profileText, m, sym) { const takeaways = []; if (m.av.gpm > 40) takeaways.push(`✅ High gross margin (${P1(m.av.gpm)}) – strong pricing power.`); else if (m.av.gpm > 20) takeaways.push(`📊 Gross margin of ${P1(m.av.gpm)} is healthy.`); else takeaways.push(`⚠️ Thin gross margin (${P1(m.av.gpm)}) – cost inflation risk.`); if (m.av.npm > 20) takeaways.push(`💰 Excellent net profitability (${P1(m.av.npm)}) – well-run business.`); else if (m.av.npm > 10) takeaways.push(`💵 Solid net margin (${P1(m.av.npm)}) – efficient.`); else takeaways.push(`📉 Low net margin (${P1(m.av.npm)}) – earnings sensitive.`); if (m.av.roe > 20) takeaways.push(`🚀 Outstanding ROE (${P1(m.av.roe)}) – great capital allocation.`); else if (m.av.roe > 12) takeaways.push(`📈 Good ROE (${P1(m.av.roe)}) – solid returns.`); else takeaways.push(`🐢 ROE of ${P1(m.av.roe)} – mediocre capital deployment.`); if (m.buff > 100) takeaways.push(`🧠 Passes Buffett $1 test – retained earnings create >$1 value.`); else if (m.buff > 0) takeaways.push(`📊 Buffett test score ${P1(m.buff)} – some value creation.`); else if (m.buff !== null) takeaways.push(`⚠️ Buffett test score ${P1(m.buff)} – retained earnings destroy value.`); if (m.cg.rev > 10) takeaways.push(`📈 Strong revenue growth (${P1(m.cg.rev)} CAGR).`); else if (m.cg.rev < 0) takeaways.push(`📉 Revenue declining (${P1(m.cg.rev)} CAGR).`); if (m.av.debtToEquity > 80) takeaways.push(`⚠️ High leverage (D/E ${P1(m.av.debtToEquity)}) – debt risk.`); else if (m.av.debtToEquity < 30) takeaways.push(`✅ Low debt (D/E ${P1(m.av.debtToEquity)}) – safe balance sheet.`); const leader = LEADERSHIP[sym]; if (leader) takeaways.push(`👔 CEO ${leader.ceo} – ${leader.track.substring(0, 100)}.`); return takeaways; }
function tabInsights(sym, st) { const stockData = S.data[sym]; const profileMd = stockData?.profile || ""; const m = calcM(sym); if (!m) return `<div class="state-box"><p>No financial data for insights.</p></div>`; let leftHtml = "", rightHtml = ""; if (profileMd && profileMd.length > 100) { const sections = {}; const parts = profileMd.split(/(?=^## )/gm); for (const part of parts) { const match = part.match(/^## (.+)$/m); if (match) sections[match[1].trim()] = part; } const leftOrder = ["Business Model Canvas", "SWOT Analysis", "PESTLE Analysis", "Porter's Five Forces"]; const rightOrder = ["Management & Decision Making", "Future Outlook"]; for (const title of leftOrder) if (sections[title]) leftHtml += `<div class="ai-content">${markdownToHtml(sections[title])}</div>`; for (const title of rightOrder) if (sections[title]) rightHtml += `<div class="ai-content">${markdownToHtml(sections[title])}</div>`; } const leader = LEADERSHIP[sym]; if (leader && !profileMd.includes("Leadership")) { rightHtml += `<div class="ai-content"><h2>🧠 Leadership</h2><p><strong>CEO:</strong> ${leader.ceo}<br><strong>CFO:</strong> ${leader.cfo}<br><strong>Track Record:</strong> ${leader.track}</p></div>`; } const tornadoVars = generateCustomTornado(sym, st, m); if (tornadoVars.length) { rightHtml += `<div class="ai-content"><h2>🌪️ Sensitivity Analysis – Net Profit Impact</h2><p style="font-size:11px;color:var(--text-muted);">Estimated % change in net profit under different scenarios.</p>${renderTornadoChart(tornadoVars)}</div>`; } const takeaways = extractKeyTakeaways(profileMd, m, sym); if (takeaways.length) { rightHtml += `<div class="ai-content"><h2>🔑 Key Takeaways for Long‑Term Investors</h2><ul>${takeaways.map(t => `<li>${t}</li>`).join('')}</ul></div>`; } if (!leftHtml && !rightHtml) { return `<div class="state-box"><p>Insights not yet generated for ${sym}. Run the GitHub Actions workflow to generate full analysis or use Edit to add profile text.</p></div>`; } return `<div class="ai-panel"><div style="margin-bottom:20px;"><div style="font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;"><span>${st.name}</span><span style="font-size:12px;color:var(--text-muted);">${sym} · ${st.exchange}</span></div></div><div class="insights-two-col"><div>${leftHtml || '<div class="ai-content"><p>Business model and strategic analysis will appear after data refresh.</p></div>'}</div><div>${rightHtml}</div></div><div class="ai-cache-note" style="font-size:10px;color:var(--text-muted);margin-top:12px;">📚 Sources: Annual reports, Yahoo Finance, StockAnalysis.com</div></div>`; }

function renderMain(){const cont=document.getElementById('cont');if(S.tab==='rankings'){cont.innerHTML=tabRankings();return;}if(S.tab==='insights'){const st=S.stocks[S.sel];cont.innerHTML=tabInsights(S.sel,st);return;}const st=S.stocks[S.sel];const stat=S.status[S.sel]||'idle';if(stat==='loading'){cont.innerHTML=`<div class="state-box"><div class="spinner"></div><div>Loading ${S.sel}...</div></div>`;return;}if(!S.data[S.sel]){cont.innerHTML=`<div class="state-box"><p>No data for ${S.sel}. Use Edit to enter.</p></div>`;return;}if(S.tab==='data')cont.innerHTML=tabData(S.sel,st);else if(S.tab==='ratios')cont.innerHTML=tabRatios(S.sel,st);else if(S.tab==='chart'){cont.innerHTML=tabChartHTML(S.sel,st);setTimeout(()=>makeChart(S.sel),80);}}
function render(){renderSBar();renderTabBtns();renderMain();saveLS();}
async function boot(){loadLS();initPreloadedData();let liveData=null;if(location.protocol!=='file:'){try{const r=await fetch('./data.json?_='+Date.now());if(r.ok){liveData=await r.json();}}catch(e){}}if(liveData&&liveData.stocks){ANNUALISATION=liveData.annualisation||{};const ts=Date.now();S.stocks={...BASE_STOCKS};S.custom={};S.deleted={};Object.entries(liveData.stocks).forEach(([sym,sd])=>{const hasData=Array.isArray(sd.revenue)&&sd.revenue.some(v=>v!==null);S.stocks[sym]={name:sd.name||sym,exchange:sd.exchange||'NYSE',currency:sd.currency||'B USD'};S.data[sym]={totalAsset:sd.totalAsset,cash:sd.cash,totalDebt:sd.totalDebt,totalEquity:sd.totalEquity,revenue:sd.revenue,grossProfit:sd.grossProfit,netProfit:sd.netProfit,eps:sd.eps,dps:sd.dps,fetchedAt:ts,source:sd.source==='yfinance'?'yfinance':'built-in',ticker:sd.ticker,generated:liveData.generated,profile:sd.profile,profileDate:sd.profileDate};S.status[sym]=hasData?'ok':'idle';});const genDate=new Date(liveData.generated).toLocaleDateString();const hSub=document.getElementById('hSub');if(hSub)hSub.textContent=`ASX · IDX · NYSE/NASDAQ — ${genDate} · ${Object.keys(liveData.stocks).length} stocks`;if(!S.stocks[S.sel])S.sel=Object.keys(S.stocks)[0]||'BHP';}else{const hSub=document.getElementById('hSub');if(hSub)hSub.textContent=`ASX · IDX · NYSE/NASDAQ — Built-in data · Host on GitHub Pages`;if(!S.stocks[S.sel])S.sel='BHP';}Object.keys(S.stocks).forEach(k=>{if(!S.status[k])S.status[k]=S.data[k]?'ok':'idle';});render();}
boot();
