<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>FA Dashboard — Fundamental Analysis | Modern Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-deep: #0a0c12; --bg-surface-1: rgba(15, 25, 35, 0.75); --bg-surface-2: rgba(20, 32, 45, 0.85);
  --border-glow: rgba(0, 224, 255, 0.3); --border-light: rgba(72, 110, 144, 0.35);
  --accent-cyan: #00e4ff; --accent-cyan-glow: rgba(0, 228, 255, 0.25); --accent-green: #00f5a0;
  --accent-red: #ff5a7a; --accent-gold: #ffcf4a; --accent-purple: #c0a5ff; --accent-blue: #5a9eff;
  --text-primary: #f0f6ff; --text-secondary: #b8d0ea; --text-muted: #6c8db0;
  --glass-blur: blur(16px); --shadow-sm: 0 8px 20px rgba(0,0,0,0.3); --transition-fast: 0.2s ease;
  --hdr-h: 52px; --bottom-nav-h: 0px;
}
body { background: radial-gradient(circle at 10% 20%, #0f1722, #03050b); color: var(--text-primary); font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; line-height: 1.4; letter-spacing: -0.01em; }
::-webkit-scrollbar { width: 5px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 10px; }

/* ================= HEADER ================= */
#hdr {
  background: rgba(8, 16, 24, 0.85);
  backdrop-filter: var(--glass-blur);
  border-bottom: 1px solid var(--border-glow);
  padding: 8px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  position: sticky; top: 0; z-index: 200;
  box-shadow: var(--shadow-sm);
  min-height: var(--hdr-h);
}
.h-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.h-title-block { min-width: 0; }
.h-logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent-cyan), #0077b3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; box-shadow: 0 0 12px var(--accent-cyan-glow); flex-shrink: 0; }
.h-title { font-size: 14px; font-weight: 700; letter-spacing: -0.3px; background: linear-gradient(135deg, #fff, var(--accent-cyan)); background-clip: text; -webkit-background-clip: text; color: transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-sub { font-size: 10px; color: var(--text-secondary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; position: relative; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 40px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; transition: var(--transition-fast); backdrop-filter: blur(4px); font-family: inherit; min-height: 32px; }
.btn-ghost { background: rgba(255,255,255,0.05); color: var(--text-secondary); border: 1px solid rgba(0,228,255,0.2); }
.btn-ghost:hover { background: rgba(0,228,255,0.1); color: var(--accent-cyan); }
.btn-sm { padding: 5px 12px; font-size: 11px; }
.btn-xs { padding: 3px 10px; font-size: 10px; }

/* ================= STOCK SELECTOR DROPDOWN ================= */
.stock-dropdown-toggle {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  border-radius: 40px;
  border: 1px solid rgba(0,228,255,0.25);
  background: rgba(255,255,255,0.05);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: var(--transition-fast);
  font-family: inherit;
  min-height: 34px;
  max-width: 220px;
}
.stock-dropdown-toggle:hover { background: rgba(0,228,255,0.1); border-color: var(--accent-cyan); }
.stock-dropdown-toggle .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.stock-dropdown-toggle .dot.ok { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
.stock-dropdown-toggle .dot.err { background: var(--accent-red); }
.stock-dropdown-toggle .dot.idle { background: var(--text-muted); }
.stock-dropdown-toggle .sym { font-weight: 800; letter-spacing: -0.02em; }
.stock-dropdown-toggle .exch-badge { font-size: 8.5px; padding: 1px 6px; border-radius: 20px; font-weight: 700; background: rgba(0,0,0,0.3); color: var(--text-secondary); }
.stock-dropdown-toggle .chevron { font-size: 9px; transition: transform 0.2s ease; margin-left: auto; color: var(--accent-cyan); }
.dropdown.open .stock-dropdown-toggle .chevron { transform: rotate(180deg); }

/* ================= DROPDOWN MENU ================= */
.dropdown { position: relative; display: inline-block; }
.dropdown-menu { position: absolute; top: calc(100% + 6px); background: rgba(12, 22, 32, 0.98); backdrop-filter: blur(20px); border: 1px solid var(--border-glow); border-radius: 16px; min-width: 220px; padding: 6px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); z-index: 300; opacity: 0; visibility: hidden; transform: translateY(-6px); transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s; max-height: 70vh; overflow-y: auto; }
.dropdown.open .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
.dropdown-menu.right { right: 0; }
.dropdown-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: var(--text-secondary); font-size: 12px; font-weight: 500; cursor: pointer; transition: var(--transition-fast); border: none; background: transparent; width: 100%; text-align: left; font-family: inherit; }
.dropdown-item:hover { background: rgba(0,228,255,0.1); color: var(--accent-cyan); }
.dropdown-item .icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.dropdown-divider { height: 1px; background: var(--border-light); margin: 5px 8px; }
.dropdown-item.danger { color: #ff8aab; }
.dropdown-item.danger:hover { background: rgba(255,90,122,0.12); color: var(--accent-red); }
.dropdown-item.on { background: rgba(0,228,255,0.14); color: var(--accent-cyan); }
.dropdown-item .stock-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dropdown-item .stock-dot.ok { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
.dropdown-item .stock-dot.err { background: var(--accent-red); }
.dropdown-item .stock-dot.idle { background: var(--text-muted); }
.dropdown-item .stock-sym { font-weight: 800; letter-spacing: -0.02em; min-width: 48px; }
.dropdown-item .stock-name { flex: 1; font-size: 10.5px; color: var(--text-muted); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dropdown-item .stock-exch { font-size: 8.5px; padding: 1px 6px; border-radius: 20px; font-weight: 700; background: rgba(0,0,0,0.35); color: var(--text-muted); }
.dropdown-item.on .stock-exch { background: rgba(0,228,255,0.2); color: var(--accent-cyan); }

/* ================= NAV (desktop tabs) ================= */
#navWrap {
  position: sticky; top: var(--hdr-h); z-index: 199;
  background: rgba(8, 16, 24, 0.75);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 10px;
  padding: 6px 16px;
}
#tBar { display: flex; gap: 2px; flex: 1; overflow-x: auto; scrollbar-width: none; }
#tBar::-webkit-scrollbar { display: none; }
.t-btn { padding: 7px 12px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; font-family: inherit; min-height: 32px; }
.t-btn:hover { color: var(--text-secondary); }
.t-btn.on { border-bottom-color: var(--accent-cyan); color: var(--accent-cyan); }

/* ================= BOTTOM NAV (mobile only) ================= */
#bottomNav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 250;
  background: rgba(8, 16, 24, 0.96);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-glow);
  box-shadow: 0 -8px 24px rgba(0,0,0,0.4);
  padding-bottom: env(safe-area-inset-bottom, 0);
  padding-left: env(safe-area-inset-left, 0);
  padding-right: env(safe-area-inset-right, 0);
  height: calc(60px + env(safe-area-inset-bottom, 0px));
  grid-template-columns: repeat(4, 1fr);
}
.bn-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  padding: 6px 4px;
  position: relative;
  transition: color 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.bn-btn .bn-icon { font-size: 18px; line-height: 1; }
.bn-btn .bn-label { font-size: 10px; letter-spacing: 0.01em; }
.bn-btn.on { color: var(--accent-cyan); }
.bn-btn.on::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 32px;
  height: 3px;
  background: var(--accent-cyan);
  border-radius: 0 0 4px 4px;
  box-shadow: 0 0 10px var(--accent-cyan-glow);
}
.bn-btn:active { background: rgba(0,228,255,0.06); }

/* ================= RESPONSIVE ================= */
@media (max-width: 900px) {
  :root { --bottom-nav-h: 60px; }
  body { padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
  #navWrap { display: none; }
  #bottomNav { display: grid; }
  .h-sub { display: none; }
  .h-title { font-size: 13px; }
  .btn .lbl { display: none; }
  .btn { padding: 7px 10px; }
  .stock-dropdown-toggle { max-width: 160px; padding: 6px 10px; }
  #shareDropdown .dropdown-menu { max-height: calc(100vh - 120px); }
}

/* ================= CONTENT ================= */
#cont { padding: 16px 18px; max-width: 1500px; margin: 0 auto; }
.sec { margin-bottom: 16px; }
.sec-t { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-cyan); margin-bottom: 10px; padding-left: 10px; border-left: 3px solid var(--accent-cyan); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 8px; margin-bottom: 16px; }
.card { background: var(--bg-surface-2); backdrop-filter: blur(4px); border: 1px solid rgba(0,228,255,0.15); border-radius: 14px; padding: 10px 12px; }
.card:hover { border-color: var(--accent-cyan); }
.card-l { font-size: 9.5px; color: var(--text-muted); margin-bottom: 5px; }
.card-v { font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #fff, var(--accent-cyan)); background-clip: text; -webkit-background-clip: text; color: transparent; }

.tw { overflow-x: auto; border-radius: 14px; border: 1px solid rgba(0,228,255,0.15); background: rgba(8, 16, 24, 0.5); }
table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
thead th { background: rgba(0, 150, 180, 0.22); padding: 8px 10px; text-align: left; font-size: 9.5px; text-transform: uppercase; color: var(--accent-cyan); font-weight: 700; }
tbody td { padding: 7px 10px; border-bottom: 1px solid rgba(72, 110, 144, 0.2); white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
tbody tr:hover td { background: rgba(0, 228, 255, 0.05); }

.tw table td:first-child, .tw table th:first-child {
  position: sticky; left: 0; z-index: 2;
  background: rgba(10,12,18,0.96);
  box-shadow: 1px 0 0 rgba(72,110,144,0.25);
  backdrop-filter: blur(4px);
}
.tw thead th:first-child { background: rgba(0,150,180,0.30) !important; }

.wt-wrap { border-radius: 24px; padding: 20px; background: var(--bg-surface-2); backdrop-filter: blur(8px); border: 1px solid rgba(0,228,255,0.2); }
.wt-card { background: var(--bg-surface-1); border-radius: 18px; padding: 12px; }
.wt-card.ov { border: 1px solid var(--accent-gold); background: rgba(255,207,74,0.08); }
.wt-inp { width: 65px; background: #0c121c; border: 1px solid var(--border-light); border-radius: 12px; padding: 6px 8px; font-size: 13px; font-weight: 700; color: var(--text-primary); font-family: inherit; }
.wt-inp:focus { outline: none; border-color: var(--accent-cyan); }
.state-box { background: var(--bg-surface-2); backdrop-filter: blur(8px); border: 1px solid rgba(0,228,255,0.2); border-radius: 32px; padding: 48px 24px; text-align: center; }
.rc { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 30px; font-size: 11px; font-weight: 800; }
.rc1 { background: var(--accent-gold); color: #0a0c12; }
.rc2 { background: #adc6ff; color: #03050b; }
.rc3 { background: var(--accent-purple); color: #03050b; }
.rc4 { background: var(--accent-green); color: #03050b; }
.rc5 { background: var(--accent-blue); color: #03050b; }
.insights-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.ai-content { background: var(--bg-surface-1); backdrop-filter: blur(8px); border-radius: 20px; padding: 16px; border: 1px solid rgba(0,228,255,0.15); margin-bottom: 14px; }
.ai-content h2 { font-size: 15px; font-weight: 700; color: var(--accent-cyan); margin-bottom: 12px; border-left: 3px solid var(--accent-cyan); padding-left: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ai-content ul { list-style: none; padding-left: 0; }
.ai-content li { font-size: 12px; color: #b8d0ea; line-height: 1.6; padding-left: 14px; position: relative; margin-bottom: 6px; }
.ai-content li:before { content: "▸"; position: absolute; left: 0; color: var(--accent-cyan); }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--bg-surface-2); border: 1px solid var(--accent-cyan); border-radius: 32px; width: 100%; max-width: 980px; max-height: 90vh; overflow-y: auto; }
.modal-h { padding: 18px 24px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: inherit; backdrop-filter: blur(12px); }
@media (max-width: 640px) { #cont { padding: 12px; } .cards { grid-template-columns: repeat(2,1fr); } .insights-two-col { grid-template-columns: 1fr; } }
.pos { color: var(--accent-green); font-weight: 600; }
.neg { color: var(--accent-red); }
.cya { color: var(--accent-cyan); }
.src-bar { background: rgba(8, 16, 24, 0.7); border-radius: 14px; padding: 10px 16px; margin-bottom: 14px; border: 1px solid rgba(0,228,255,0.2); }
#debugPanel { position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); border: 1px solid var(--accent-cyan); border-radius: 12px; padding: 10px 15px; font-size: 10px; color: var(--text-muted); z-index: 9999; display: none; }
#debugPanel.visible { display: block; }

.rankings-top-grid { display: grid; grid-template-columns: 1.35fr 1.55fr 1.15fr; gap: 14px; margin-bottom: 18px; align-items: stretch; }
@media (max-width: 1200px) { .rankings-top-grid { grid-template-columns: 1fr 1fr; } .rankings-top-grid > div:last-child { grid-column: span 2; } }
@media (max-width: 768px) { .rankings-top-grid { grid-template-columns: 1fr; } .rankings-top-grid > div:last-child { grid-column: span 1; } }

.panel { background: var(--bg-surface-2); border-radius: 16px; padding: 16px 18px; border: 1px solid var(--border-light); display: flex; flex-direction: column; }
.panel-header { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; letter-spacing: -0.01em; }
.panel-sub { font-size: 10.5px; color: var(--text-muted); margin-bottom: 12px; }

.wt-toggle-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
.wt-toggle-btn { background: rgba(0, 228, 255, 0.08); border: 1px solid rgba(0, 228, 255, 0.25); color: var(--accent-cyan); padding: 8px 16px; border-radius: 40px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: var(--transition-fast); }
.wt-toggle-btn:hover { background: rgba(0, 228, 255, 0.15); }
.wt-panel { display: none; margin-bottom: 20px; }
.wt-panel.open { display: block; }

.logo-container { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logo-img {
  border-radius: 10px; background: #fff; padding: 2px; object-fit: contain;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08); display: block;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
  transform: translateZ(0); will-change: transform;
}
.logo-mono { display: none; align-items: center; justify-content: center; font-weight: 800; color: #03050b; background: linear-gradient(135deg, var(--accent-cyan), #0077b3); border-radius: 10px; font-family: 'Space Grotesk', sans-serif; }

.podium-cards { display: flex; flex-direction: column; gap: 14px; margin-top: auto; padding-top: 12px; width: 100%; }
.podium-row { display: flex; justify-content: center; align-items: flex-end; gap: 12px; width: 100%; }
.podium-card { background: var(--bg-surface-1); border-radius: 16px; padding: 16px 12px 14px; text-align: center; position: relative; border: 1px solid var(--border-light); transition: transform 0.2s; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: 1 1 0; min-width: 0; box-sizing: border-box; }
.podium-card:hover { transform: translateY(-4px); }
.podium-card.rank-1 { min-height: 210px; border-color: rgba(255,207,74,0.7); background: linear-gradient(180deg, rgba(255,207,74,0.16), rgba(15,25,35,0.9)); box-shadow: 0 0 24px rgba(255,207,74,0.15); }
.podium-card.rank-2 { min-height: 175px; border-color: rgba(173,198,255,0.55); background: linear-gradient(180deg, rgba(173,198,255,0.09), rgba(15,25,35,0.9)); }
.podium-card.rank-3 { min-height: 175px; border-color: rgba(192,165,255,0.55); background: linear-gradient(180deg, rgba(192,165,255,0.09), rgba(15,25,35,0.9)); }
.podium-card.rank-4 { min-height: 160px; border-color: rgba(0,245,160,0.4); background: linear-gradient(180deg, rgba(0,245,160,0.07), rgba(15,25,35,0.9)); }
.podium-card.rank-5 { min-height: 160px; border-color: rgba(90,158,255,0.4); background: linear-gradient(180deg, rgba(90,158,255,0.07), rgba(15,25,35,0.9)); }
.podium-rank { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; }
.rank-1 .podium-rank { background: var(--accent-gold); color: #000; box-shadow: 0 0 12px rgba(255,207,74,0.7); }
.rank-2 .podium-rank { background: #adc6ff; color: #000; }
.rank-3 .podium-rank { background: var(--accent-purple); color: #000; }
.rank-4 .podium-rank { background: var(--accent-green); color: #000; }
.rank-5 .podium-rank { background: var(--accent-blue); color: #000; }
.podium-logo-wrap { display: flex; justify-content: center; margin-bottom: 10px; }
.podium-ticker { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 2px; }
.podium-name { font-size: 10px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.podium-score { font-size: 17px; font-weight: 700; color: var(--accent-cyan); margin-top: auto; }
.podium-quote { font-size: 10px; color: var(--text-muted); text-align: center; margin-top: 14px; font-style: italic; letter-spacing: 0.02em; }

/* ================= SCATTER CHART (fixed proportional) ================= */
.scatter-container {
  position: relative;
  flex: 1 1 auto;
  min-height: 340px;
  height: 100%;
  width: 100%;
}
.scatter-container canvas {
  display: block !important;
  width: 100% !important;
  height: 100% !important;
}
.scatter-legend {
  position: absolute;
  top: 4px; right: 4px;
  display: flex; gap: 10px; font-size: 10px;
  color: var(--text-muted);
  z-index: 10;
  background: rgba(15,25,35,0.7);
  padding: 4px 8px; border-radius: 8px;
  backdrop-filter: blur(4px);
  pointer-events: none;
}
.scatter-legend span { display: flex; align-items: center; gap: 4px; }
.scatter-legend .legend-dot { width: 9px; height: 9px; border-radius: 50%; }

.panel.scatter-panel {
  display: flex;
  flex-direction: column;
  min-height: 420px;
}
.panel.scatter-panel .scatter-container { flex: 1 1 auto; }

.selected-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border-light); }
.selected-info { flex: 1; min-width: 0; }
.selected-ticker { font-size: 16px; font-weight: 700; }
.selected-name { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.selected-score-box { text-align: right; flex-shrink: 0; }
.selected-score { font-size: 18px; font-weight: 800; color: var(--accent-cyan); }
.selected-rank { font-size: 10px; color: var(--text-muted); }
.tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border-light); padding-bottom: 8px; }

const WIKI_LOGO_CACHE = {};
const WIKI_PENDING = {};

function fetchWikiLogo(ticker, wikiName) {
  if (Object.prototype.hasOwnProperty.call(WIKI_LOGO_CACHE, ticker)) return Promise.resolve(WIKI_LOGO_CACHE[ticker]);
  if (WIKI_PENDING[ticker]) return WIKI_PENDING[ticker];
  const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiName)}?redirect=true`;
  const promise = fetch(url)
    .then(r => r.ok ? r.json() : null)
    .then(data => { const logo = (data && (data.thumbnail?.source || data.originalimage?.source)) || null; WIKI_LOGO_CACHE[ticker] = logo; delete WIKI_PENDING[ticker]; return logo; })
    .catch(() => { WIKI_LOGO_CACHE[ticker] = null; delete WIKI_PENDING[ticker]; return null; });
  WIKI_PENDING[ticker] = promise;
  return promise;
}

window.handleLogoError = function(img) {
  const fallbacks = img.dataset.fallbacks ? img.dataset.fallbacks.split(';').filter(Boolean) : [];
  if (fallbacks.length > 0) { const nextUrl = fallbacks.shift(); img.src = nextUrl; img.dataset.fallbacks = fallbacks.join(';'); return; }
  const sym = img.dataset.sym;
  const wikiName = img.dataset.wiki;
  if (sym && wikiName && !img.dataset.wikiTried) {
    img.dataset.wikiTried = '1';
    fetchWikiLogo(sym, wikiName).then(logoUrl => {
      if (logoUrl) { img.onerror = function() { img.style.display = 'none'; const mono = img.nextElementSibling; if (mono) mono.style.display = 'flex'; }; img.src = logoUrl; img.style.display = ''; }
      else { img.style.display = 'none'; const mono = img.nextElementSibling; if (mono) mono.style.display = 'flex'; }
    });
    return;
  }
  img.style.display = 'none';
  const mono = img.nextElementSibling;
  if (mono) mono.style.display = 'flex';
};

function getLogoHtml(sym, size = 32) {
  const domains = (DOMAIN_MAP[sym] || '').split('|').filter(Boolean);
  const initials = sym.substring(0, 2).toUpperCase().replace(/[^A-Z]/g, '');
  const monoStyle = `width:${size}px;height:${size}px;font-size:${Math.round(size*0.42)}px;`;
  const wikiName = WIKI_NAMES[sym] || '';
  if (!domains.length && !wikiName) return `<div class="logo-container"><div class="logo-mono" style="display:flex;${monoStyle}">${initials}</div></div>`;
  const urls = [];
  domains.forEach(d => urls.push(`https://logo.clearbit.com/${d}?size=128`));
  domains.forEach(d => urls.push(`https://www.google.com/s2/favicons?domain=${d}&sz=128`));
  domains.forEach(d => urls.push(`https://icons.duckduckgo.com/ip3/${d}.ico`));
  domains.forEach(d => urls.push(`https://icon.horse/icon/${d}`));
  const firstUrl = urls.shift() || 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  const fallbackUrls = urls.join(';');
  return `<div class="logo-container"><img src="${firstUrl}" data-fallbacks="${fallbackUrls}" data-sym="${sym}" data-wiki="${wikiName}" class="logo-img" width="${size}" height="${size}" style="width:${size}px;height:${size}px;" onerror="handleLogoError(this)" loading="lazy" referrerpolicy="no-referrer"/><div class="logo-mono" style="display:none;${monoStyle}">${initials}</div></div>`;
}

function initPreloadedData(){const ts=Date.now();for(const sym in BASE_STOCKS){if(PRELOADED[sym]&&(!S.data[sym]||S.data[sym].source==='built-in')){S.data[sym]={...PRELOADED[sym],fetchedAt:ts,source:'built-in',ticker:yahooTicker(sym,BASE_STOCKS[sym].exchange)};S.status[sym]='ok';}else if(!PRELOADED[sym]&&!S.data[sym]){const emptyArr=Array(N_YEARS).fill(null);S.data[sym]={totalAsset:emptyArr.slice(),cash:emptyArr.slice(),totalDebt:emptyArr.slice(),totalEquity:emptyArr.slice(),revenue:emptyArr.slice(),grossProfit:emptyArr.slice(),netProfit:emptyArr.slice(),eps:emptyArr.slice(),dps:emptyArr.slice(),fetchedAt:ts,source:'built-in',ticker:yahooTicker(sym,BASE_STOCKS[sym].exchange)};S.status[sym]='idle';}}}
function yahooTicker(symbol,exchange){if(exchange==='ASX')return symbol+'.AX';if(exchange==='IDX')return symbol+'.JK';return symbol;}
const isOK=v=>v!==null&&v!==undefined&&isFinite(v)&&!isNaN(v);
const avg=a=>{const v=a.filter(isOK);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
const N2=(v,d=2)=>isOK(v)?Number(v).toFixed(d):'N/A';
const P1=(v,d=1)=>isOK(v)?Number(v).toFixed(d)+'%':'N/A';
function cagr(a){const v=a.filter(isOK);if(v.length<2)return null;const s=v[0],e=v[v.length-1],n=v.length-1;if(s===0||n===0)return null;if(s>0&&e>0)return(Math.pow(e/s,1/n)-1)*100;return null;}
function latestTwo(arr) {
  const idxs = arr.map((v,i)=>isOK(v)?i:-1).filter(i=>i!==-1);
  if (!idxs.length) return {latest:null, latestIdx:-1, prev:null, prevIdx:-1};
  const latestIdx = idxs[idxs.length-1];
  const prevIdx = idxs.length>=2 ? idxs[idxs.length-2] : -1;
  return {latest: arr[latestIdx], latestIdx, prev: prevIdx>=0 ? arr[prevIdx] : null, prevIdx};
}

function isBank(sym) {
    if (!sym) return false;
    const sector = CO_INFO[sym]?.sector;
    return sector === 'Banking' || sector === 'Islamic Banking';
}

function calcM(symbol){
  const data=S.data[symbol];
  if(!data){return {Y:YEARS.map(yr=>({year:yr,cashToAsset:null,debtToEquity:null,equityToAsset:null,gpm:null,npm:null,roa:null,roe:null,divPayout:null,valLow:null,valHigh:null,retEps:null})),av:{cashToAsset:null,debtToEquity:null,equityToAsset:null,gpm:null,npm:null,roa:null,roe:null,divPayout:null},cg:{rev:null,np:null,eps:null,dps:null},epsInc:null,totRet:null,buff:null,raw:{ta:[],ca:[],td:[],te:[],rv:[],gp:[],np:[],ep:[],dp:[]},rm:{cashToAsset:null,debtToEquity:null,equityToAsset:null,revenueCagr:null,gpmAvg:null,netProfitCagr:null,npmAvg:null,epsCagr:null,dpsCagr:null,roeAvg:null,dividendPayout:null,buffettTest:null}};}
  const sl=k=>(data[k]||Array(N_YEARS).fill(null)).slice(0,N_YEARS);
  const ta=sl('totalAsset'),ca=sl('cash'),td=sl('totalDebt'),te=sl('totalEquity');
  const rv2=sl('revenue'),gp=sl('grossProfit'),np=sl('netProfit'),ep=sl('eps'),dp=sl('dps');
  const Y=YEARS.map((yr,i)=>({year:yr,totalAsset:ta[i],cash:ca[i],totalDebt:td[i],totalEquity:te[i],revenue:rv2[i],grossProfit:gp[i],netProfit:np[i],eps:ep[i],dps:dp[i],
    cashToAsset:(isOK(ta[i])&&ta[i]>0&&isOK(ca[i]))?ca[i]/ta[i]*100:null,
    debtToEquity:(isOK(te[i])&&te[i]!==0&&isOK(td[i]))?td[i]/te[i]*100:null,
    equityToAsset:(isOK(ta[i])&&ta[i]>0&&isOK(te[i]))?te[i]/ta[i]*100:null,
    gpm:(isOK(rv2[i])&&rv2[i]>0&&isOK(gp[i]))?gp[i]/rv2[i]*100:null,
    npm:(isOK(rv2[i])&&rv2[i]>0&&isOK(np[i]))?np[i]/rv2[i]*100:null,
    roa:(isOK(ta[i])&&ta[i]>0&&isOK(np[i]))?np[i]/ta[i]*100:null,
    roe:(isOK(te[i])&&te[i]!==0&&isOK(np[i]))?np[i]/te[i]*100:null,
    divPayout:(isOK(ep[i])&&ep[i]>0&&isOK(dp[i]))?dp[i]/ep[i]*100:null,
    valLow:isOK(dp[i])?dp[i]*10:null,valHigh:isOK(dp[i])?dp[i]*20:null,retEps:null}));
  const av={cashToAsset:avg(Y.map(y=>y.cashToAsset)),debtToEquity:avg(Y.map(y=>y.debtToEquity)),equityToAsset:avg(Y.map(y=>y.equityToAsset)),gpm:avg(Y.map(y=>y.gpm)),npm:avg(Y.map(y=>y.npm)),roa:avg(Y.map(y=>y.roa)),roe:avg(Y.map(y=>y.roe)),divPayout:avg(Y.map(y=>y.divPayout))};
  const cg={rev:cagr(rv2),np:cagr(np),eps:cagr(ep),dps:cagr(dp)};
  const NC=N_YEARS-1,epCompleted=ep.slice(0,NC),dpCompleted=dp.slice(0,NC);
  const retEpsCompleted=epCompleted.map((e,i)=>{if(!isOK(e))return null;const d=isOK(dpCompleted[i])?dpCompleted[i]:0;return e-d;});
  const retEpsVals=retEpsCompleted.filter(isOK);
  const totRet=retEpsVals.length>0?retEpsVals.reduce((s,v)=>s+v,0):null;
  const epCompletedOK=epCompleted.filter(isOK);
  const epsInc=epCompletedOK.length>=2?epCompletedOK[epCompletedOK.length-1]-epCompletedOK[0]:null;
  const buff=(isOK(totRet)&&Math.abs(totRet)>0.001&&isOK(epsInc))?epsInc/totRet*100:null;
  Y.forEach((y,i)=>{if(!isOK(y.eps)){y.retEps=null;return;}const d=isOK(y.dps)?y.dps:0;y.retEps=y.eps-d;});
  return {Y,av,cg,epsInc,totRet,buff,raw:{ta,ca,td,te,rv:rv2,gp,np,ep,dp},rm:{cashToAsset:av.cashToAsset,debtToEquity:av.debtToEquity,equityToAsset:av.equityToAsset,revenueCagr:cg.rev,gpmAvg:av.gpm,netProfitCagr:cg.np,npmAvg:av.npm,epsCagr:cg.eps,dpsCagr:cg.dps,roeAvg:av.roe,dividendPayout:av.divPayout,buffettTest:buff}};
}

function yearColHeader(sym,yr){if(yr!==CURRENT_YEAR)return `<th class="tc" style="white-space:nowrap">${yr}</th>`;const ann=ANNUALISATION[sym]||{label:null};if(!ann.label||ann.label==='FY'){const tag=ann?.label==='FY'?'FY':'Est.';return `<th class="tc" style="white-space:nowrap;color:var(--accent-gold)">${yr}<br><span style="font-size:8px;">${tag}</span></th>`;}const asOf=ann.asOf?` ${ann.asOf.slice(5)}`:'';return `<th class="tc" style="white-space:nowrap;color:#ffaa44">${yr}<br><span style="font-size:8px;">${ann.label}${asOf}</span></th>`;}
function srcBar(sym,st){const d=S.data[sym];const isCustom=!!S.custom[sym];const ticker=d?.ticker||yahooTicker(sym,st.exchange||'');const src=d?.source||'built-in';let badge,note;if(src==='yfinance'){const gen=d?.generated?new Date(d.generated).toLocaleDateString():'—';badge=`<span>✓ Auto-refreshed</span>`;note=`Live via yfinance · Refreshed: ${gen}`;}else{badge=`<span>📋 Built-in data</span>`;note=`Embedded from annual reports`;}return `<div class="src-bar"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div>${badge}<div style="margin-top:4px;font-size:12px"><strong>${st.name}</strong> · ${st.exchange} · ${st.currency} · <code style="background:rgba(0,0,0,.2);padding:0 5px;border-radius:3px;font-size:9px">${ticker}</code><br><span style="font-size:11px;color:var(--text-muted)">${note}</span></div></div><div style="display:flex;gap:6px;"><button class="btn btn-ghost btn-xs" onclick="showManual('${sym}')">✏ Edit</button>${isCustom?`<button class="btn btn-red btn-xs" onclick="delStock('${sym}')">🗑 Remove</button>`:''}</div></div></div>`;}

function tabFinancials(sym, st) {
  const m = calcM(sym);
  if (!m) return '<p>No data</p>';
  const yH = YEARS.map(y => yearColHeader(sym, y)).join('');
  const rawRows = MKEYS.map((r, i) => {
    const cells = m.Y.map(y => { const v = y[r.k]; return `<td class="tc num${isOK(v) && v < 0 ? ' neg' : ''}" style="text-align:right">${N2(v, 2)}</td>`; }).join('');
    const a = avg(m.Y.map(y => y[r.k]));
    const cg = cagr(m.Y.map(y => y[r.k]));
    return `<tr class="${i % 2 ? 'ev' : ''}"><td class="lbl">${r.l}</td>${cells}<td class="tc num cya" style="text-align:right;background:rgba(0,196,224,.04)">${N2(a, 2)}</td><td class="tc num ${!isOK(cg) ? '' : cg >= 0 ? 'pos' : 'neg'}" style="text-align:right;background:rgba(0,217,126,.03)">${isOK(cg) ? N2(cg, 1) + '%' : 'N/A'}</td></tr>`;
  }).join('');
  const rDefs = [
    { k: 'cashToAsset', l: 'Cash / Total Asset %', p: true },
    { k: 'debtToEquity', l: 'Debt / Equity %', p: true },
    { k: 'equityToAsset', l: 'Equity / Asset %', p: true },
    { k: 'gpm', l: 'Gross Profit Margin %', p: true },
    { k: 'npm', l: 'Net Profit Margin %', p: true },
    { k: 'roa', l: 'Return on Asset %', p: true },
    { k: 'roe', l: 'Return on Equity %', p: true },
    { k: 'divPayout', l: 'Dividend Payout %', p: true },
    { k: 'valLow', l: 'Valuation Low (DPS×10)', p: false },
    { k: 'valHigh', l: 'Valuation High (DPS×20)', p: false },
    { k: 'retEps', l: 'Retained EPS (EPS−DPS)', p: false }
  ];
  const ratioRows = rDefs.map((r, i) => {
    const cells = m.Y.map(y => { const v = y[r.k]; return `<td class="tc num${isOK(v) && v < 0 ? ' neg' : ''}" style="text-align:right">${r.p ? P1(v) : N2(v, 2)}</td>`; }).join('');
    const a = avg(m.Y.map(y => y[r.k]));
    return `<tr class="${i % 2 ? 'ev' : ''}"><td class="lbl">${r.l}</td>${cells}<td class="tc num cya" style="text-align:right;background:rgba(0,196,224,.04);font-weight:600">${r.p ? P1(a) : N2(a, 2)}</td></tr>`;
  }).join('');
  const cards = [
    { l: 'Revenue CAGR', v: P1(m.cg.rev), c: 'var(--accent-green)' },
    { l: 'Net Profit CAGR', v: P1(m.cg.np), c: 'var(--accent-green)' },
    { l: 'EPS CAGR', v: P1(m.cg.eps), c: 'var(--accent-green)' },
    { l: `EPS Increase (${LATEST_YEAR - YEARS[0]}yr)`, v: N2(m.epsInc, 2), c: 'var(--accent-cyan)' },
    { l: 'Total Retained EPS', v: N2(m.totRet, 2), c: 'var(--accent-cyan)' },
    { l: 'Buffett $1 Test', v: P1(m.buff), c: m.buff >= 100 ? 'var(--accent-gold)' : m.buff >= 50 ? 'var(--accent-green)' : 'var(--accent-red)' },
    { l: 'Avg ROE', v: P1(m.av.roe), c: 'var(--accent-purple)' },
    { l: 'Avg NP Margin', v: P1(m.av.npm), c: 'var(--accent-blue)' }
  ].map(c => `<div class="card"><div class="card-l">${c.l}</div><div class="card-v" style="color:${c.c}">${c.v}</div></div>`).join('');
  return `
    ${srcBar(sym, st)}
    <div class="sec">
      <div class="sec-t">📋 Raw Financial Data (${st.currency})</div>
      <div class="tw">

function formatCurrencyUnit(cur) {
  const map = {'B USD': 'US$ Billions', 'B AUD': 'A$ Billions', 'T IDR': 'Rp Trillions'};

}
function extractTagline(profileMd) {
  if (!profileMd) return '';
  const lines = profileMd.split('\n').map(l => l.trim()).filter(Boolean);
  for (const line of lines) {
    if (line.startsWith('#') || line.startsWith('-') || line.startsWith('*') || line.startsWith('>') || line.startsWith('|')) continue;
    if (line.length < 40) continue;
    return line.length > 200 ? line.substring(0, 200) + '…' : line;
  }
  return '';
}

function curSymFor(cur) { const map = {'B USD': '$', 'B AUD': 'A$', 'T IDR': 'Rp '}; return map[cur] || '$'; }

function calcRanks(wts){
  const ks=Object.keys(S.stocks).filter(k=>S.status[k]==='ok');
  const N=ks.length;
  if(!N)return{ranks:{},scores:{},fr:{}};
  const allM=Object.fromEntries(ks.map(k=>[k,calcM(k)]));
  const ranks=Object.fromEntries(ks.map(k=>[k,{}]));
  CRITERIA.forEach(c=>{
    const isBankCrit = (c.key==='debtToEquity');
    const vs=ks.map(k=>{
      let val = allM[k]?.rm[c.key];
      if (isBankCrit && isBank(k)) {
          val = allM[k]?.rm['equityToAsset'];
      }
      return {k,v:val};
    });
    vs.sort((a,b)=>{
      if(!isOK(a.v)&&!isOK(b.v))return 0;
      if(!isOK(a.v))return 1;
      if(!isOK(b.v))return-1;
      // For equity/asset (banks), higher is better. For D/E, lower is better.
      if (isBankCrit) {
          // Bank equity/asset - higher is better
          return b.v - a.v;
      }
      return c.hi?b.v-a.v:a.v-b.v;
    });
    vs.forEach((x,i)=>{ranks[x.k][c.key]=i+1;});
  });
  const scores=Object.fromEntries(ks.map(k=>{
    const ws=CRITERIA.reduce((s,c)=>s+(ranks[k][c.key]||N)*(wts[c.wKey]||0)/100,0);
    return[k,{ranks:ranks[k],ws,m:allM[k]}];
  }));
  const sorted=[...ks].sort((a,b)=>scores[a].ws-scores[b].ws);
  const fr=Object.fromEntries(sorted.map((k,i)=>[k,i+1]));
  return{ranks,scores,fr};
}

function heatStyle(pct) {
  if (pct >= 75) { const a = 0.45 + (pct - 75) / 25 * 0.4; return `background:rgba(0, 220, 130, ${a});color:#031a10;`; }
  if (pct >= 50) { const a = 0.14 + (pct - 50) / 25 * 0.24; return `background:rgba(0, 220, 130, ${a});color:var(--text-primary);`; }
  if (pct >= 25) { const a = 0.03 + (pct - 25) / 25 * 0.05; return `background:rgba(255, 255, 255, ${a});color:var(--text-muted);`; }
  const a = 0.08 + (25 - pct) / 25 * 0.24; return `background:rgba(255, 90, 122, ${a});color:var(--text-secondary);`;
}

function renderSelTabContent(){
  if (S.selTab === 'insights') S.selTab = 'factor';
  const selSym = S.sel;
  const {ranks, scores, fr} = calcRanks(S.wts);
  const rankedKs = Object.keys(fr).sort((a,b)=>fr[a]-fr[b]);
  const maxRank = rankedKs.length;
  if (S.selTab === 'factor') {
    const factorBreakdown = CRITERIA.map(c => {

      if (rank === undefined) return { label: c.label, rank: '—', pct: 0, color: 'var(--text-muted)' };

      let color;

      const displayLabel = (c.key === 'debtToEquity' && isBank(selSym)) ? 'Equity/Asset (Bank)' : c.label;
      return { label: displayLabel, rank, pct, color };

    const factorHtml = factorBreakdown.map(f => `<div class="factor-row"><div class="factor-label">${f.label}</div><div class="factor-bar-bg"><div class="factor-bar-fill" style="width:${f.pct}%;background:${f.color}"></div></div><div class="factor-value" style="color:${f.color}">${f.rank}</div></div>`).join('');

function tabRankings(){
  const {ranks,scores,fr}=calcRanks(S.wts);const rankedKs=Object.keys(fr).sort((a,b)=>fr[a]-fr[b]);
  if(!rankedKs.length) return `<div class="state-box"><p>No ranked stocks available.</p></div>`;
  const maxRank = rankedKs.length;
  const top5 = rankedKs.slice(0, 5);
  const buildPodiumCard = (rank) => {
    const k = top5[rank - 1]; if (!k) return '';
    const st = S.stocks[k]; const score = scores[k].ws.toFixed(2);
    const logoSizes = {1: 52, 2: 44, 3: 44, 4: 40, 5: 40}; const logoSize = logoSizes[rank] || 40;
    return `<div class="podium-card rank-${rank}" onclick="selStock('${k}');render();"><div class="podium-rank">${rank}</div><div class="podium-logo-wrap">${getLogoHtml(k, logoSize)}</div><div class="podium-ticker">${k}</div><div class="podium-name">${st.name}</div><div class="podium-score">${score}</div></div>`;
  };
  const rowTop = [2, 1, 3].filter(r => r <= top5.length).map(buildPodiumCard).join('');
  const rowBottom = [4, 5].filter(r => r <= top5.length).map(buildPodiumCard).join('');
  const podiumHtml = `<div class="podium-row">${rowTop}</div>${rowBottom ? `<div class="podium-row">${rowBottom}</div>` : ''}`;
  const selSym = S.sel; const selSt = S.stocks[selSym]; const selRank = fr[selSym] || 'N/A'; const selScore = scores[selSym]?.ws.toFixed(2) || 'N/A';
  const tabsHtml = `<div class="tabs"><button class="tab ${S.selTab==='factor'?'active':''}" onclick="setSelTab('factor')">Factor Breakdown</button><button class="tab ${S.selTab==='radar'?'active':''}" onclick="setSelTab('radar')">Radar Chart</button></div><div id="selTabContent">${renderSelTabContent()}</div>`;
  const selectedPanelHtml = `<div class="panel"><div class="panel-header">Selected Stock</div><div class="selected-header">${getLogoHtml(selSym, 42)}<div class="selected-info"><div class="selected-ticker">${selSym}</div><div class="selected-name">${selSt.name}</div></div><div class="selected-score-box"><div class="selected-score">${selScore}</div><div class="selected-rank">Overall Rank #${selRank}</div></div></div>${tabsHtml}</div>`;
  let filteredKs = rankedKs;
  if (S.heatmapFilter.exchange === 'TOP10') filteredKs = rankedKs.slice(0, 10);
  else if (S.heatmapFilter.exchange === 'ASX') filteredKs = rankedKs.filter(k => S.stocks[k].exchange === 'ASX');
  else if (S.heatmapFilter.exchange === 'US') filteredKs = rankedKs.filter(k => ['NYSE', 'NASDAQ'].includes(S.stocks[k].exchange));
  else if (S.heatmapFilter.exchange === 'IDX') filteredKs = rankedKs.filter(k => S.stocks[k].exchange === 'IDX');
  else if (S.heatmapFilter.exchange === 'BANKS') filteredKs = rankedKs.filter(k => isBank(k));
  if (S.heatmapFilter.search) { const q = S.heatmapFilter.search.toLowerCase(); filteredKs = filteredKs.filter(k => k.toLowerCase().includes(q) || (S.stocks[k].name && S.stocks[k].name.toLowerCase().includes(q))); }
  const heatmapRows = filteredKs.map(k => {
    const r = fr[k]; const st = S.stocks[k];
    const cells = CRITERIA.map(c => { 
      const rank = ranks[k][c.key] || '?'; 
      const pct = Math.max(0, 100 - ((rank - 1) / maxRank) * 100); 
      const style = heatStyle(pct); 
      return `<td style="${style}" onclick="selStock('${k}');render();">${rank}</td>`; 
    }).join('');
    return `<tr><td class="rank-cell" onclick="selStock('${k}');render();"><span class="rc ${r<=5?'rc'+r:''}">${r}</span></td><td class="stock-cell" onclick="selStock('${k}');render();">${k}</td><td class="company-cell" onclick="selStock('${k}');render();">${st.name}</td>${cells}<td style="font-weight:700;color:var(--accent-cyan);text-align:right;padding-right:12px;background:rgba(0,228,255,0.04);">${scores[k].ws.toFixed(2)}</td></tr>`;
  }).join('');
  
  const heatmapHeaders = CRITERIA.map(c => {
    const label = c.key === 'debtToEquity' ? 'D/E (E/A for Banks)' : c.label;
    return `<th>${label}<span class="weight">${S.wts[c.wKey]||0}%</span></th>`;
  }).join('');

  const heatmapHtml = `<div class="heatmap-section panel"><div class="heatmap-header"><div><div class="panel-header">Full Ranking Heatmap</div><div class="panel-sub">Lower rank number = better (1 = best) · Showing ${filteredKs.length} of ${rankedKs.length} stocks</div></div><div class="heatmap-controls"><input type="text" placeholder="Search stock..." value="${S.heatmapFilter.search}" oninput="setHeatmapFilter('search', this.value)" /><select onchange="setHeatmapFilter('exchange', this.value)"><option value="ALL" ${S.heatmapFilter.exchange === 'ALL' ? 'selected' : ''}>All Shares</option><option value="TOP10" ${S.heatmapFilter.exchange === 'TOP10' ? 'selected' : ''}>Top 10</option><option value="ASX" ${S.heatmapFilter.exchange === 'ASX' ? 'selected' : ''}>ASX</option><option value="US" ${S.heatmapFilter.exchange === 'US' ? 'selected' : ''}>US (NYSE + NASDAQ)</option><option value="IDX" ${S.heatmapFilter.exchange === 'IDX' ? 'selected' : ''}>IDX (Indonesia)</option><option value="BANKS" ${S.heatmapFilter.exchange === 'BANKS' ? 'selected' : ''}>Banks</option></select></div><div class="heatmap-legend"><span><span class="legend-dot" style="background:rgba(0,220,130,0.85);"></span> Top</span><span><span class="legend-dot" style="background:rgba(0,220,130,0.3);"></span> Good</span><span><span class="legend-dot" style="background:rgba(255,255,255,0.06);"></span> Neutral</span><span><span class="legend-dot" style="background:rgba(255,90,122,0.3);"></span> Weak</span></div></div><div class="heatmap-table-wrap"><table class="heatmap-table"><thead><tr><th style="text-align:center;width:36px;">Rank</th><th style="text-align:left;">Stock</th><th style="text-align:left;">Company</th>${heatmapHeaders}<th style="text-align:right;padding-right:12px;">Score</th></tr></thead><tbody>${heatmapRows}</tbody></table></div></div>`;
  
  const catLeaders = [
    { label: 'Best Balance Sheet', icon: '⚖️', key: 'cashToAsset', desc: 'Highest Cash / Total Asset ratio', fmt: 'pct' },
    { label: 'Best Growth', icon: '📈', key: 'revenueCagr', desc: 'Fastest Revenue CAGR over the period', fmt: 'pct' },
    { label: 'Best Profitability', icon: '💰', key: 'npmAvg', desc: 'Highest average Net Profit Margin', fmt: 'pct' },
    { label: 'Best Earnings', icon: '📊', key: 'epsCagr', desc: 'Fastest EPS CAGR over the period', fmt: 'pct' },
    { label: 'Best Dividends', icon: '💵', key: 'dpsCagr', desc: 'Fastest DPS CAGR among dividend payers', fmt: 'pct' },
    { label: 'Best ROE', icon: '🚀', key: 'roeAvg', desc: 'Highest average Return on Equity', fmt: 'pct' },
    { label: 'Lowest Payout', icon: '🛡️', key: 'dividendPayout', desc: 'Most conservative payout ratio (dividend payers)', fmt: 'pct', reverse: true, onlyPositive: true },
    { label: 'Buffett $1 Test', icon: '🧠', key: 'buffettTest', desc: 'Best value creation from retained earnings', fmt: 'pct' },
    { label: 'Most Well-Rounded', icon: '⭐', key: 'overall', desc: 'Best overall weighted multi-criteria score', fmt: 'score' }
  ];
  const catHtml = catLeaders.map(cat => {
    let bestSym = ''; let bestVal = cat.reverse ? Infinity : -Infinity;
    if (cat.key === 'overall') { bestSym = rankedKs[0]; bestVal = scores[bestSym].ws; }
    else { rankedKs.forEach(k => { const m = calcM(k); let val = m.rm[cat.key]; if (cat.onlyPositive && (!isOK(val) || val <= 0)) return; if (isOK(val)) { if (cat.reverse ? val < bestVal : val > bestVal) { bestVal = val; bestSym = k; } } }); }
    if (!bestSym) return '';
    const rankInCat = cat.key === 'overall' ? 1 : (ranks[bestSym]?.[cat.key] || '-');
    const valStr = cat.fmt === 'score' ? bestVal.toFixed(2) : P1(bestVal);
    return `<div class="cat-card" onclick="selStock('${bestSym}');render();"><div class="cat-head"><div class="cat-icon">${cat.icon}</div><div class="cat-label">${cat.label}</div></div><div class="cat-body">${getLogoHtml(bestSym, 26)}<div style="min-width:0;"><div class="cat-ticker">${bestSym} <span class="cat-badge">#${rankInCat}</span></div><div class="cat-value">${valStr}</div></div></div><div class="cat-desc">${cat.desc}</div></div>`;
  }).join('');
  const catLeadersHtml = `<div class="cat-leaders-section panel"><div class="panel-header">Category Leaders</div><div class="panel-sub">Best performing stock in each criteria — badge shows rank in that specific criterion</div><div class="cat-cards">${catHtml}</div></div>`;
  const wtToggleBar = `<div class="wt-toggle-bar"><div><div class="panel-header" style="font-size:14px;">🏆 Multi-Criteria Rankings</div><div class="panel-sub" style="margin-bottom:0;">Weighted scoring across ${CRITERIA.length} fundamental criteria</div></div><button class="wt-toggle-btn" onclick="toggleWeights()">${S.wtOpen?'✕ Close Weights':'⚙️ Adjust Scoring Weights'}</button></div>${renderWeightsPanel()}`;
  return `${wtToggleBar}<div class="rankings-top-grid"><div class="panel"><div class="panel-header">Top 5 Overall</div><div class="panel-sub">Based on ${CRITERIA.length} criteria with weighted scoring</div><div class="podium-cards">${podiumHtml}</div><div class="podium-quote">"Great companies win on multiple dimensions."<br><span style="font-size:9px;">LONG-TERM THINKING. REAL RESULTS.</span></div></div><div class="panel scatter-panel"><div class="panel-header">Profitability vs Growth</div><div class="panel-sub">X = EPS CAGR (Growth) &nbsp;|&nbsp; Y = Net Profit Margin (Profitability) &nbsp;|&nbsp; Bubble size = Total Assets</div><div class="scatter-container"><div class="scatter-legend"><span><span class="legend-dot" style="background:#ffcf4a;"></span> Top 3</span><span><span class="legend-dot" style="background:#00d98e;"></span> Top 10</span><span><span class="legend-dot" style="background:#00e4ff;"></span> Top 20</span><span><span class="legend-dot" style="background:#5a9eff;"></span> Others</span></div><canvas id="scatterChart"></canvas></div></div><div>${selectedPanelHtml}</div></div>${catLeadersHtml}${heatmapHtml}`;
}

g:8px 10px;font-size:13px;color:var(--text-primary);margin-top:4px" oninput="AF.cur=this.value;updateConfigPreview()"/></div></div><div><label style="font-size:11px;color:var(--text-muted)">Yahoo Ticker</label><input id="aTicker" style="width:100%;background:#0c121c;border:1px solid var(--border-light);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--text-primary);margin-top:4px" placeholder="e.g. CBA.AX" oninput="AF.ticker=this.value;updateConfigPreview()"/></div></div><div style="background:var(--bg-deep);border:1px solid var(--border-light);border-radius:16px;padding:12px;margin-bottom:12px"><div style="font-size:10px;color:var(--accent-cyan);font-weight:700;text-transform:uppercase;margin-bottom:8px">📋 Copy to stocks_config.json</div><pre id="cfgPreview" style="font-size:11px;color:var(--text-muted);white-space:pre;overflow-x:auto;margin:0"></pre><button class="btn btn-ghost btn-xs" style="margin-top:8px" onclick="copyCfgEntry()">📋 Copy</button><span id="cfgCopyMsg" style="font-size:10px;color:var(--accent-green);display:none;margin-left:8px">✓</span></div><div id="aErr" style="color:var(--accent-red);font-size:12px;display:none;margin-bottom:10px"></div><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><a href="https://github.com/rauladi/fa-dashboard/blob/main/stocks_config.json" target="_blank" class="btn btn-ghost btn-sm" style="text-decoration:none">📂 Open on GitHub</a><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="hideAdd()">Cancel</button><button class="btn btn-ghost btn-sm" onclick="submitManualShell()">✏ Enter Manually</button><button class="btn btn-cyan" onclick="submitAddStock()">＋ Add</button></div></div>`;updateTickerDefault();updateConfigPreview();}

function renderStockDropdown() {
  const sym = S.sel;
  const st = S.stocks[sym];
  if (!st) return;
  const status = S.status[sym];
  const dotClass = status === 'ok' ? 'ok' : status === 'error' ? 'err' : 'idle';
  const dotEl = document.getElementById('stockDot');
  const symEl = document.getElementById('stockSym');
  const exchEl = document.getElementById('stockExch');
  if (dotEl) dotEl.className = 'dot ' + dotClass;
  if (symEl) symEl.textContent = sym;
  if (exchEl) exchEl.textContent = (st.exchange || '').toUpperCase();
  const menu = document.getElementById('stockMenu');
  if (!menu) return;
  const ks = Object.keys(S.stocks);
  menu.innerHTML = ks.map(k => {
    const s = S.stocks[k];
    const st2 = S.status[k];
    const dotCls = st2 === 'ok' ? 'ok' : st2 === 'error' ? 'err' : 'idle';
    const isOn = k === sym ? ' on' : '';
    return `<button class="dropdown-item${isOn}" onclick="pickStock('${k}')">
      <span class="stock-dot ${dotCls}"></span>
      <span class="stock-sym">${k}</span>
      <span class="stock-name">${s.name}</span>
      <span class="stock-exch">${(s.exchange||'').toUpperCase()}</span>
    </button>`;
  }).join('');
}

function pickStock(k) {
  selStock(k);
  closeStockDropdown();
}

const quadrantPlugin = {
  id: 'quadrantPlugin',
  beforeDatasetsDraw(chart, args, options) {
    const chartArea = chart.chartArea; if (!chartArea) return;
    const xScale = chart.scales.x; const yScale = chart.scales.y; if (!xScale || !yScale) return;
    const xThreshold = options?.xThreshold; const yThreshold = options?.yThreshold;
    if (xThreshold === undefined || yThreshold === undefined) return;
    const ctx = chart.ctx;
    const xPix = xScale.getPixelForValue(xThreshold); const yPix = yScale.getPixelForValue(yThreshold);
    if (xPix < chartArea.left || xPix > chartArea.right) return;
    if (yPix < chartArea.top || yPix > chartArea.bottom) return;
    ctx.save();
    ctx.fillStyle = 'rgba(0, 245, 160, 0.045)'; ctx.fillRect(xPix, chartArea.top, chartArea.right - xPix, yPix - chartArea.top);
    ctx.fillStyle = 'rgba(255, 207, 74, 0.045)'; ctx.fillRect(chartArea.left, chartArea.top, xPix - chartArea.left, yPix - chartArea.top);
    ctx.fillStyle = 'rgba(90, 158, 255, 0.045)'; ctx.fillRect(xPix, yPix, chartArea.right - xPix, chartArea.bottom - yPix);
    ctx.fillStyle = 'rgba(255, 90, 122, 0.045)'; ctx.fillRect(chartArea.left, yPix, xPix - chartArea.left, chartArea.bottom - yPix);
    ctx.strokeStyle = 'rgba(0, 228, 255, 0.55)'; ctx.setLineDash([6, 5]); ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(xPix, chartArea.top); ctx.lineTo(xPix, chartArea.bottom); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(chartArea.left, yPix); ctx.lineTo(chartArea.right, yPix); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '700 9px "Space Grotesk", sans-serif'; ctx.textBaseline = 'middle';
    const drawLabel = (text, align, x, y, color) => {
      const padding = 5; const metrics = ctx.measureText(text); const textW = metrics.width; const textH = 11;
      let boxX = x; if (align === 'right') boxX = x - textW - padding * 2; else if (align === 'center') boxX = x - (textW + padding * 2) / 2;
      const boxY = y - textH / 2 - padding / 2;
      ctx.fillStyle = 'rgba(8, 16, 24, 0.75)'; ctx.beginPath();
      const r = 3; const bw = textW + padding * 2; const bh = textH + padding;
      ctx.moveTo(boxX + r, boxY); ctx.lineTo(boxX + bw - r, boxY);
      ctx.quadraticCurveTo(boxX + bw, boxY, boxX + bw, boxY + r);
      ctx.lineTo(boxX + bw, boxY + bh - r);
      ctx.quadraticCurveTo(boxX + bw, boxY + bh, boxX + bw - r, boxY + bh);
      ctx.lineTo(boxX + r, boxY + bh);
      ctx.quadraticCurveTo(boxX, boxY + bh, boxX, boxY + bh - r);
      ctx.lineTo(boxX, boxY + r);
      ctx.quadraticCurveTo(boxX, boxY, boxX + r, boxY);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.fillText(text, boxX + padding, y);
    };
    const pad = 8;
    drawLabel('LOW GROWTH · HIGH PROFIT', 'left', chartArea.left + pad, chartArea.top + 14, '#ffcf4a');
    drawLabel('HIGH GROWTH · HIGH PROFIT', 'right', chartArea.right - pad, chartArea.top + 14, '#00f5a0');
    drawLabel('LOW GROWTH · LOW PROFIT', 'left', chartArea.left + pad, chartArea.bottom - 14, '#ff5a7a');
    drawLabel('HIGH GROWTH · LOW PROFIT', 'right', chartArea.right - pad, chartArea.bottom - 14, '#5a9eff');
    ctx.restore();
  }
};

function renderMain(){

    cont.innerHTML=tabRankings();

      const scatterEl = document.getElementById('scatterChart');
      if (scatterEl) {
        const {fr} = calcRanks(S.wts); const rankedKs = Object.keys(fr).sort((a,b)=>fr[a]-fr[b]);
        const scatterData = rankedKs.map(k => {
          const m = calcM(k); const epsX = m.cg.eps; const revX = m.cg.rev;
          const growthX = isOK(epsX) ? epsX : (isOK(revX) ? revX : 0);
          const profitY = isOK(m.rm.npmAvg) ? m.rm.npmAvg : 0;
          const taLatest = m.raw.ta[N_YEARS-2] || m.raw.ta[N_YEARS-1] || 1;
          const sizeVal = Math.max(8, Math.min(26, 8 + Math.log10(Math.abs(taLatest) + 1) * 4.2));
          return { x: growthX, y: profitY, r: sizeVal, label: k, rank: fr[k], isFallback: !isOK(epsX) };
        });
        const growthValues = scatterData.map(d => d.x).sort((a,b) => a - b);
        const profitValues = scatterData.map(d => d.y).sort((a,b) => a - b);

        const medianProfit = profitValues.length ? profitValues[Math.floor(profitValues.length / 2)] : 0;

            plugins: { legend: { display: false }, quadrantPlugin: { xThreshold: medianGrowth, yThreshold: medianProfit }, tooltip: { backgroundColor: 'rgba(8,16,24,0.96)', borderColor: 'rgba(0,228,255,0.4)', borderWidth: 1, titleFont: { family: "'Space Grotesk'", size: 12, weight: '700' }, bodyFont: { family: "'Space Grotesk'", size: 11 }, padding: 12, displayColors: false,
              callbacks: { title: (items) => items[0]?.raw?.label || '', label: (ctx) => { const d = ctx.raw; const growthSide = d.x >= medianGrowth ? 'High' : 'Low'; const profitSide = d.y >= medianProfit ? 'High' : 'Low'; return [`Rank #${d.rank}`, `Growth (EPS CAGR): ${d.isFallback ? 'n/a — using Rev CAGR ' : ''}${d.x.toFixed(2)}%`, `Profitability (NP Margin): ${d.y.toFixed(2)}%`, `Quadrant: ${growthSide} Growth · ${profitSide} Profit`]; } } } },
            scales: { x: { title: { display: true, text: 'Growth — EPS CAGR % (Rev CAGR fallback)', color: '#8aa4c4', font: { family: "'Space Grotesk'", size: 11, weight: '600' }, padding: { top: 6 } }, ticks: { color: '#8aa4c4', font: { family: "'Space Grotesk'", size: 11 }, callback: v => v + '%' }, grid: { color: 'rgba(72,110,144,0.15)' } },

            onClick: (e, elements) => { if (elements.length > 0) { const idx = elements[0].index; selStock(scatterData[idx].label); } } },
          plugins: [quadrantPlugin, labelPlugin]

      }

async function boot(){
  loadLS();
  let liveData=null,fetchError=null;
  if(location.protocol!=='file:'){
    try{const res=await fetch('./data.json?_='+Date.now(),{cache:'reload'});if(res.ok){liveData=await res.json();const ts=liveData.generated,st=localStorage.getItem(DATA_VERSION_KEY);if(ts&&ts!==st){S.data={};S.status={};localStorage.setItem(DATA_VERSION_KEY,ts);saveLS();}}else{fetchError=`HTTP ${res.status}`;}}catch(e){fetchError=e.message;}
  }
  initPreloadedData();
  if(liveData&&liveData.stocks){
    ANNUALISATION=liveData.annualisation||{};
    const ts=Date.now();
    Object.entries(liveData.stocks).forEach(([sym,sd])=>{const hasData=Array.isArray(sd.revenue)&&sd.revenue.some(v=>v!==null);S.stocks[sym]={name:sd.name||sym,exchange:sd.exchange||'NYSE',currency:sd.currency||'B USD'};const existing=S.data[sym];if(!existing||existing.source!=='user-edited'){const base=existing?{...existing}:{};const fields=['totalAsset','cash','totalDebt','totalEquity','revenue','grossProfit','netProfit','eps','dps'];fields.forEach(f=>{const liveArr=sd[f]||[];const baseArr=base[f]||Array(N_YEARS).fill(null);base[f]=baseArr.map((v,idx)=>(idx<liveArr.length&&liveArr[idx]!==null&&liveArr[idx]!==undefined)?liveArr[idx]:v);});S.data[sym]={...base,fetchedAt:ts,source:sd.source==='yfinance'?'yfinance':'built-in',ticker:sd.ticker,generated:liveData.generated,profile:sd.profile,profileDate:sd.profileDate};S.status[sym]=hasData?'ok':'idle';}});
    const genDate=new Date(liveData.generated).toLocaleDateString();const n=Object.keys(liveData.stocks).length;const hSub=document.getElementById('hSub');if(hSub)hSub.textContent=`ASX · IDX · NYSE/NASDAQ — Auto-refreshed ${genDate} · ${n} stocks · ${YEARS[0]}–${YEARS[N_YEARS-1]} · 📡 Live`;
    if(!S.stocks[S.sel])S.sel=Object.keys(S.stocks)[0]||'BHP';
  }else{
    const hSub=document.getElementById('hSub');let msg=`Built-in data · ${YEARS[0]}–${YEARS[N_YEARS-1]} · 📋`;if(fetchError)msg+=` (data.json: ${fetchError})`;if(hSub)hSub.textContent=msg;
    if(!S.stocks[S.sel])S.sel='BHP';
  }
  Object.keys(S.stocks).forEach(k=>{if(!S.status[k])S.status[k]=S.data[k]?'ok':'idle';});
  render();
}

function renderTornadoChart(variables){
  if(!variables||!variables.length)return "";
  const sorted=[...variables].sort((a,b)=>Math.abs(b.high-b.low)-Math.abs(a.high-a.low));
  const maxAbs=Math.max(...sorted.flatMap(v=>[Math.abs(v.low||0),Math.abs(v.high||0)]),1);
  const labelW=160,barH=28,gap=8,axisH=30,chartW=380,mid=chartW/2;
  const scale=v=>(Math.abs(v)/maxAbs)*(mid*0.90);
  const fmt=v=>v!=null?(v>=0?"+":"")+Number(v).toFixed(1)+"%":"?";
  const bars=sorted.map((v,i)=>{const y=i*(barH+gap);const nw=scale(v.low||0);const pw=scale(v.high||0);return `<g transform="translate(0,${y})"><rect x="${mid-nw}" y="0" width="${nw}" height="${barH}" fill="#ff5a7a" rx="3" opacity="0.85"/><rect x="${mid}" y="0" width="${pw}" height="${barH}" fill="#5a9eff" rx="3" opacity="0.85"/><text x="${mid-nw-4}" y="${barH/2+4}" fill="#ff5a7a" font-size="9" text-anchor="end">${fmt(v.low)}</text><text x="${mid+pw+4}" y="${barH/2+4}" fill="#5a9eff" font-size="9" text-anchor="start">${fmt(v.high)}</text><text x="-4" y="${barH/2+4}" fill="#b8d0ea" font-size="10" text-anchor="end" font-weight="500">${v.name||""}</text></g>`;}).join("");
  const h=sorted.length*(barH+gap)+axisH;
  const ticks=[-75,-50,-25,0,25,50,75].filter(t=>Math.abs(t)<=maxAbs*1.05);
  const axis=ticks.map(t=>{const x=mid+(t/maxAbs)*(mid*0.90);return `<line x1="${x}" y1="0" x2="${x}" y2="${h-axisH}" stroke="rgba(72,110,144,0.5)" stroke-width="1"/><text x="${x}" y="${h-axisH+13}" fill="#6c8db0" font-size="8" text-anchor="middle">${t>0?"+":""}${t}%</text>`;}).join("");

  if(m.av.npm>20)takeaways.push(`💰 Excellent net profitability (${P1(m.av.npm)}).`);

  else takeaways.push(`📉 Low net margin (${P1(m.av.npm)}).`);
  if(m.av.roe>20)takeaways.push(`🚀 Outstanding ROE (${P1(m.av.roe)}).`);
  else if(m.av.roe>12)takeaways.push(`📈 Good ROE (${P1(m.av.roe)}).`);
  else takeaways.push(`🐢 Mediocre ROE (${P1(m.av.roe)}).`);
  if(m.buff>100)takeaways.push(`🧠 Passes Buffett $1 test – retained earnings create value.`);
  else if(m.buff>0)takeaways.push(`📊 Buffett test score ${P1(m.buff)}.`);
  else if(m.buff!==null)takeaways.push(`⚠️ Buffett test ${P1(m.buff)} – destroys value.`);

  else if(m.cg.rev<0)takeaways.push(`📉 Revenue declining (${P1(m.cg.rev)} CAGR).`);
  
  if (bank) {
    if (m.av.equityToAsset >= 8 && m.av.equityToAsset <= 12) {
      takeaways.push(`✅ Healthy capital buffer (Equity/Asset: ${P1(m.av.equityToAsset)}) – aligned with global banking norms.`);
    } else if (m.av.equityToAsset > 12) {
      takeaways.push(`🛡️ Very conservative leverage (Equity/Asset: ${P1(m.av.equityToAsset)}) – lower risk, potentially lower ROE.`);

const PROFILE_MAX_AGE_DAYS = 180;

function isProfileFresh(stockData) {
  if (!stockData?.profile || stockData.profile.length < 100) return false;
  if (!stockData.profileDate) return false;
  const ageMs = Date.now() - new Date(stockData.profileDate).getTime();
  const ageDays = ageMs / (1000 * 60 * 60 * 24);
  return ageDays <= PROFILE_MAX_AGE_DAYS;
}
function profileAgeDays(stockData) {
  if (!stockData?.profileDate) return null;
  return Math.floor((Date.now() - new Date(stockData.profileDate).getTime()) / (1000 * 60 * 60 * 24));
}
function extractProfileSections(md) {
  const out = {};
  if (!md) return out;
  const parts = md.split(/(?=^## )/gm);
  for (const part of parts) {
    const match = part.match(/^## (.+)$/m);
    if (match) out[match[1].trim()] = part;
  }
  return out;
}
function renderAISection(mdSection) {
  const body = mdSection.replace(/^## .+\n?/, '').trim();
  return markdownToHtml(body);
}
function wrapSection(icon, title, bodyHtml, source) {
  const badge = source === 'ai'
    ? '<span class="section-source ai">AI</span>'
    : '<span class="section-source live">Live</span>';
  return `<div class="ai-content"><h2><span>${icon} ${title}</span>${badge}</h2>${bodyHtml}</div>`;
}

function buildBMC(m, st, sym) {

  const arch = SECTOR_ARCHETYPE[sector] || 'General';
  const base = ARCH_BMC[arch] || ARCH_BMC.General;
  const gpm = m.av.gpm, npm = m.av.npm, rev = m.cg.rev;
  const cost = base.costs + (isOK(gpm) ? ` Gross margin ${gpm.toFixed(1)}% implies COGS ≈ ${(100 - gpm).toFixed(1)}% of revenue.` : '');
  const revLine = base.revenue + (isOK(rev) ? ` Recent revenue CAGR ${rev.toFixed(1)}%.` : '') + (isOK(npm) ? ` Net margin ${npm.toFixed(1)}%.` : '');
  return {
    'Customer Segments': base.segments,
    'Value Propositions': base.value,
    'Channels': base.channels,
    'Customer Relationships': base.relationships,
    'Revenue Streams': revLine,
    'Key Resources': base.resources,
    'Key Activities': base.activities,
    'Key Partnerships': base.partners,

function buildSWOT(m, st, sym) {
  const S = [], W = [], O = [], T = [];
  const risks = generateCustomTornado(sym, st, m) || [];
  if (isOK(m.av.gpm)) {
    if (m.av.gpm > 40) S.push(`High gross margin (${P1(m.av.gpm)}) signals pricing power.`);
    else if (m.av.gpm < 20) W.push(`Thin gross margin (${P1(m.av.gpm)}) leaves little buffer for cost shocks.`);
  }
  if (isOK(m.av.npm)) {
    if (m.av.npm > 20) S.push(`Excellent net margin (${P1(m.av.npm)}) reflects strong cost discipline.`);
    else if (m.av.npm < 8) W.push(`Low net margin (${P1(m.av.npm)}) makes earnings sensitive to input costs.`);
  }
  if (isOK(m.av.roe)) {
    if (m.av.roe > 20) S.push(`Outstanding ROE (${P1(m.av.roe)}) — high returns on shareholder capital.`);
    else if (m.av.roe < 8) W.push(`Low ROE (${P1(m.av.roe)}) — capital returns below an attractive hurdle.`);
  }
  
  if (isBank(sym)) {
    if (isOK(m.av.equityToAsset)) {
      if (m.av.equityToAsset > 12) S.push(`Strong capital position (Equity/Asset ${P1(m.av.equityToAsset)}) – well above the 8% regulatory minimum.`);
      else if (m.av.equityToAsset < 8) W.push(`Thin capital buffer (Equity/Asset ${P1(m.av.equityToAsset)}) – below the 8% global benchmark, limiting shock absorption.`);
      else S.push(`Healthy capital buffer (Equity/Asset ${P1(m.av.equityToAsset)}) – aligned with global banking norms.`);
    }
  } else {
    if (isOK(m.av.debtToEquity)) {
      if (m.av.debtToEquity < 30) S.push(`Conservative leverage (D/E ${P1(m.av.debtToEquity)}) — strong balance sheet.`);
      else if (m.av.debtToEquity > 100) W.push(`High leverage (D/E ${P1(m.av.debtToEquity)}) — interest-rate and refinancing risk.`);
    }
  }
  
  if (isOK(m.cg.rev)) {
    if (m.cg.rev > 10) S.push(`Strong top-line growth (${P1(m.cg.rev)} CAGR).`);
    else if (m.cg.rev < 0) W.push(`Revenue declining (${P1(m.cg.rev)} CAGR).`);
  }
  if (isOK(m.cg.eps)) {
    if (m.cg.eps > 10) S.push(`Earnings compounding quickly (${P1(m.cg.eps)} EPS CAGR).`);
    else if (m.cg.eps < 0) W.push(`EPS declining (${P1(m.cg.eps)} CAGR).`);
  }
  if (isOK(m.buff)) {
    if (m.buff > 100) S.push(`Buffett $1 Test passes (${P1(m.buff)}) — retained earnings create value.`);
    else if (m.buff < 0) W.push(`Buffett $1 Test fails (${P1(m.buff)}) — retained earnings destroy value.`);
  }
  if (isOK(m.cg.rev) && m.cg.rev > 10) O.push(`Momentum in core markets could compound returns if growth persists.`);
  if (isOK(m.av.divPayout) && m.av.divPayout > 0 && m.av.divPayout < 40) O.push(`Low payout (${P1(m.av.divPayout)}) leaves cash for reinvestment or acquisitions.`);
  if (isOK(m.av.debtToEquity) && m.av.debtToEquity < 40) O.push(`Balance-sheet capacity to fund growth, buybacks or bolt-on M&A.`);
  if (risks.length) risks.slice(0, 4).forEach(r => T.push(`${r.name} (${r.low}% to ${r.high}%) — key sector sensitivity.`));
  if (S.length < 2) S.push('Established operating track record and sector position.');
  if (W.length < 2) W.push('Limited public disclosures to identify further weaknesses.');
  if (O.length < 2) O.push('Sector dynamics and execution could drive future upside.');
  if (T.length < 2) T.push('Macro-economic conditions and competitive dynamics.');
  return { S, W, O, T };
}

function buildPorters(m, st, sym) {
  const sector = CO_INFO[sym]?.sector || 'General';
  const arch = SECTOR_ARCHETYPE[sector] || 'General';
  const base = ARCH_PORTERS[arch] || ARCH_PORTERS.General;
  const gpm = m.av.gpm, npm = m.av.npm, de = m.av.debtToEquity;

  let rivalry = base.rivalry;
  if (isOK(npm) && npm > 20) rivalry = 'Low';
  else if (isOK(npm) && npm < 5) rivalry = 'High';

  let supplier = base.supplier;
  if (isOK(gpm) && gpm < 20) supplier = 'High';
  else if (isOK(gpm) && gpm > 50) supplier = 'Low';

  let buyer = base.buyer;
  if (isOK(gpm) && gpm > 50) buyer = 'Low';
  else if (isOK(gpm) && gpm < 15) buyer = 'High';

  let entrant = base.entrant;
  if (isOK(de) && de > 100) entrant = 'Low';
  else if (isOK(npm) && npm > 25 && isOK(de) && de < 30) entrant = 'High';

  const substitute = base.substitute;

  return {
    'Competitive Rivalry': {
      rating: rivalry,
      why: `Net margin ${isOK(npm) ? npm.toFixed(1) + '%' : 'n/a'} — ${rivalry === 'High' ? 'intense competition likely compressing margins' : rivalry === 'Low' ? 'few direct competitors, healthy margins' : 'balanced competitive dynamics'}.`
    },
    'Supplier Power': {
      rating: supplier,
      why: `Gross margin ${isOK(gpm) ? gpm.toFixed(1) + '%' : 'n/a'} — ${supplier === 'High' ? 'input costs can materially squeeze profitability' : supplier === 'Low' ? 'strong bargaining position over suppliers' : 'moderate dependence on suppliers'}.`
    },
    'Buyer Power': {
      rating: buyer,
      why: `Gross margin ${isOK(gpm) ? gpm.toFixed(1) + '%' : 'n/a'} — ${buyer === 'High' ? 'customers can push back on pricing' : buyer === 'Low' ? 'customers have limited pricing leverage' : 'balanced negotiating dynamics'}.`
    },
    'Threat of New Entrants': {
      rating: entrant,
      why: `Debt/equity ${isOK(de) ? de.toFixed(1) + '%' : 'n/a'} — ${entrant === 'High' ? 'low capital barriers and attractive margins invite entrants' : entrant === 'Low' ? 'high capital, regulatory or brand barriers deter entrants' : 'moderate entry barriers'}.`
    },
    'Threat of Substitutes': {
      rating: substitute,
      why: `Sector-specific — ${substitute === 'High' ? 'close substitutes exist and could pressure pricing' : substitute === 'Low' ? 'few credible substitutes for the core offering' : 'substitute pressure is moderate'}.`
    }
  };
}

/* Pull the first bullet (or first substantive sentence) from an AI markdown section. */
function firstBulletFromMd(mdSection) {
  if (!mdSection) return null;
  const lines = mdSection.split('\n').map(l => l.trim()).filter(Boolean);
  for (const l of lines) {
    if (l.startsWith('##')) continue;
    if (l.startsWith('-') || l.startsWith('*')) {
      return l.replace(/^[-*]\s+/, '').replace(/\*\*/g, '').replace(/^▸\s*/, '');
    }
  }
  for (const l of lines) {
    if (l.startsWith('##')) continue;
    if (l.length > 40) {
      const clean = l.replace(/\*\*/g, '');
      const m = clean.match(/^(.+?[.!?])\s/);
      return m ? m[1] : clean;
    }
  }
  return null;
}

function trimText(s, max = 170) {
  s = String(s).replace(/\s+/g, ' ').trim();
  return s.length > max ? s.slice(0, max - 1).trimEnd() + '…' : s;
}

   is tagged with the section it came from. */
function buildInsightsTakeaways({ bmc, swot, porters, pestle, tornadoVars, profileFresh, profileSections }) {
  const out = [];
  const aiBullet = (title) => (profileFresh && profileSections[title])
    ? firstBulletFromMd(profileSections[title])
    : null;

  // 1. Business Model — core value proposition
  const bmcAi = aiBullet('Business Model Canvas');
  const bmcLine = bmcAi || bmc['Value Propositions'];
  if (bmcLine) out.push(`🧩 Business model: ${trimText(bmcLine)}`);

  // 2. SWOT — top strength & weakness
  const swotAi = aiBullet('SWOT Analysis');
  if (swotAi) {
    out.push(`📊 SWOT: ${trimText(swotAi)}`);
  } else {
    if (swot.S.length) out.push(`💪 Strength: ${trimText(swot.S[0])}`);
    if (swot.W.length) out.push(`⚠️ Weakness: ${trimText(swot.W[0])}`);
  }

  // 3. Porter's — dominant force (headwind or tailwind)
  const portAi = aiBullet("Porter's Five Forces");
  if (portAi) {
    out.push(`⚔️ Porter: ${trimText(portAi)}`);
  } else {
    const highs = Object.entries(porters).filter(([, v]) => v.rating === 'High');
    const lows  = Object.entries(porters).filter(([, v]) => v.rating === 'Low');
    if (highs.length) {
      out.push(`⚔️ Porter — ${highs[0][0]} is HIGH, the main competitive headwind.`);
    } else if (lows.length) {
      out.push(`🛡 Porter — ${lows[0][0]} is LOW, a structural tailwind.`);
    }
  }

  // 4. PESTLE — most material external factor
  const pestAi = aiBullet('PESTLE Analysis');
  if (pestAi) {
    out.push(`🌐 PESTLE: ${trimText(pestAi)}`);
  } else {
    const pick = ['Economic', 'Political', 'Legal', 'Environmental', 'Technological', 'Social']
      .find(k => pestle[k]);
    if (pick) out.push(`🌐 PESTLE — ${pick}: ${trimText(pestle[pick])}`);
  }

  // 5. Sensitivity — largest swing factor (always live)
  if (tornadoVars.length) {
    const top = tornadoVars[0];
    const range = Math.abs(top.high - top.low);
    out.push(`🌪 Sensitivity — ${top.name} is the largest swing factor (${top.low}% to ${top.high}%, ${range.toFixed(0)}pp range).`);
  }

  // 6. SWOT opportunity if room remains
  if (out.length < 6 && swot.O.length && !profileFresh) {
    out.push(`🚀 Opportunity: ${trimText(swot.O[0])}`);
  }

  return out.slice(0, 6);
}

function renderLiveBMC(bmc) {
  const blocks = Object.entries(bmc).map(([k, v]) =>
    `<div class="bmc-block"><div class="bmc-block-title">${k}</div><div class="bmc-block-text">${v}</div></div>`
  ).join('');
  return `<div class="bmc-grid">${blocks}</div>`;
}

function renderLiveSWOT(swot) {
  const q = (title, list, cls) => `<div class="swot-quad ${cls}"><div class="swot-title">${title}</div><ul class="swot-list">${list.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
  return `<div class="swot-grid">
    ${q('Strengths', swot.S, 'swot-S')}
    ${q('Weaknesses', swot.W, 'swot-W')}
    ${q('Opportunities', swot.O, 'swot-O')}
    ${q('Threats', swot.T, 'swot-T')}
  </div>`;
}

function renderLivePESTLE(p) {
  return `<div class="pestle-list">${Object.entries(p).map(([k, v]) =>
    `<div class="pestle-item"><div class="pestle-label">${k}</div><div class="pestle-text">${v}</div></div>`
  ).join('')}</div>`;
}

function renderLivePorters(po) {
  return Object.entries(po).map(([name, obj]) => {
    const rating = obj.rating.toLowerCase();
    return `<div class="porter-item">
      <div class="porter-head"><span class="porter-name">${name}</span><span class="porter-rating ${rating}">${obj.rating}</span></div>
      <div class="porter-why">${obj.why}</div>
    </div>`;
  }).join('');
}

function tabInsights(sym, st) {
  const stockData = S.data[sym];
  const m = calcM(sym);
  if (!m) return `<div class="state-box"><p>No data for ${sym}</p></div>`;

  const profileFresh = isProfileFresh(stockData);
  const profileSections = extractProfileSections(stockData?.profile || '');

  // Always-computed live analyses (used as fallback + as inputs to takeaways)
  const bmcLive = buildBMC(m, st, sym);
  const swotLive = buildSWOT(m, st, sym);
  const pestleLive = buildPESTLE(m, st, sym);
  const portersLive = buildPorters(m, st, sym);
  const tornadoVars = generateCustomTornado(sym, st, m);

  // Key Takeaways — derived only from the sections shown in this tab
  const takeaways = buildInsightsTakeaways({
    bmc: bmcLive,
    swot: swotLive,
    porters: portersLive,
    pestle: pestleLive,
    tornadoVars,
    profileFresh,
    profileSections
  });

  // Section renderer: AI when fresh + section exists, else live
  const section = (title, icon, liveHtml) => {
    if (profileFresh && profileSections[title]) {
      return wrapSection(icon, title, renderAISection(profileSections[title]), 'ai');
    }
    return wrapSection(icon, title, liveHtml, 'live');
  };

  const takeawayCard = takeaways.length
    ? `<div class="summary-card">
        <h2>📌 Key Takeaways</h2>
        <div class="summary-sub">Synthesised from the analyses below — Business Model · SWOT · PESTLE · Porter's Five Forces · Sensitivity</div>
        <ul>${takeaways.map(t => `<li>${t}</li>`).join('')}</ul>
      </div>`
    : '';

  const rank = calcRanks(S.wts).fr[sym] || '—';
  const headerHtml = `
    <div class="insights-header">
      ${getLogoHtml(sym, 48)}
      <div class="header-info">
        <div class="header-name">${st.name}</div>
        <div class="header-meta">${sym} · ${st.exchange} · ${st.currency} · Rank #${rank}</div>
      </div>
      <div class="header-badge">${profileFresh ? 'AI + LIVE' : 'LIVE COMPUTED'}</div>
    </div>
  `;

  const bmcHtml     = section('Business Model Canvas', '🧩', renderLiveBMC(bmcLive));
  const swotHtml    = section('SWOT Analysis', '📊', renderLiveSWOT(swotLive));
  const pestleHtml  = section('PESTLE Analysis', '🌐', renderLivePESTLE(pestleLive));
  const portersHtml = section("Porter's Five Forces", '⚔️', renderLivePorters(portersLive));
  const tornadoHtml = wrapSection('🌪️', 'Sensitivity Analysis',
    tornadoVars.length ? renderTornadoChart(tornadoVars) : '<p style="font-size:11px;color:var(--text-muted);">No sensitivity data available.</p>',
    'live');

  const sourceNote = profileFresh
    ? `<br>AI profile: generated ${new Date(stockData.profileDate).toLocaleDateString()}`
    : '<br>AI profile: not available or stale — showing live-computed analysis';

  return `
    <div>
      ${headerHtml}
      ${takeawayCard}
      <div class="insights-two-col">
        <div>${bmcHtml}${swotHtml}</div>
        <div>${pestleHtml}${portersHtml}${tornadoHtml}</div>
      </div>
      <div style="font-size:10px;color:var(--text-muted);margin-top:12px;">
        📚 Sources: Company filings · Annual Reports · Yahoo Finance${sourceNote}
      </div>
    </div>
  `;
}

let __resizeRaf = null;
function reflowCharts() {
  if (__resizeRaf) cancelAnimationFrame(__resizeRaf);
  __resizeRaf = requestAnimationFrame(() => {
    [chartInst, window.scatterChartInst, window.radarChartInst]
      .forEach(c => { try { if (c && typeof c.resize === 'function') c.resize(); } catch (e) {} });
  });
}
window.addEventListener('resize', reflowCharts);
window.addEventListener('orientationchange', () => setTimeout(reflowCharts, 200));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', reflowCharts);
}
</script>
