<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FA Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0c12;color:#f0f6ff;font-family:system-ui,-apple-system,sans-serif;padding:0;min-height:100vh}
#hdr{background:rgba(8,16,24,.9);border-bottom:1px solid rgba(0,228,255,.3);padding:14px 20px;position:sticky;top:0;z-index:100}
#hdr h1{font-size:16px;background:linear-gradient(135deg,#fff,#00e4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#hdr .sub{font-size:11px;color:#6c8db0;margin-top:3px}
#sBar{background:rgba(8,16,24,.7);border-bottom:1px solid rgba(72,110,144,.4);padding:10px 20px;overflow-x:auto;white-space:nowrap}
.s-btn{display:inline-block;padding:6px 14px;border-radius:40px;border:1px solid rgba(0,228,255,.2);background:rgba(20,32,45,.8);color:#b8d0ea;cursor:pointer;font-size:12px;font-weight:600;margin-right:6px}
.s-btn.on{background:#00e4ff;color:#03050b;border-color:#00e4ff}
.s-btn:hover:not(.on){border-color:#00e4ff;color:#00e4ff}
#tabs{background:rgba(8,16,24,.7);border-bottom:1px solid rgba(72,110,144,.4);padding:0 20px;overflow-x:auto;white-space:nowrap}
.tab{display:inline-block;padding:12px 16px;color:#6c8db0;cursor:pointer;font-size:13px;font-weight:600;border-bottom:2px solid transparent}
.tab.on{color:#00e4ff;border-bottom-color:#00e4ff}
#cont{padding:20px;max-width:1600px;margin:0 auto}
.sec{margin-bottom:24px}
.sec-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#00e4ff;margin-bottom:12px;padding-left:12px;border-left:3px solid #00e4ff}
.tw{overflow-x:auto;border-radius:16px;border:1px solid rgba(0,228,255,.15);background:rgba(8,16,24,.5)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:rgba(0,150,180,.2);padding:10px;text-align:left;font-size:10px;text-transform:uppercase;color:#00e4ff;font-weight:700;white-space:nowrap}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td{padding:9px 10px;border-bottom:1px solid rgba(72,110,144,.2);white-space:nowrap}
td.lbl{font-weight:500;color:#b8d0ea}
tr:hover td{background:rgba(0,228,255,.05)}
.cya{color:#00e4ff}.pos{color:#00f5a0}.neg{color:#ff5a7a}.muted{color:#6c8db0}
.src{padding:12px 16px;margin-bottom:16px;border-radius:16px;background:rgba(8,16,24,.7);border:1px solid rgba(0,228,255,.2);font-size:12px}
.state{background:rgba(20,32,45,.85);border:1px solid rgba(0,228,255,.2);border-radius:24px;padding:40px 24px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{background:rgba(20,32,45,.85);border:1px solid rgba(0,228,255,.15);border-radius:16px;padding:12px}
.card-l{font-size:10px;color:#6c8db0;margin-bottom:6px}
.card-v{font-size:20px;font-weight:800;color:#00e4ff}
#log{background:#001a1f;color:#00e4ff;font-family:monospace;font-size:10px;padding:6px 12px;border-radius:6px;margin:0 20px 12px;max-height:120px;overflow-y:auto;display:none}
#log.on{display:block}
.wt{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;padding:12px;background:rgba(20,32,45,.6);border-radius:12px}
.wt label{font-size:10px;color:#6c8db0}
.wt input{width:100%;background:#0c121c;border:1px solid rgba(72,110,144,.4);border-radius:8px;padding:5px 8px;color:#f0f6ff;font-size:12px;font-weight:700}
.ai{background:rgba(15,25,35,.75);border:1px solid rgba(0,228,255,.15);border-radius:20px;padding:18px;margin-bottom:16px}
.ai h2{font-size:14px;color:#00e4ff;margin-bottom:10px;padding-left:10px;border-left:3px solid #00e4ff}
.ai p,.ai li{font-size:12px;color:#b8d0ea;line-height:1.6;margin-bottom:6px}
.ai ul{list-style:none;padding-left:0}
.ai li{padding-left:14px;position:relative}
.ai li:before{content:"▸";position:absolute;left:0;color:#00e4ff}
.ai strong{color:#f0f6ff}
</style>
</head>
<body>

<div id="hdr">
  <h1>Fundamental Analysis Dashboard</h1>
  <div class="sub" id="hSub">Loading...</div>
</div>
<div id="log"></div>
<div id="sBar"></div>
<div id="tabs">
  <span class="tab on" data-t="data" onclick="setTab('data')">📋 Data</span>
  <span class="tab" data-t="ratios" onclick="setTab('ratios')">📐 Ratios</span>
  <span class="tab" data-t="rankings" onclick="setTab('rankings')">🏆 Rankings</span>
  <span class="tab" data-t="insights" onclick="setTab('insights')">💡 Insights</span>
</div>
<div id="cont"></div>

<script>
// ========== Boot log ==========
var logEl = document.getElementById('log');
if (location.search.indexOf('debug') > -1) logEl.classList.add('on');
function log(m) {
  logEl.innerHTML += '<div>'+m+'</div>';
  logEl.scrollTop = logEl.scrollHeight;
  console.log('[FA] ' + m);
}

// ========== Constants ==========
var CY = new Date().getFullYear();
var LATEST = CY - 1;
var YEARS = [];
for (var i = LATEST - 4; i <= CY; i++) YEARS.push(i);
var N_Y = YEARS.length;

var DATA = {};      // Stock data
var STATUS = {};    // ok / idle
var SEL = null;     // Selected stock
var TAB = 'data';   // Current tab
var ANNUALISATION = {};

var STOCKS = [
  'BHP','WDS','CBA','NAB','ANZ','WBC','BBRI','ADRO','SMSM','UNTR','ITMG','POWR',
  'MPMX','BTPS','DMAS','SPTO','TSM','V','MA','PBR-A','MSFT','AMZN','AAPL','META',
  'NVDA','GOOG','BKNG','AVGO','CVX','AXP','BAC','RHHBY','ALD','MQG','ASML'
];

var MKEYS = [
  {k:'totalAsset', l:'Total Asset'}, {k:'cash', l:'Cash'},
  {k:'totalDebt', l:'Total Debt'}, {k:'totalEquity', l:'Total Equity'},
  {k:'revenue', l:'Total Revenue'}, {k:'grossProfit', l:'Gross Profit'},
  {k:'netProfit', l:'Net Profit'}, {k:'eps', l:'EPS'}, {k:'dps', l:'DPS'}
];

var DEF_WTS = {cashToAsset:10, debtToEquity:5, revenueCagr:5, gpmAvg:0, netProfitCagr:5, npmAvg:30, epsCagr:5, dpsCagr:0, roeAvg:25, dividendPayout:0, buffettTest:15};
var WTS = {};
for (var k in DEF_WTS) WTS[k] = DEF_WTS[k];

// ========== Helpers ==========
function isOK(v) { return v !== null && v !== undefined && isFinite(v) && !isNaN(v); }
function N2(v, d) { return isOK(v) ? Number(v).toFixed(d === undefined ? 2 : d) : '—'; }
function P1(v) { return isOK(v) ? Number(v).toFixed(1) + '%' : '—'; }
function avg(a) { var v = a.filter(isOK); return v.length ? v.reduce(function(s,x){return s+x;}, 0) / v.length : null; }
function cagr(a) {
  var v = a.filter(isOK);
  if (v.length < 2) return null;
  var s = v[0], e = v[v.length-1], n = v.length - 1;
  if (s <= 0 || e <= 0 || n === 0) return null;
  return (Math.pow(e / s, 1 / n) - 1) * 100;
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function md2html(md) {
  if (!md) return '';
  return md.replace(/^## (.+)$/gm, '<h2>$1</h2>')
           .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
           .replace(/^- (.+)$/gm, '<li>$1</li>')
           .replace(/(<li>[\s\S]*?<\/li>)\s*(?!<li>)/g, '<ul>$1</ul>')
           .replace(/\n/g, '<br>');
}

// ========== Calculation ==========
function calcM(sym) {
  var data = DATA[sym];
  if (!data) return null;
  var sl = function(k) { var a = data[k] || []; var r = []; for (var i=0;i<N_Y;i++) r.push(i < a.length ? a[i] : null); return r; };
  var ta = sl('totalAsset'), ca = sl('cash'), td = sl('totalDebt'), te = sl('totalEquity');
  var rv = sl('revenue'), gp = sl('grossProfit'), np = sl('netProfit');
  var ep = sl('eps'), dp = sl('dps');

  var Y = YEARS.map(function(yr, i) {
    return {
      year: yr,
      totalAsset: ta[i], cash: ca[i], totalDebt: td[i], totalEquity: te[i],
      revenue: rv[i], grossProfit: gp[i], netProfit: np[i], eps: ep[i], dps: dp[i],
      cashToAsset: (isOK(ta[i]) && ta[i] > 0 && isOK(ca[i])) ? ca[i]/ta[i]*100 : null,
      debtToEquity: (isOK(te[i]) && te[i] !== 0 && isOK(td[i])) ? td[i]/te[i]*100 : null,
      gpm: (isOK(rv[i]) && rv[i] > 0 && isOK(gp[i])) ? gp[i]/rv[i]*100 : null,
      npm: (isOK(rv[i]) && rv[i] > 0 && isOK(np[i])) ? np[i]/rv[i]*100 : null,
      roa: (isOK(ta[i]) && ta[i] > 0 && isOK(np[i])) ? np[i]/ta[i]*100 : null,
      roe: (isOK(te[i]) && te[i] !== 0 && isOK(np[i])) ? np[i]/te[i]*100 : null,
      divPayout: (isOK(ep[i]) && ep[i] > 0 && isOK(dp[i])) ? dp[i]/ep[i]*100 : null
    };
  });

  var av = {
    cashToAsset: avg(Y.map(function(y){return y.cashToAsset;})),
    debtToEquity: avg(Y.map(function(y){return y.debtToEquity;})),
    gpm: avg(Y.map(function(y){return y.gpm;})),
    npm: avg(Y.map(function(y){return y.npm;})),
    roe: avg(Y.map(function(y){return y.roe;}))
  };
  var cg = { rev: cagr(rv), np: cagr(np), eps: cagr(ep), dps: cagr(dp) };

  // Buffett $1 test: EPS increase over completed years / retained EPS
  var NC = N_Y - 1;
  var epC = [], dpC = [];
  for (var i=0;i<NC;i++) { epC.push(ep[i]); dpC.push(dp[i]); }
  var retEps = [], totRet = 0, has = false;
  for (var i=0;i<epC.length;i++) {
    if (isOK(epC[i])) { var d = isOK(dpC[i]) ? dpC[i] : 0; retEps.push(epC[i] - d); totRet += (epC[i] - d); has = true; }
  }
  var epOK = epC.filter(isOK);
  var epsInc = epOK.length >= 2 ? epOK[epOK.length-1] - epOK[0] : null;
  var buff = (has && Math.abs(totRet) > 0.001 && isOK(epsInc)) ? epsInc / totRet * 100 : null;

  return {
    Y: Y, av: av, cg: cg, buff: buff,
    rm: {
      cashToAsset: av.cashToAsset, debtToEquity: av.debtToEquity,
      revenueCagr: cg.rev, gpmAvg: av.gpm, netProfitCagr: cg.np,
      npmAvg: av.npm, epsCagr: cg.eps, dpsCagr: cg.dps,
      roeAvg: av.roe, dividendPayout: avg(Y.map(function(y){return y.divPayout;})),
      buffettTest: buff
    }
  };
}

// ========== Rendering ==========
function renderSBar() {
  var html = '';
  STOCKS.forEach(function(k) {
    if (!DATA[k]) return;
    var dot = STATUS[k] === 'ok' ? '●' : '○';
    html += '<button class="s-btn'+(k===SEL?' on':'')+'" onclick="selStock(\''+k+'\')">'+dot+' '+k+'</button>';
  });
  document.getElementById('sBar').innerHTML = html;
}

function renderTabs() {
  var tabs = document.querySelectorAll('.tab');
  for (var i=0;i<tabs.length;i++) {
    tabs[i].className = 'tab' + (tabs[i].getAttribute('data-t') === TAB ? ' on' : '');
  }
}

function yearHead() {
  var h = '';
  YEARS.forEach(function(y) {
    var extra = y === CY ? '<br><span style="font-size:8px;color:#ffcf4a">Est.</span>' : '';
    h += '<th class="num">'+y+extra+'</th>';
  });
  return h;
}

function renderData(sym) {
  var m = calcM(sym);
  var d = DATA[sym];
  if (!m) return '<div class="state">No data</div>';
  var rows = MKEYS.map(function(r) {
    var cells = m.Y.map(function(y) {
      var v = y[r.k];
      return '<td class="num'+(isOK(v)&&v<0?' neg':'')+'">'+N2(v)+'</td>';
    }).join('');
    var a = avg(m.Y.map(function(y){return y[r.k];}));
    var c = cagr(m.Y.map(function(y){return y[r.k];}));
    return '<tr><td class="lbl">'+r.l+'</td>'+cells+
           '<td class="num cya">'+N2(a)+'</td>'+
           '<td class="num '+(isOK(c)&&c>=0?'pos':isOK(c)?'neg':'')+'">'+(isOK(c)?N2(c,1)+'%':'—')+'</td></tr>';
  }).join('');
  var src = d && d.source === 'yfinance' ? '✓ Live (yfinance)' : '📋 Built-in';
  return '<div class="src"><strong>'+esc(d.name||sym)+'</strong> · '+esc(d.exchange||'')+' · '+esc(d.currency||'')+' &nbsp;·&nbsp; '+src+'</div>'+
    '<div class="sec"><div class="tw"><table><thead><tr><th>Metric ('+esc(d.currency||'')+')</th>'+yearHead()+'<th class="num">Avg</th><th class="num">CAGR</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderRatios(sym) {
  var m = calcM(sym);
  if (!m) return '<div class="state">No data</div>';
  var d = DATA[sym];
  var defs = [
    {k:'cashToAsset', l:'Cash / Asset %'},
    {k:'debtToEquity', l:'Debt / Equity %'},
    {k:'gpm', l:'GP Margin %'},
    {k:'npm', l:'NP Margin %'},
    {k:'roa', l:'ROA %'},
    {k:'roe', l:'ROE %'},
    {k:'divPayout', l:'Div Payout %'}
  ];
  var rows = defs.map(function(r) {
    var cells = m.Y.map(function(y) {
      var v = y[r.k];
      return '<td class="num'+(isOK(v)&&v<0?' neg':'')+'">'+P1(v)+'</td>';
    }).join('');
    var a = avg(m.Y.map(function(y){return y[r.k];}));
    return '<tr><td class="lbl">'+r.l+'</td>'+cells+'<td class="num cya">'+P1(a)+'</td></tr>';
  }).join('');
  var cards = [
    {l:'Revenue CAGR', v:P1(m.cg.rev)},
    {l:'Net Profit CAGR', v:P1(m.cg.np)},
    {l:'EPS CAGR', v:P1(m.cg.eps)},
    {l:'Avg ROE', v:P1(m.av.roe)},
    {l:'Avg NP Margin', v:P1(m.av.npm)},
    {l:'Buffett $1 Test', v:P1(m.buff)}
  ].map(function(c){ return '<div class="card"><div class="card-l">'+c.l+'</div><div class="card-v">'+c.v+'</div></div>'; }).join('');
  return '<div class="src"><strong>'+esc(d.name||sym)+'</strong></div>'+
    '<div class="sec"><div class="tw"><table><thead><tr><th>Ratio</th>'+yearHead()+'<th class="num">Avg</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="sec"><div class="sec-t">Key Metrics</div><div class="cards">'+cards+'</div></div>';
}

function renderRankings() {
  var CRIT = [
    {key:'cashToAsset', label:'Cash/Asset', hi:true, w:WTS.cashToAsset},
    {key:'debtToEquity', label:'D/E', hi:false, w:WTS.debtToEquity},
    {key:'revenueCagr', label:'Rev CAGR', hi:true, w:WTS.revenueCagr},
    {key:'gpmAvg', label:'GP Margin', hi:true, w:WTS.gpmAvg},
    {key:'netProfitCagr', label:'NP CAGR', hi:true, w:WTS.netProfitCagr},
    {key:'npmAvg', label:'NP Margin', hi:true, w:WTS.npmAvg},
    {key:'epsCagr', label:'EPS CAGR', hi:true, w:WTS.epsCagr},
    {key:'roeAvg', label:'ROE', hi:true, w:WTS.roeAvg},
    {key:'buffettTest', label:'Buffett $1', hi:true, w:WTS.buffettTest}
  ];
  var ks = STOCKS.filter(function(k){ return STATUS[k] === 'ok'; });
  if (!ks.length) return '<div class="state">No stocks loaded</div>';
  var allM = {};
  ks.forEach(function(k){ allM[k] = calcM(k); });
  var ranks = {};
  ks.forEach(function(k){ ranks[k] = {}; });
  CRIT.forEach(function(c) {
    var vs = ks.map(function(k){ return {k:k, v: allM[k].rm[c.key]}; });
    vs.sort(function(a, b) {
      if (!isOK(a.v) && !isOK(b.v)) return 0;
      if (!isOK(a.v)) return 1;
      if (!isOK(b.v)) return -1;
      return c.hi ? b.v - a.v : a.v - b.v;
    });
    vs.forEach(function(x, i){ ranks[x.k][c.key] = i + 1; });
  });
  var scores = ks.map(function(k) {
    var ws = 0;
    CRIT.forEach(function(c) { ws += (ranks[k][c.key] || ks.length) * c.w / 100; });
    return {k:k, s:ws, m: allM[k]};
  });
  scores.sort(function(a, b){ return a.s - b.s; });
  var th = CRIT.map(function(c){ return '<th class="num">'+c.label+'<br>'+c.w+'%</th>'; }).join('');
  var rows = scores.map(function(x, i) {
    var rc = CRIT.map(function(c) { return '<td class="num">'+(ranks[x.k][c.key] || '—')+'</td>'; }).join('');
    return '<tr><td class="num"><strong>'+(i+1)+'</strong></td><td class="lbl">'+esc(x.k)+'</td>'+rc+'<td class="num cya">'+x.s.toFixed(2)+'</td></tr>';
  }).join('');
  return '<div class="sec"><div class="sec-t">Weighted Rankings</div><div class="tw"><table><thead><tr><th>#</th><th>Stock</th>'+th+'<th class="num">Score</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderInsights(sym) {
  var d = DATA[sym];
  if (!d) return '<div class="state">No data</div>';
  var prof = d.profile || '';
  if (!prof || prof.length < 100) {
    return '<div class="state"><h3 style="color:#00e4ff;margin-bottom:10px">'+esc(d.name||sym)+'</h3><p class="muted">Full analysis will appear after GitHub Action runs.</p></div>';
  }
  var sections = prof.split(/(?=^## )/gm);
  var html = '<div class="src"><strong>'+esc(d.name||sym)+'</strong> · '+esc(sym)+'</div>';
  sections.forEach(function(s) {
    if (s.trim()) html += '<div class="ai">'+md2html(s.trim())+'</div>';
  });
  return html;
}

function renderMain() {
  var cont = document.getElementById('cont');
  if (!SEL && STOCKS.length) SEL = STOCKS[0];
  var html = '';
  if (TAB === 'data') html = renderData(SEL);
  else if (TAB === 'ratios') html = renderRatios(SEL);
  else if (TAB === 'rankings') html = renderRankings();
  else if (TAB === 'insights') html = renderInsights(SEL);
  cont.innerHTML = html;
}

function render() {
  renderSBar();
  renderTabs();
  renderMain();
  try { localStorage.setItem('fa_v6', JSON.stringify({sel:SEL, wts:WTS})); } catch(e){}
}

function setTab(t) { TAB = t; render(); }
function selStock(k) { SEL = k; render(); }

// ========== Boot ==========
async function boot() {
  try {
    log('Boot started. Protocol: ' + location.protocol);
    // Load saved state
    try {
      var saved = localStorage.getItem('fa_v6');
      if (saved) { var s = JSON.parse(saved); if (s.sel) SEL = s.sel; if (s.wts) WTS = s.wts; log('Restored state'); }
    } catch(e) { log('localStorage warning: ' + e.message); }

    var loadedFromJson = false;
    // Try to load data.json (produced by GitHub Action)
    if (location.protocol !== 'file:') {
      try {
        log('Fetching data.json...');
        var res = await fetch('./data.json?_=' + Date.now(), {cache: 'no-store'});
        if (res.ok) {
          var json = await res.json();
          log('data.json loaded. Stocks: ' + (json.stocks ? Object.keys(json.stocks).length : 0));
          if (json.stocks) {
            for (var sym in json.stocks) {
              DATA[sym] = json.stocks[sym];
              if (STOCKS.indexOf(sym) === -1) STOCKS.push(sym);
            }
            ANNUALISATION = json.annualisation || {};
            loadedFromJson = true;
          }
        } else {
          log('data.json status: ' + res.status);
        }
      } catch(e) {
        log('data.json fetch failed: ' + e.message);
      }
    }

    // Fallback: try stocks.json (local fallback file)
    if (!loadedFromJson) {
      try {
        log('Trying stocks.json...');
        var res2 = await fetch('./stocks.json', {cache: 'no-store'});
        if (res2.ok) {
          var json2 = await res2.json();
          if (json2.stocks) {
            for (var sym2 in json2.stocks) {
              DATA[sym2] = json2.stocks[sym2];
              if (STOCKS.indexOf(sym2) === -1) STOCKS.push(sym2);
            }
            loadedFromJson = true;
            log('stocks.json loaded');
          }
        }
      } catch(e) { log('stocks.json not found (OK)'); }
    }

    // Absolute fallback: single embedded BHP entry so page never empty
    if (!loadedFromJson) {
      log('Using embedded fallback data');
      DATA['BHP'] = { name:'BHP Group', exchange:'ASX', currency:'B AUD', source:'built-in',
        totalAsset:[54.2,51.9,55.7,81.5,null,null],
        cash:[14.9,12.4,13.9,13.3,null,null],
        totalDebt:[14.5,12.4,14.8,26.7,null,null],
        totalEquity:[26.4,28.0,29.7,32.4,null,null],
        revenue:[60.8,65.1,53.8,55.7,null,null],
        grossProfit:[36.2,40.5,28.3,28.5,null,null],
        netProfit:[11.3,30.9,12.9,7.9,null,null],
        eps:[2.21,6.05,2.55,1.55,null,null],
        dps:[3.01,5.43,1.70,1.09,null,null]};
    }

    // Mark status
    STOCKS.forEach(function(k) {
      if (DATA[k]) STATUS[k] = 'ok';
    });
    if (!SEL || !DATA[SEL]) SEL = STOCKS[0];

    var sub = document.getElementById('hSub');
    if (sub) sub.textContent = STOCKS.length + ' stocks · ' + YEARS[0] + '–' + YEARS[N_Y-1] + ' · ' + (loadedFromJson ? '📡 Live' : '📋 Built-in');
    log('Render starting...');
    render();
    log('✅ Rendered successfully');
  } catch(e) {
    log('❌ FATAL: ' + e.message);
    document.getElementById('cont').innerHTML =
      '<div class="state"><h3 style="color:#ff5a7a">Boot Error</h3><p>'+esc(e.message)+'</p><pre style="font-size:10px;color:#6c8db0;text-align:left;margin-top:16px;overflow:auto">'+esc(e.stack||'')+'</pre></div>';
    document.getElementById('hSub').textContent = '❌ ' + e.message;
  }
}
boot();
</script>
</body>
</html>
