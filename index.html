<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FA Dashboard — Fundamental Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07111e;--surf:#0d1c2e;--surf2:#122336;--surf3:#192d42;
  --bdr:#1a3050;--bdr2:#22405e;
  --txt:#d8eaf8;--muted:#4e7398;--muted2:#7aa0be;
  --cyan:#00c4e0;--cyan2:#0096ae;
  --green:#00d97e;--red:#ff4060;
  --orange:#ff8c40;--yellow:#ffd060;--purple:#b49dff;--blue:#4da0ff;
  --r:10px; --font:'Outfit',system-ui,sans-serif;
}
html{font-size:14px}
body{background:var(--bg);color:var(--txt);font-family:var(--font);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:var(--font)}
::-webkit-scrollbar{width:5px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}

/* ── HEADER ── */
#hdr{background:var(--surf);border-bottom:1px solid var(--bdr);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  position:sticky;top:0;z-index:200}
.h-logo{width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--cyan2),#004f6e);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.h-title{font-size:15px;font-weight:700;line-height:1.2}
.h-sub{font-size:10px;color:var(--muted);margin-top:1px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;
  border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.btn-cyan{background:var(--cyan2);color:#fff}.btn-cyan:hover{background:var(--cyan);color:#000}
.btn-green{background:#006640;color:#fff}.btn-green:hover{background:var(--green);color:#000}
.btn-ghost{background:var(--surf2);color:var(--muted2);border:1px solid var(--bdr2)}
.btn-ghost:hover{background:var(--surf3);color:var(--txt)}
.btn-red{background:#5a0e1e;color:#ff9aaa;border:none}.btn-red:hover{background:#8a1530}
.btn-sm{padding:4px 10px;font-size:11px}.btn-xs{padding:3px 8px;font-size:10px}

/* ── STOCK BAR ── */
#sBar{background:var(--surf);border-bottom:1px solid var(--bdr);padding:8px 14px;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
#sBar::-webkit-scrollbar{height:3px}
.s-list{display:flex;gap:5px;min-width:max-content}
.s-btn{padding:5px 10px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:700;
  background:var(--surf2);color:var(--muted2);transition:all .15s;
  display:inline-flex;align-items:center;gap:4px}
.s-btn:hover{background:var(--surf3);color:var(--txt)}
.s-btn.on{background:var(--cyan2);color:#fff;box-shadow:0 0 12px rgba(0,150,174,.4)}
.xbadge{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700}
.x-asx{background:rgba(255,208,96,.15);color:#ffd060}
.x-idx{background:rgba(77,160,255,.15);color:#4da0ff}
.x-us{background:rgba(0,217,126,.15);color:#00d97e}
.s-dot-ok{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}
.s-dot-ld{width:5px;height:5px;border-radius:50%;background:var(--yellow);flex-shrink:0;animation:pulse 1s infinite}
.s-dot-er{width:5px;height:5px;border-radius:50%;background:var(--red);flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── TAB BAR ── */
#tBar{background:var(--surf);border-bottom:1px solid var(--bdr);padding:0 16px;display:flex;overflow-x:auto}
#tBar::-webkit-scrollbar{display:none}
.t-btn{padding:11px 15px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;transition:all .15s}
.t-btn:hover{color:var(--txt)}
.t-btn.on{border-color:var(--cyan);color:var(--cyan)}

/* ── CONTENT ── */
#cont{padding:14px;max-width:1700px;margin:0 auto}

/* ── SECTION ── */
.sec{margin-bottom:20px}
.sec-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--cyan);margin-bottom:10px;padding-left:8px;border-left:2px solid var(--cyan)}

/* ── STOCK HEADER ── */
.sk-hdr{margin-bottom:14px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px}
.sk-hdr h2{font-size:17px;font-weight:700}
.sk-hdr p{font-size:11px;color:var(--muted);margin-top:3px}

/* ── LOADING / ERROR STATES ── */
.state-box{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);
  padding:40px;text-align:center}
.spinner{width:36px;height:36px;border:3px solid var(--bdr2);border-top-color:var(--cyan);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.state-title{font-size:14px;font-weight:600;margin-bottom:6px}
.state-sub{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.data-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:3px 8px;
  border-radius:20px;font-weight:600}
.db-ok{background:rgba(0,217,126,.1);color:var(--green);border:1px solid rgba(0,217,126,.3)}
.db-er{background:rgba(255,64,96,.1);color:var(--red);border:1px solid rgba(255,64,96,.3)}
.db-ld{background:rgba(255,208,96,.1);color:var(--yellow);border:1px solid rgba(255,208,96,.3)}

/* ── TABLES ── */
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--bdr);-webkit-overflow-scrolling:touch}
.tw::-webkit-scrollbar{height:4px}
table{width:100%;border-collapse:collapse;background:var(--bg);font-size:12px;font-family:var(--font)}
thead th{background:var(--surf2);padding:8px 10px;text-align:left;font-size:10px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;font-weight:600}
th.tc,td.tc{text-align:center}
tbody td{padding:6px 10px;border-bottom:1px solid rgba(26,48,80,.5);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(18,35,54,.7)}
tbody tr.ev td{background:rgba(18,35,54,.4)}
td.lbl{font-size:11px;font-weight:600;color:var(--txt);min-width:160px}
td.num{font-size:12px;font-weight:500}
.pos{color:var(--green)}.neg{color:var(--red)}
.cya{color:var(--cyan)}.ylo{color:var(--yellow)}.pur{color:var(--purple)}.blu{color:var(--blue)}

/* ── CARDS ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px;margin-bottom:14px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 13px}
.card-l{font-size:10px;color:var(--muted);margin-bottom:5px;font-weight:500}
.card-v{font-size:19px;font-weight:700;letter-spacing:-.01em}

/* ── WEIGHTS ── */
.wt-wrap{border-radius:12px;padding:14px;margin-bottom:16px}
.wt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.wt-card{background:var(--surf);border:1px solid var(--bdr);border-radius:9px;padding:10px}
.wt-card.ov{border-color:var(--orange);background:rgba(255,140,64,.07)}
.wt-l{font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:600;line-height:1.3}
.wt-card.ov .wt-l{color:var(--orange)}
.wt-row{display:flex;align-items:center;gap:4px}
.wt-inp{width:52px;background:var(--bg);border:1px solid var(--bdr2);border-radius:6px;
  padding:4px 7px;font-size:13px;font-weight:700;color:var(--txt)}
.wt-inp.ov{border-color:var(--orange);color:var(--orange)}
.wt-inp:focus{outline:none;border-color:var(--cyan)}
.wt-u{font-size:11px;color:var(--muted)}
.tw-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;
  font-size:12px;font-weight:700}
.tw-ok{background:rgba(0,217,126,.15);color:var(--green)}
.tw-bad{background:rgba(255,64,96,.15);color:var(--red)}

/* ── RANK CIRCLES ── */
.rc{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;font-size:10px;font-weight:700}
.rc1{background:rgba(255,208,96,.25);color:#ffd060;box-shadow:0 0 6px rgba(255,208,96,.5)}
.rc2{background:rgba(180,190,210,.15);color:#b0c4d8;box-shadow:0 0 5px rgba(180,190,210,.4)}
.rc3{background:rgba(255,140,64,.2);color:#ffa060;box-shadow:0 0 5px rgba(255,140,64,.4)}
.rc4{background:rgba(0,217,126,.12);color:#00d97e;box-shadow:0 0 4px rgba(0,217,126,.3)}
.rc5{background:rgba(77,160,255,.12);color:#4da0ff;box-shadow:0 0 4px rgba(77,160,255,.3)}
.rc-g{color:var(--green)}.rc-m{color:var(--muted)}

/* ── RANK ROW COLORS ── */
.fr1{background:rgba(255,208,96,.06)!important}
.fr2,.fr3{background:rgba(0,217,126,.04)!important}
.fr4{background:rgba(77,160,255,.03)!important}
.frb{background:rgba(255,64,96,.03)!important}

/* ── CHART ── */
.chart-box{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:14px}
#chartWrap{position:relative;height:420px}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(5px);
  z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--surf);border:1px solid var(--bdr2);border-radius:16px;
  width:100%;max-width:980px;max-height:93vh;overflow-y:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;
  align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surf);z-index:10}
.modal-h h3{font-size:15px;font-weight:700}
.modal-x{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 2px}
.modal-x:hover{color:var(--txt)}
.modal-b{padding:18px}

/* ── FORM ── */
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin-bottom:18px}
.fld label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;
  font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld select{width:100%;background:var(--bg);border:1px solid var(--bdr2);
  border-radius:7px;padding:7px 10px;font-size:12px;color:var(--txt)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--cyan)}
.fld select option{background:var(--surf)}
.err{color:var(--red);font-size:11px;margin-top:8px;font-weight:600}

/* ── NOTICE ── */
.notice{background:rgba(0,196,224,.07);border:1px solid rgba(0,196,224,.2);
  border-radius:8px;padding:10px 13px;font-size:11px;color:var(--muted2);
  margin-bottom:14px;line-height:1.6}
.notice strong{color:var(--cyan)}

/* ── SOURCE INFO BAR ── */
.src-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  background:var(--surf);border:1px solid var(--bdr);border-radius:9px;padding:9px 13px;margin-bottom:14px}
.src-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.src-meta{font-size:10px;color:var(--muted);line-height:1.5}
.src-meta strong{color:var(--muted2)}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  #hdr{padding:8px 12px}
  .h-title{font-size:13px}.h-sub{display:none}
  .h-logo{width:28px;height:28px;font-size:9px}
  #cont{padding:10px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .wt-grid{grid-template-columns:repeat(2,1fr)}
  .card-v{font-size:16px}
  #chartWrap{height:300px}
  .sk-hdr h2{font-size:14px}
  .btn{padding:5px 10px;font-size:11px}
  .state-box{padding:24px 16px}
}
@media(min-width:1200px){.cards{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<div id="hdr">
  <div style="display:flex;align-items:center;gap:10px">
    <div class="h-logo">FA</div>
    <div>
      <div class="h-title">Fundamental Analysis Dashboard</div>
      <div class="h-sub" id="hSub">ASX · IDX · NYSE/NASDAQ — Auto-sourced · loading…</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <button class="btn btn-ghost btn-sm" onclick="showSync()">🔄 Sync</button>
    <button class="btn btn-green btn-sm" onclick="showAdd()">＋ Add Stock</button>
  </div>
</div>

<div id="sBar"><div class="s-list" id="sList"></div></div>

<div id="tBar">
  <button class="t-btn on" id="t-data"     onclick="setTab('data')">📋 Data</button>
  <button class="t-btn"    id="t-ratios"   onclick="setTab('ratios')">📐 Ratios</button>
  <button class="t-btn"    id="t-chart"    onclick="setTab('chart')">📈 Chart</button>
  <button class="t-btn"    id="t-rankings" onclick="setTab('rankings')">🏆 Rankings</button>
</div>

<div id="cont"></div>

<!-- ADD STOCK MODAL -->
<div id="addModal" class="modal-bg" style="display:none">
  <div class="modal">
    <div class="modal-h"><h3>＋ Add New Stock</h3><button class="modal-x" onclick="hideAdd()">×</button></div>
    <div class="modal-b" id="addBody"></div>
  </div>
</div>

<!-- SYNC MODAL -->
<div id="syncModal" class="modal-bg" style="display:none">
  <div class="modal" style="max-width:520px">
    <div class="modal-h"><h3>🔄 Sync Between Devices</h3><button class="modal-x" onclick="hideSync()">×</button></div>
    <div class="modal-b" id="syncBody"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════
// ── DYNAMIC YEAR ROLLING ─────────────────────────────────────────
// YEARS = 5 completed years + current year (annualised estimate)
// Auto-rolls every year automatically.
const CURRENT_YEAR = new Date().getFullYear();
const LATEST_YEAR  = CURRENT_YEAR - 1;                              // last fully completed year
const YEARS        = Array.from({length:5}, (_,i) => LATEST_YEAR - 4 + i).concat([CURRENT_YEAR]);
// e.g. in 2026: YEARS=[2021,2022,2023,2024,2025,2026]
//      in 2027: YEARS=[2022,2023,2024,2025,2026,2027] ← auto-rolls!
const N_YEARS      = YEARS.length; // 6

// annualisation metadata loaded from data.json: {SYM: {label:"9M×1.333", quarters:3, asOf:"2026-09-30"}}
let ANNUALISATION  = {};

const LS_KEY='fa_v4';
const CACHE_TTL=7*24*60*60*1000; // 7 days

const BASE_STOCKS={
  BHP:{name:"BHP Group",             exchange:"ASX", currency:"B AUD"},
  WDS:{name:"Woodside Energy",       exchange:"ASX", currency:"B AUD"},
  BBRI:{name:"Bank Rakyat Indonesia",exchange:"IDX", currency:"T IDR"},
  ADRO:{name:"Adaro Energy",         exchange:"IDX", currency:"T IDR"},
  SMSM:{name:"Selamat Sempurna",     exchange:"IDX", currency:"T IDR"},
  UNTR:{name:"United Tractors",      exchange:"IDX", currency:"T IDR"},
  ITMG:{name:"Indo Tambangraya Megah",exchange:"IDX",currency:"T IDR"},
  POWR:{name:"Cikarang Listrindo",   exchange:"IDX", currency:"T IDR"},
  MPMX:{name:"Mitra Pinasthika Mustika",exchange:"IDX",currency:"T IDR"},
  BTPS:{name:"Bank BTPN Syariah",    exchange:"IDX", currency:"T IDR"},
  DMAS:{name:"Puradelta Lestari",    exchange:"IDX", currency:"T IDR"},
  SPTO:{name:"Surya Toto Indonesia", exchange:"IDX", currency:"T IDR"},
};

const DEF_WTS={cashToAsset:10,debtToEquity:5,revenueCagr:5,gpmAvg:0,
  netProfitCagr:5,npmAvg:30,epsCagr:5,dpsCagr:0,roeAvg:25,dividendPayout:0,buffettTest:15};

const CRITERIA=[
  {key:"cashToAsset",  wKey:"cashToAsset",   label:"Cash/Asset", hi:true},
  {key:"debtToEquity", wKey:"debtToEquity",  label:"D/E Ratio",  hi:false},
  {key:"revenueCagr",  wKey:"revenueCagr",   label:"Rev CAGR",   hi:true},
  {key:"gpmAvg",       wKey:"gpmAvg",        label:"GP Margin",  hi:true},
  {key:"netProfitCagr",wKey:"netProfitCagr", label:"NP CAGR",    hi:true},
  {key:"npmAvg",       wKey:"npmAvg",        label:"NP Margin",  hi:true},
  {key:"epsCagr",      wKey:"epsCagr",       label:"EPS CAGR",   hi:true},
  {key:"dpsCagr",      wKey:"dpsCagr",       label:"DPS CAGR",   hi:true},
  {key:"roeAvg",       wKey:"roeAvg",        label:"ROE",        hi:true},
  {key:"dividendPayout",wKey:"dividendPayout",label:"Div Payout",hi:true},
  {key:"buffettTest",  wKey:"buffettTest",   label:"Buffett $1", hi:true},
];

const MKEYS=[
  {k:"totalAsset",l:"Total Asset"},    {k:"cash",l:"Cash"},
  {k:"totalDebt",l:"Total Debt"},      {k:"totalEquity",l:"Total Equity"},
  {k:"revenue",l:"Total Revenue"},     {k:"grossProfit",l:"Gross Profit"},
  {k:"netProfit",l:"Net Profit"},      {k:"eps",l:"EPS"},
  {k:"dps",l:"DPS"},
];

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
let S={
  stocks:{...BASE_STOCKS},
  custom:{},
  deleted:{},
  data:{},
  status:{},
  errmsg:{},
  sel:"BHP",
  tab:"data",
  wts:{...DEF_WTS},
};

// ═══════════════════════════════════
// STORAGE & SYNC
// ═══════════════════════════════════
function saveLS(){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify({
      custom:S.custom, wts:S.wts, sel:S.sel,
      data:S.data, status:S.status, deleted:S.deleted||{}
    }));
  }catch(e){}
}
function loadLS(){
  try{
    const h=location.hash;
    if(h&&h.startsWith('#d=')){
      applyImport(JSON.parse(atob(decodeURIComponent(h.slice(3)))));
      history.replaceState(null,'',location.pathname);return;
    }
    const raw=localStorage.getItem(LS_KEY);
    if(raw) applyImport(JSON.parse(raw),true);
  }catch(e){}
}
function applyImport(d,quiet){
  if(d.custom){S.custom=d.custom||{};S.stocks={...BASE_STOCKS,...S.custom};}
  if(d.wts) S.wts={...DEF_WTS,...d.wts};
  if(d.sel&&S.stocks[d.sel]) S.sel=d.sel;
  if(d.data)   S.data={...d.data};
  if(d.deleted) S.deleted={...d.deleted};
  if(d.status){Object.keys(d.status).forEach(k=>{S.status[k]=d.status[k]==='ok'?'ok':'idle';});}
  if(!quiet) saveLS();
}
function exportJSON(){
  const d={custom:S.custom,wts:S.wts,sel:S.sel,data:S.data,status:S.status,at:new Date().toISOString()};
  const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='FA_Dashboard_sync.json';a.click();URL.revokeObjectURL(u);
}
function importFile(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      applyImport(JSON.parse(e.target.result));
      render();hideSync();
      showToast('✓ Imported successfully — portfolio restored!','green');
    }catch(x){showToast('Error importing file: '+x.message,'red');}
  };
  r.readAsText(file);
}
function genLink(){
  const d={custom:S.custom,wts:S.wts,sel:S.sel,data:S.data};
  return location.href.split('#')[0]+'#d='+encodeURIComponent(btoa(JSON.stringify(d)));
}

// ═══════════════════════════════════
// TOAST
// ═══════════════════════════════════
function showToast(msg,col='cyan'){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;'+
      'padding:9px 18px;border-radius:20px;font-size:12px;font-weight:600;'+
      'font-family:var(--font);pointer-events:none;transition:opacity .3s';
    document.body.appendChild(t);}
  const colors={green:'background:rgba(0,217,126,.2);color:#00d97e;border:1px solid rgba(0,217,126,.4)',
    red:'background:rgba(255,64,96,.2);color:#ff4060;border:1px solid rgba(255,64,96,.4)',
    cyan:'background:rgba(0,196,224,.2);color:#00c4e0;border:1px solid rgba(0,196,224,.4)'};

}

// ── Optional Yahoo Finance refresh ──────────────────────────────────
function yahooTicker(symbol, exchange){
  if(exchange==='ASX') return symbol+'.AX';
  if(exchange==='IDX') return symbol+'.JK';
  return symbol;
}
const rv = v => (v?.raw != null) ? v.raw : null;
function scaledVal(yVal, exchange){
  const raw=rv(yVal); if(raw==null) return null;
  return raw/(exchange==='IDX'?1e12:1e9);
}

const PROXIES=[
  u=>`https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
];

async function fetchStock(symbol){
  if(S.status[symbol]==='loading') return;
  const stock=S.stocks[symbol]; if(!stock) return;
  S.status[symbol]='loading'; delete S.errmsg[symbol]; render();
  const ticker=yahooTicker(symbol,stock.exchange);
  try{
    const modules='incomeStatementHistory,balanceSheetHistory,cashflowStatementHistory';
    const yUrl=`https://query1.finance.yahoo.com/v10/finance/quoteSummary/${encodeURIComponent(ticker)}?modules=${modules}`;
    let data=null,lastErr=null;
    for(const pFn of PROXIES){
      try{
        const r=await fetch(pFn(yUrl),{signal:AbortSignal.timeout(10000)});
        if(!r.ok) throw new Error(`HTTP ${r.status}`);
        const j=await r.json();
        data=typeof j?.contents==='string'?JSON.parse(j.contents):j;
        break;
      }catch(e){lastErr=e;}
    }
    if(!data) throw new Error(`Cannot reach Yahoo Finance from this network. Built-in data is active — use ✏ Edit to update values manually.`);
    if(data.quoteSummary?.error) throw new Error(data.quoteSummary.error.description||'Yahoo error');
    const res=data.quoteSummary?.result?.[0];
    if(!res) throw new Error(`Ticker "${ticker}" not found on Yahoo Finance`);
    const incArr=res.incomeStatementHistory?.incomeStatementHistory||[];
    const bsArr=res.balanceSheetHistory?.balanceSheetStatements||[];
    const cfArr=res.cashflowStatementHistory?.cashflowStatements||[];
    if(!incArr.length) throw new Error(`No income data for "${ticker}"`);
    const toYear=r=>new Date((r.endDate?.raw||0)*1000).getFullYear();
    const iMap={},bMap={},cMap={};
    incArr.forEach(r=>iMap[toYear(r)]=r);
    bsArr.forEach(r=>bMap[toYear(r)]=r);
    cfArr.forEach(r=>cMap[toYear(r)]=r);
    const ex=stock.exchange;
    const result={totalAsset:[],cash:[],totalDebt:[],totalEquity:[],
      revenue:[],grossProfit:[],netProfit:[],eps:[],dps:[]};
    YEARS.forEach(yr=>{
      const i=iMap[yr]||null,b=bMap[yr]||null,c=cMap[yr]||null;
      result.totalAsset.push(b?scaledVal(b.totalAssets,ex):null);
      result.cash.push(b?scaledVal(b.cash??b.cashAndCashEquivalents,ex):null);
      const std=b?(rv(b.shortLongTermDebt)||rv(b.currentDebt)||rv(b.shortTermDebt)||0):0;
      const ltd=b?(rv(b.longTermDebt)||0):0;
      result.totalDebt.push(b&&(std+ltd)?(std+ltd)/(ex==='IDX'?1e12:1e9):null);
      result.totalEquity.push(b?scaledVal(b.totalStockholderEquity,ex):null);
      result.revenue.push(i?scaledVal(i.totalRevenue,ex):null);
      result.grossProfit.push(i?scaledVal(i.grossProfit,ex):null);
      result.netProfit.push(i?scaledVal(i.netIncome,ex):null);
      result.eps.push(i?rv(i.basicEPS):null);
      const divPaid=c?Math.abs(rv(c.dividendsPaid)||0):0;
      const shares=i?(rv(i.basicAverageShares)||rv(i.dilutedAverageShares)||0):0;
      result.dps.push(shares>0&&divPaid>0?divPaid/shares:null);
    });
    const availYears=Object.keys(iMap).map(Number).sort();
    S.data[symbol]={...result,fetchedAt:Date.now(),source:'Yahoo Finance',ticker,availYears};
    S.status[symbol]='ok'; saveLS();
    showToast(`✓ ${symbol} refreshed from Yahoo Finance`,'green');
  }catch(err){
    // Don't overwrite existing good data on refresh failure
    if(S.data[symbol]) S.status[symbol]='ok';
    else S.status[symbol]='error';
    S.errmsg[symbol]=err.message;
    showToast(`${symbol} refresh failed — built-in data shown`,'cyan');
  }
  render();
}

// ═══════════════════════════════════
// MATH — handles null values
// ═══════════════════════════════════
const isOK=v=>v!==null&&v!==undefined&&isFinite(v)&&!isNaN(v);
const avg=a=>{const v=a.filter(isOK);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
const N2=(v,d=2)=>isOK(v)?Number(v).toFixed(d):'N/A';
const P1=(v,d=1)=>isOK(v)?Number(v).toFixed(d)+'%':'N/A';
function cagr(a){
  const v=a.filter(isOK);
  if(v.length<2)return null;
  const s=v[0],e=v[v.length-1],n=v.length-1;
  if(s===0||n===0)return null;
  if(s>0&&e>0)return(Math.pow(e/s,1/n)-1)*100;
  return null;
}

function calcM(symbol){
  const data=S.data[symbol];
  if(!data) return null;
  const sl=k=>(data[k]||Array(N_YEARS).fill(null)).slice(0,N_YEARS);
  const ta=sl('totalAsset'),ca=sl('cash'),td=sl('totalDebt'),te=sl('totalEquity');
  const rv2=sl('revenue'),gp=sl('grossProfit'),np=sl('netProfit'),ep=sl('eps'),dp=sl('dps');

  const Y=YEARS.map((yr,i)=>({
    year:yr,
    totalAsset:ta[i],cash:ca[i],totalDebt:td[i],totalEquity:te[i],
    revenue:rv2[i],grossProfit:gp[i],netProfit:np[i],eps:ep[i],dps:dp[i],
    cashToAsset: isOK(ta[i])&&ta[i]>0&&isOK(ca[i]) ? ca[i]/ta[i]*100 : null,
    debtToEquity: isOK(te[i])&&te[i]!==0&&isOK(td[i]) ? td[i]/te[i]*100 : null,
    gpm:  isOK(rv2[i])&&rv2[i]>0&&isOK(gp[i]) ? gp[i]/rv2[i]*100 : null,
    npm:  isOK(rv2[i])&&rv2[i]>0&&isOK(np[i]) ? np[i]/rv2[i]*100 : null,
    roa:  isOK(ta[i])&&ta[i]>0&&isOK(np[i])   ? np[i]/ta[i]*100  : null,
    roe:  isOK(te[i])&&te[i]!==0&&isOK(np[i]) ? np[i]/te[i]*100  : null,
    divPayout: isOK(ep[i])&&ep[i]>0&&isOK(dp[i]) ? dp[i]/ep[i]*100 : null,
    valLow:  isOK(dp[i]) ? dp[i]*10  : null,
    valHigh: isOK(dp[i]) ? dp[i]*20  : null,
    retEps:  null,  // calculated below after Buffett test
  }));

  const av={
    cashToAsset:avg(Y.map(y=>y.cashToAsset)), debtToEquity:avg(Y.map(y=>y.debtToEquity)),
    gpm:avg(Y.map(y=>y.gpm)), npm:avg(Y.map(y=>y.npm)),
    roa:avg(Y.map(y=>y.roa)), roe:avg(Y.map(y=>y.roe)),
    divPayout:avg(Y.map(y=>y.divPayout)),
  };
  const cg={rev:cagr(rv2),np:cagr(np),eps:cagr(ep),dps:cagr(dp)};

  // ── Buffett $1 Test ──────────────────────────────────────────────
  // Use COMPLETED years only (indices 0–4, i.e. exclude current-year estimate at index 5).
  // retEps = EPS − DPS per year. If DPS is null/unknown, treat as 0 (full retention).
  // totRet = sum of all yearly retEps over the completed period.
  // epsInc = EPS at end of completed period minus EPS at start.
  const N_COMPLETED = N_YEARS - 1;  // 5 completed years, index 0–4
  const epCompleted = ep.slice(0, N_COMPLETED);
  const dpCompleted = dp.slice(0, N_COMPLETED);

  const retEpsCompleted = epCompleted.map((e, i) => {
    if (!isOK(e)) return null;
    const d = isOK(dpCompleted[i]) ? dpCompleted[i] : 0;  // null DPS → 0 (full retention)
    return e - d;
  });

  const retEpsVals = retEpsCompleted.filter(isOK);
  const totRet = retEpsVals.length > 0 ? retEpsVals.reduce((s,v) => s+v, 0) : null;

  const epCompletedOK = epCompleted.filter(isOK);
  const epsInc = epCompletedOK.length >= 2
    ? epCompletedOK[epCompletedOK.length-1] - epCompletedOK[0]
    : null;

  const buff = isOK(totRet) && Math.abs(totRet) > 0.001 && isOK(epsInc)
    ? epsInc / totRet * 100
    : null;

  // For display cards — also expose retEps on Y rows (all years including current)
  Y.forEach((y, i) => {
    if (!isOK(y.eps)) { y.retEps = null; return; }
    const d = isOK(y.dps) ? y.dps : 0;
    y.retEps = y.eps - d;
  });

  return{Y,av,cg,epsInc,totRet,buff,raw:{ta,ca,td,te,rv:rv2,gp,np,ep,dp},
    rm:{cashToAsset:av.cashToAsset,debtToEquity:av.debtToEquity,revenueCagr:cg.rev,
      gpmAvg:av.gpm,netProfitCagr:cg.np,npmAvg:av.npm,epsCagr:cg.eps,dpsCagr:cg.dps,
      roeAvg:av.roe,dividendPayout:av.divPayout,buffettTest:buff}};
}

function calcRanks(wts){
  const ks=Object.keys(S.stocks).filter(k=>S.status[k]==='ok');
  const N=ks.length; if(!N) return{ranks:{},scores:{},fr:{}};
  const allM=Object.fromEntries(ks.map(k=>[k,calcM(k)]));
  const ranks=Object.fromEntries(ks.map(k=>[k,{}]));
  CRITERIA.forEach(c=>{
    const vs=ks.map(k=>({k,v:allM[k]?.rm[c.key]}));
    vs.sort((a,b)=>{
      if(!isOK(a.v)&&!isOK(b.v))return 0;if(!isOK(a.v))return 1;if(!isOK(b.v))return -1;
      return c.hi?b.v-a.v:a.v-b.v;
    });
    vs.forEach((x,i)=>{ranks[x.k][c.key]=i+1;});
  });
  const scores=Object.fromEntries(ks.map(k=>{
    const ws=CRITERIA.reduce((s,c)=>s+(ranks[k][c.key]||N)*(wts[c.wKey]||0)/100,0);
    return[k,{ranks:ranks[k],ws,m:allM[k]}];
  }));
  const sorted=[...ks].sort((a,b)=>scores[a].ws-scores[b].ws);
  const fr=Object.fromEntries(sorted.map((k,i)=>[k,i+1]));
  return{ranks,scores,fr};
}

        {type:'bar',  label:'Net Profit',  data:safeArr(m.raw.np),backgroundColor:'rgba(255,208,96,.75)',borderRadius:4,yAxisID:'y'},
        {type:'line', label:'GP Margin %', data:m.raw.rv.map((v,i)=>isOK(v)&&v>0&&isOK(m.raw.gp[i])?m.raw.gp[i]/v*100:null),
          borderColor:'#ff4060',borderWidth:2.5,pointRadius:4,fill:false,yAxisID:'y1',tension:.3,
          pointBackgroundColor:'#ff4060',spanGaps:true},
        {type:'line', label:'NP Margin %', data:m.raw.rv.map((v,i)=>isOK(v)&&v>0&&isOK(m.raw.np[i])?m.raw.np[i]/v*100:null),
          borderColor:'#b49dff',borderWidth:2.5,pointRadius:4,fill:false,yAxisID:'y1',tension:.3,
          borderDash:[5,3],pointBackgroundColor:'#b49dff',spanGaps:true},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:'#7aa0be',font:{size:11,family:'Outfit'},padding:14,usePointStyle:true}},
        tooltip:{backgroundColor:'rgba(13,28,46,.97)',borderColor:'#1a3050',borderWidth:1,
          titleColor:'#d8eaf8',bodyColor:'#7aa0be',
          callbacks:{label:c=>{const v=c.parsed.y;
            return` ${c.dataset.label}: ${c.datasetIndex>=3?v?.toFixed(1)+'%':(v?.toFixed(2)||'N/A')+' '+st.currency}`;}}}
      },
      scales:{
        x:{ticks:{color:'#4e7398',font:{family:'Outfit'}},grid:{color:'rgba(26,48,80,.5)'}},
        y:{position:'left',ticks:{color:'#4e7398',font:{family:'Outfit',size:10}},
          grid:{color:'rgba(26,48,80,.5)'},
          title:{display:true,text:st.currency,color:'#2a4a6a',font:{size:10,family:'Outfit'}}},
        y1:{position:'right',ticks:{color:'#4e7398',callback:v=>v?.toFixed(1)+'%',font:{family:'Outfit'}},
          grid:{drawOnChartArea:false},
          title:{display:true,text:'Margin %',color:'#2a4a6a',font:{size:10,family:'Outfit'}}}
      }
    }
  });
}

// ═══════════════════════════════════
// RENDER
// ═══════════════════════════════════
function render(){
  renderSBar(); renderTabBtns(); renderMain(); saveLS();
}

function renderTabBtns(){
  ['data','ratios','chart','rankings'].forEach(t=>{
    const e=document.getElementById('t-'+t);
    if(e) e.className='t-btn'+(S.tab===t?' on':'');
  });
}
function renderSBar(){
  const ks=Object.keys(S.stocks);
  document.getElementById('sList').innerHTML=ks.map(k=>{
    const st=S.stocks[k];
    const ex=(st.exchange||'').toUpperCase();
    const bc=ex==='ASX'?'x-asx':ex==='IDX'?'x-idx':'x-us';
    const st2=S.status[k];
    const dot=st2==='ok'?'<span class="s-dot-ok"></span>':st2==='loading'?'<span class="s-dot-ld"></span>':st2==='error'?'<span class="s-dot-er"></span>':'';
    return`<button class="s-btn${S.sel===k?' on':''}" onclick="selStock('${k}')">
      ${dot}${k}<span class="xbadge ${bc}">${ex}</span>
    </button>`;
  }).join('');
}

function renderMain(){
  const cont=document.getElementById('cont');
  if(S.tab==='rankings'){cont.innerHTML=tabRankings();return;}
  const st=S.stocks[S.sel];
  const stat=S.status[S.sel]||'idle';
  // Show spinner only when loading (Yahoo refresh in progress)
  if(stat==='loading'){cont.innerHTML=stateBox('loading',S.sel,st);return;}
  // Show placeholder only for custom stocks with no data at all
  if(!S.data[S.sel]){cont.innerHTML=stateBox('none',S.sel,st);return;}
  // Render tabs
  if(S.tab==='data')    cont.innerHTML=tabData(S.sel,st);
  else if(S.tab==='ratios') cont.innerHTML=tabRatios(S.sel,st);
  else if(S.tab==='chart'){
    cont.innerHTML=tabChartHTML(S.sel,st);
    setTimeout(()=>makeChart(S.sel),80);
  }
}

function stateBox(st,sym,stock){
  const ticker=yahooTicker(sym, stock.exchange||'');
  if(st==='loading'){
    return`<div class="state-box">
      <div class="spinner"></div>
      <div class="state-title">Refreshing ${sym} from Yahoo Finance…</div>
      <div class="state-sub">Attempting live refresh for <em>${stock.name}</em><br>
        Ticker: <code style="background:rgba(0,0,0,.3);padding:1px 7px;border-radius:4px">${ticker}</code><br>
        Built-in data remains active if refresh fails.</div>
      <span class="data-badge db-ld">⏳ Trying Yahoo Finance…</span>
    </div>`;
  }
  // idle or no-data for custom stocks
  const isCustom=!!S.custom[sym];
  return`<div class="state-box">
    <div style="font-size:36px;margin-bottom:12px">📋</div>
    <div class="state-title">No data for ${sym}</div>
    <div class="state-sub" style="max-width:500px;margin:0 auto 16px">
      ${isCustom
        ? `<strong>${stock.name}</strong> was added but data hasn't been fetched yet.<br><br>
           To fetch automatically:<br>
           1. Make sure <code style="background:rgba(0,0,0,.2);padding:1px 6px;border-radius:3px">${sym}</code> is in your <strong>stocks_config.json</strong> on GitHub<br>
           2. Go to <strong>Actions → Refresh Financial Data → Run workflow</strong><br>
           3. Refresh this page after the workflow completes (~1 min)`
        : `This stock has no data yet.`
      }
    </div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-cyan" onclick="showManual('${sym}')">✏ Enter Data Manually</button>
      ${isCustom?`<button class="btn btn-red btn-sm" onclick="delStock('${sym}')">🗑 Remove ${sym}</button>`:''}
    </div>
    ${isCustom?`<div style="margin-top:12px">
      <a href="https://github.com/rauladi/fa-dashboard/actions" target="_blank"
        class="btn btn-ghost btn-sm" style="text-decoration:none">🚀 Open GitHub Actions</a>
    </div>`:''}
  </div>`;
}

function srcBar(sym,st){
  const d=S.data[sym];
  const isCustom=!!S.custom[sym];
  const ticker=d?.ticker||yahooTicker(sym,st.exchange||'');
  const src = d?.source||'built-in';
  const ann = ANNUALISATION[sym];
  let badge, note;
  if(src==='yfinance'){
    const gen = d?.generated ? new Date(d.generated).toLocaleDateString() : '—';
    let annNote='';
    if(ann && ann.label && ann.label!=='FY')
      annNote=` · <span style="color:var(--orange);font-weight:600">${CURRENT_YEAR} = ${ann.label} annualised (as of ${ann.asOf||'—'})</span>`;
    else if(ann && ann.label==='FY')
      annNote=` · <span style="color:var(--green)">FY${CURRENT_YEAR} full results available</span>`;
    else
      annNote=` · <span style="color:var(--muted)">${CURRENT_YEAR} awaiting quarterly data</span>`;
    badge=`<span class="data-badge db-ok">✓ Auto-refreshed</span>`;
    note=`Live via yfinance · Refreshed: ${gen} · GitHub Actions runs monthly${annNote}`;
  } else {
    badge=`<span class="data-badge" style="background:rgba(255,208,96,.1);color:#ffd060;border:1px solid rgba(255,208,96,.3)">📋 Built-in data</span>`;
    note=`Embedded from annual reports · <strong style="color:var(--yellow)">Host on GitHub Pages for quarterly auto-refresh</strong>`;
  }
  return`<div class="src-bar">
    <div class="src-info">
      ${badge}
      <div class="src-meta">
        <strong>${st.name}</strong> · ${st.exchange} · ${st.currency} · <code style="background:rgba(0,0,0,.2);padding:0 5px;border-radius:3px;font-size:9px">${ticker}</code><br>
        ${note}
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-ghost btn-xs" onclick="showManual('${sym}')">✏ Edit</button>
      ${isCustom?`<button class="btn btn-red btn-xs" onclick="delStock('${sym}')">🗑 Remove</button>`:''}
    </div>
  </div>`;
}

// ── Annualisation label for current year column header ──
function yearColHeader(sym, yr) {
  if (yr !== CURRENT_YEAR) return `<th class="tc">${yr}</th>`;
  const ann = ANNUALISATION[sym];
  if (!ann || !ann.label || ann.label === 'FY') {
    const tag = ann?.label === 'FY' ? 'FY' : 'Est.';
    return `<th class="tc" style="color:var(--yellow)">${yr}<br><span style="font-size:8px;color:var(--yellow);opacity:.85">${tag}</span></th>`;
  }
  const asOf = ann.asOf ? ` ${ann.asOf.slice(5)}` : '';  // MM-DD
  return `<th class="tc" style="color:var(--orange)">${yr}<br><span style="font-size:8px;color:var(--orange);opacity:.9">${ann.label}${asOf}</span></th>`;
}

// ── DATA TAB ──
function tabData(sym,st){
  const m=calcM(sym); if(!m) return '<p>No data</p>';
  const yH=YEARS.map(y=>yearColHeader(sym,y)).join('');
  const rows=MKEYS.map((r,i)=>{
    const cells=m.Y.map(y=>{const v=y[r.k];return`<td class="tc num${isOK(v)&&v<0?' neg':''}">${N2(v,2)}</td>`;}).join('');
    const a=avg(m.Y.map(y=>y[r.k]));
    const cg=cagr(m.Y.map(y=>y[r.k]));
    return`<tr class="${i%2?'ev':''}">
      <td class="lbl">${r.l}</td>${cells}
      <td class="tc num cya" style="background:rgba(0,196,224,.04)">${N2(a,2)}</td>
      <td class="tc num ${!isOK(cg)?'':cg>=0?'pos':'neg'}" style="background:rgba(0,217,126,.03)">${isOK(cg)?N2(cg,1)+'%':'N/A'}</td>
    </tr>`;
  }).join('');
  return`${srcBar(sym,st)}
  <div class="sec"><div class="tw">
    <table><thead><tr>
      <th style="min-width:150px">Metric (${st.currency})</th>${yH}
      <th class="tc" style="color:var(--cyan);min-width:75px">Avg</th>
      <th class="tc" style="color:var(--green);min-width:70px">CAGR</th>
    </tr></thead><tbody>${rows}</tbody></table>
  </div></div>`;
}

// ── RATIOS TAB ──
function tabRatios(sym,st){
  const m=calcM(sym); if(!m) return '<p>No data</p>';
  const yH=YEARS.map(y=>yearColHeader(sym,y)).join('');
  const rDefs=[
    {k:'cashToAsset',l:'Cash / Total Asset %',p:true},{k:'debtToEquity',l:'Debt / Equity %',p:true},
    {k:'gpm',l:'Gross Profit Margin %',p:true},{k:'npm',l:'Net Profit Margin %',p:true},
    {k:'roa',l:'Return on Asset %',p:true},{k:'roe',l:'Return on Equity %',p:true},
    {k:'divPayout',l:'Dividend Payout %',p:true},{k:'valLow',l:'Valuation Low (DPS×10)',p:false},
    {k:'valHigh',l:'Valuation High (DPS×20)',p:false},{k:'retEps',l:'Retained EPS (EPS−DPS)',p:false},
  ];
  const rows=rDefs.map((r,i)=>{
    const cells=m.Y.map(y=>{const v=y[r.k];return`<td class="tc num${isOK(v)&&v<0?' neg':''}">${r.p?P1(v):N2(v,2)}</td>`;}).join('');
    const a=avg(m.Y.map(y=>y[r.k]));
    return`<tr class="${i%2?'ev':''}"><td class="lbl">${r.l}</td>${cells}
      <td class="tc num cya" style="background:rgba(0,196,224,.04);font-weight:600">${r.p?P1(a):N2(a,2)}</td></tr>`;
  }).join('');

  const bc=!isOK(m.buff)?'var(--muted)':m.buff>=100?'var(--yellow)':m.buff>=50?'var(--green)':'var(--red)';
  const cards=[
    {l:'Revenue CAGR',     v:P1(m.cg.rev),  c:'var(--green)'},
    {l:'Net Profit CAGR',  v:P1(m.cg.np),   c:'var(--green)'},
    {l:'EPS CAGR',         v:P1(m.cg.eps),  c:'var(--green)'},
    {l:`EPS Increase (${LATEST_YEAR-YEARS[0]}yr)`, v:N2(m.epsInc,2), c:'var(--cyan)'},
    {l:'Total Retained EPS',v:N2(m.totRet,2),c:'var(--cyan)'},
    {l:'Buffett $1 Test',  v:P1(m.buff),    c:bc},
    {l:'Avg ROE',          v:P1(m.av.roe),  c:'var(--purple)'},
    {l:'Avg NP Margin',    v:P1(m.av.npm),  c:'var(--blue)'},
  ].map(c=>`<div class="card"><div class="card-l">${c.l}</div><div class="card-v" style="color:${c.c}">${c.v}</div></div>`).join('');

  return`${srcBar(sym,st)}
  <div class="sec"><div class="tw">
    <table><thead><tr>
      <th style="min-width:200px">Ratio</th>${yH}
      <th class="tc" style="color:var(--cyan);min-width:80px">Average</th>
    </tr></thead><tbody>${rows}</tbody></table>
  </div></div>
  <div class="sec"><div class="sec-t">Key Metrics Summary</div><div class="cards">${cards}</div></div>`;
}

// ── CHART TAB ──
function tabChartHTML(sym,st){
  return`${srcBar(sym,st)}
  <div class="sec"><div class="chart-box">
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">
      Revenue · Gross Profit · Net Profit <strong style="color:var(--muted2)">(bars, left axis)</strong> &nbsp;|&nbsp;
      GP Margin % · NP Margin % <strong style="color:var(--muted2)">(lines, right axis)</strong>
    </div>
    <div id="chartWrap"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted)">Building chart…</div></div>
  </div></div>`;
}

// ── RANKINGS TAB ──
function tabRankings(){
  const {ranks,scores,fr}=calcRanks(S.wts);
  const rankedKs=Object.keys(fr);
  const unrankedKs=Object.keys(S.stocks).filter(k=>!fr[k]);

  // ── Weight groups ──────────────────────────────────
  const CAT_GROUPS=[
    {id:'risk',    label:'🛡 Risk',
     color:'var(--blue)',  bg:'rgba(77,160,255,.07)',  border:'rgba(77,160,255,.3)',
     keys:['cashToAsset','debtToEquity']},
    {id:'profgrow',label:'📈 Profitability & Growth',
     color:'var(--green)', bg:'rgba(0,217,126,.06)',   border:'rgba(0,217,126,.25)',
     keys:['revenueCagr','gpmAvg','netProfitCagr','npmAvg','epsCagr','dpsCagr']},
    {id:'mgmt',    label:'🎯 Management Effectiveness',
     color:'var(--purple)',bg:'rgba(180,157,255,.06)', border:'rgba(180,157,255,.25)',
     keys:['roeAvg','dividendPayout','buffettTest']},
  ];
  const CRIT_MAP=Object.fromEntries(CRITERIA.map(c=>[c.wKey,c]));

  function catSubtotal(keys){return keys.reduce((s,k)=>s+(S.wts[k]||0),0);}

  const wCatBlocks=CAT_GROUPS.map(g=>{
    const sub=catSubtotal(g.keys);
    const subOk=sub>0;
    const cards=g.keys.map(wk=>{
      const c=CRIT_MAP[wk]; const w=S.wts[wk]||0; const ov=w>5;
      return`<div class="wt-card${ov?' ov':''}" style="flex:1;min-width:100px">
        <div class="wt-l">${c.label}${ov?'<br><span style="font-size:9px;color:var(--orange)">⚠ High weight</span>':''}</div>
        <div class="wt-row">
          <input type="number" min="0" max="100" step="1" value="${w}"
            class="wt-inp${ov?' ov':''}" oninput="setWt('${wk}',this.value)"/>
          <span class="wt-u">%</span>
        </div>
      </div>`;
    }).join('');
    return`<div style="border:1px solid ${g.border};background:${g.bg};border-radius:12px;padding:12px;flex:1;min-width:200px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">
        <span style="font-size:11px;font-weight:700;color:${g.color}">${g.label}</span>
        <span style="font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;
          background:${g.bg};border:1px solid ${g.border};color:${g.color}">${sub.toFixed(0)}%</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${cards}</div>
    </div>`;
  }).join('');

  // Category + total summary row
  const riskSub    = catSubtotal(CAT_GROUPS[0].keys);
  const profSub    = catSubtotal(CAT_GROUPS[1].keys);
  const mgmtSub    = catSubtotal(CAT_GROUPS[2].keys);
  const totalW     = riskSub + profSub + mgmtSub;
  const tot100     = Math.abs(totalW-100)<0.01;

  const sumRow=`
  <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:stretch;margin-top:12px;padding-top:12px;
    border-top:1px solid var(--bdr)">
    ${[
      {l:'🛡 Risk',           v:riskSub, c:'var(--blue)'},
      {l:'📈 Profitability & Growth',v:profSub, c:'var(--green)'},
      {l:'🎯 Management Effectiveness',v:mgmtSub,c:'var(--purple)'},
    ].map(x=>`
      <div style="flex:1;min-width:120px;background:var(--surf);border:1px solid var(--bdr);
        border-radius:9px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px">
        <span style="font-size:10px;color:var(--muted2);font-weight:600">${x.l}</span>
        <span style="font-size:15px;font-weight:700;color:${x.c}">${x.v.toFixed(0)}%</span>
      </div>`).join('')}
    <div style="min-width:110px;padding:8px 14px;border-radius:9px;display:flex;align-items:center;
      justify-content:space-between;gap:8px;font-weight:700;font-size:15px;
      background:${tot100?'rgba(0,217,126,.15)':'rgba(255,64,96,.15)'};
      border:1px solid ${tot100?'rgba(0,217,126,.4)':'rgba(255,64,96,.5)'};
      color:${tot100?'var(--green)':'var(--red)'}">
      <span style="font-size:10px;font-weight:600">Total</span>
      ${totalW.toFixed(0)}% ${tot100?'✓':totalW>100?'▲':'▼'}
    </div>
  </div>`;

  const wCards=wCatBlocks; // used below in template

  const thCrit=CRITERIA.map(c=>`<th class="tc" style="min-width:50px;font-size:9px">${c.label}<br><span style="color:var(--cyan)">${S.wts[c.wKey]||0}%</span></th>`).join('');

  const rRows=rankedKs.map(k=>{
    const r=fr[k];
    // Medals for rank 1-5
    const medal=r===1?'🥇':r===2?'🥈':r===3?'🥉':r===4?'🎖️':r===5?'🏅':r;
    const medalFontSize=r<=5?'18':'13';
    const rc=r===1?'fr1':r<=3?'fr2':r<=5?'fr4':r>Math.floor(rankedKs.length*0.65)?'frb':'';
    const rcells=CRITERIA.map(c=>{
      const rk=ranks[k][c.key]||'?';
      const mv=scores[k]?.m?.rm[c.key];
      const cls=rk===1?'rc1':rk===2?'rc2':rk===3?'rc3':rk===4?'rc4':rk===5?'rc5':rk<=Math.ceil(rankedKs.length/3)?'rc-g':'rc-m';
      return`<td class="tc" style="padding:5px 3px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
          <span class="rc ${cls}">${rk}</span>
          <span style="font-size:9px;color:var(--muted)">${isOK(mv)?N2(mv,1):'-'}</span>
        </div></td>`;
    }).join('');
    return`<tr class="${rc}">
      <td class="tc" style="font-size:${medalFontSize}px;font-weight:900;padding:8px 10px">${medal}</td>
      <td style="padding:8px 11px">
        <div style="font-weight:700;font-size:13px">${k}</div>
        <div style="font-size:10px;color:var(--muted)">${S.stocks[k].name}</div>
      </td>${rcells}
      <td class="tc num" style="font-weight:700;font-size:13px">${scores[k].ws.toFixed(2)}</td>
    </tr>`;
  }).join('');

  // Unranked (no data yet)
  const uRows=unrankedKs.length?`<tr><td colspan="14" style="padding:10px 14px;font-size:11px;color:var(--muted)">
    Not yet ranked (data not loaded): ${unrankedKs.map(k=>`<button class="btn btn-ghost btn-xs" onclick="selStock('${k}');setTab('data')" style="margin:0 2px">${k}</button>`).join('')}
  </td></tr>`:'';

  // Summary table
  const sumKs=Object.keys(S.stocks).filter(k=>S.status[k]==='ok');
  const sumRows=sumKs.map((k,i)=>{
    const m=calcM(k);if(!m)return'';
    const vals=[m.rm.cashToAsset,m.rm.debtToEquity,m.rm.revenueCagr,m.rm.gpmAvg,
      m.rm.netProfitCagr,m.rm.npmAvg,m.rm.epsCagr,m.rm.roeAvg,m.rm.dividendPayout,m.rm.buffettTest];
    const cells=vals.map(v=>`<td class="tc num ${isOK(v)&&v>0?'pos':isOK(v)&&v<0?'neg':''}">${isOK(v)?N2(v,1):'N/A'}</td>`).join('');
    return`<tr class="${i%2?'ev':''}"><td style="font-weight:700;padding:6px 11px">${k}</td>${cells}</tr>`;
  }).join('');

  return`
  <div class="sec">
    <div class="sec-t">Scoring Weights</div>
    <div class="wt-wrap" style="border:1px solid ${tot100?'rgba(0,217,126,.3)':'var(--red)'};background:${tot100?'rgba(0,217,126,.02)':'rgba(255,64,96,.04)'}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <span style="font-size:13px;font-weight:600">Weighting Criteria</span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${wCatBlocks}</div>
      ${sumRow}
      ${!tot100?`<p class="err" style="margin-top:10px">⛔ Weights must sum to exactly 100%. Current total: ${totalW.toFixed(1)}%</p>`:''}
    </div>
  </div>

  <div class="sec">
    <div class="sec-t">Multi-Criteria Rankings · ${YEARS[0]}–${LATEST_YEAR} (completed) + ${CURRENT_YEAR} annualised</div>
    <div class="tw"><table><thead><tr>
      <th style="min-width:38px">Rank</th><th style="min-width:140px">Stock</th>
      ${thCrit}
      <th class="tc" style="color:var(--cyan);min-width:55px">Score</th>
    </tr></thead><tbody>

let AF={sym:'',name:'',exch:'ASX',cur:'B AUD',ticker:'',hintCur:'AUD'};

function showAdd(){

}
function hideAdd(){document.getElementById('addModal').style.display='none';}

function renderAddForm(){

      1. Fill in the stock details below<br>
      2. Copy the generated <code style="background:rgba(0,0,0,.3);padding:1px 5px;border-radius:3px">stocks_config.json</code> entry<br>
      3. Add it to <code style="background:rgba(0,0,0,.3);padding:1px 5px;border-radius:3px">stocks_config.json</code> in your GitHub repo<br>

      Data will be fetched automatically and your dashboard will update.
    </div>

    <div class="fg" style="margin-bottom:12px">
      <div class="fld"><label>Ticker Symbol *</label>
        <input id="aSym" placeholder="e.g. CBA, TSM, TLKM"
          oninput="AF.sym=this.value.toUpperCase();this.value=AF.sym;updateTickerDefault();updateConfigPreview()"/></div>
      <div class="fld"><label>Company Name *</label>
        <input id="aName" placeholder="e.g. Commonwealth Bank"
          oninput="AF.name=this.value;updateConfigPreview()"/></div>
      <div class="fld"><label>Exchange</label>
        <select id="aExch" onchange="AF.exch=this.value;updateCurDefault();updateTickerDefault();updateConfigPreview()">

        <input id="aCur" value="${AF.cur}" oninput="AF.cur=this.value;updateConfigPreview()"/></div>
      <div class="fld"><label>Yahoo Finance Ticker</label>
        <input id="aTicker" placeholder="e.g. CBA.AX"
          oninput="AF.ticker=this.value;updateConfigPreview()"/></div>
    </div>

    <div style="background:var(--bg);border:1px solid var(--bdr);border-radius:9px;padding:12px;margin-bottom:12px">

        📋 Copy this into <code>stocks_config.json</code> in your GitHub repo → "custom_stocks" array:
      </div>
      <pre id="cfgPreview" style="font-size:11px;color:var(--muted2);line-height:1.6;white-space:pre;overflow-x:auto;margin:0"></pre>
      <button class="btn btn-ghost btn-xs" style="margin-top:8px" onclick="copyCfgEntry()">📋 Copy to clipboard</button>

    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:4px">

        📂 Open stocks_config.json on GitHub
      </a>
      <div style="display:flex;gap:8px">

function updateCurDefault(){
  const m={IDX:'T IDR',ASX:'B AUD',NYSE:'B USD',NASDAQ:'B USD'};
  const v=m[AF.exch]||'B USD';
  const el=document.getElementById('aCur');
  if(el){el.value=v;AF.cur=v;}
}

function updateTickerDefault(){
  const sym=AF.sym;
  if(!sym) return;
  let ticker=sym;
  if(AF.exch==='ASX') ticker=sym+'.AX';
  else if(AF.exch==='IDX') ticker=sym+'.JK';
  AF.ticker=ticker;
  const el=document.getElementById('aTicker');
  if(el) el.value=ticker;
  // hint_cur default
  AF.hintCur = (AF.exch==='IDX') ? 'IDR' : 'USD';
  if(AF.exch==='ASX') AF.hintCur='AUD'; // many ASX stocks report AUD
}

function updateConfigPreview(){
  const sym=(document.getElementById('aSym')?.value||'').toUpperCase()||'SYMBOL';
  const name=document.getElementById('aName')?.value||'Company Name';
  const exch=document.getElementById('aExch')?.value||'ASX';
  const cur=document.getElementById('aCur')?.value||'B AUD';
  const ticker=document.getElementById('aTicker')?.value||(sym+(exch==='ASX'?'.AX':exch==='IDX'?'.JK':''));
  const hintCur=exch==='IDX'?'IDR':exch==='ASX'?'AUD':'USD';

  const entry=`    {\n      "symbol": "${sym}",\n      "name": "${name}",\n      "exchange": "${exch}",\n      "currency": "${cur}",\n      "ticker": "${ticker}",\n      "hint_cur": "${hintCur}"\n    }`;
  const pre=document.getElementById('cfgPreview');
  if(pre) pre.textContent=entry;
}

function copyCfgEntry(){
  const pre=document.getElementById('cfgPreview');
  if(!pre) return;
  navigator.clipboard.writeText(pre.textContent)
    .then(()=>{
      const m=document.getElementById('cfgCopyMsg');
      if(m){m.style.display='inline';setTimeout(()=>m.style.display='none',2500);}
    })
    .catch(()=>{
      const r=document.createRange();r.selectNode(pre);
      window.getSelection().removeAllRanges();window.getSelection().addRange(r);
      document.execCommand('copy');
    });
}

function validateAddForm(){
  const sym=(document.getElementById('aSym')?.value||'').trim().toUpperCase();
  const name=(document.getElementById('aName')?.value||'').trim();
  const exch=document.getElementById('aExch')?.value;
  const cur=document.getElementById('aCur')?.value||'';
  if(!sym||!name){showAErr('Ticker symbol and company name are required.');return null;}
  return{sym,name,exch,cur};
}
function showAErr(m){const e=document.getElementById('aErr');if(e){e.textContent='⚠ '+m;e.style.display='block';}}

function submitAddStock(){
  const f=validateAddForm();if(!f)return;
  const sd={name:f.name,exchange:f.exch,currency:f.cur};
  S.custom[f.sym]=sd;S.stocks[f.sym]=sd;S.sel=f.sym;S.tab='data';
  S.status[f.sym]='idle';
  saveLS();
  hideAdd();
  render();
  showToast(`✓ ${f.sym} added. Add it to stocks_config.json and run the GitHub Actions workflow to fetch data.`,'cyan');
}

function submitAutoFetch(){
  const f=validateAddForm();if(!f)return;
  const sd={name:f.name,exchange:f.exch,currency:f.cur};
  S.custom[f.sym]=sd;S.stocks[f.sym]=sd;S.sel=f.sym;S.tab='data';
  hideAdd();render();
  fetchStock(f.sym);
}

function submitManualShell(){
  const f=validateAddForm();if(!f)return;
  const sd={name:f.name,exchange:f.exch,currency:f.cur};
  S.custom[f.sym]=sd;S.stocks[f.sym]=sd;S.sel=f.sym;S.tab='data';
  hideAdd();
  showManual(f.sym);
}

// ── MANUAL DATA ENTRY ──
let MA={sym:'',vals:{}};
function showManual(sym){
  const st=S.stocks[sym];
  MA.sym=sym;
  MA.vals=Object.fromEntries(MKEYS.map(m=>[m.k,
    S.data[sym]?[...S.data[sym][m.k]]:Array(N_YEARS).fill('')]));

  const yH=YEARS.map(y=>`<th class="tc" style="min-width:60px">${y}</th>`).join('');
  const rows=MKEYS.map((r,i)=>{
    const cells=YEARS.map((_,j)=>`<td style="padding:2px 2px">
      <input type="number" value="${isOK(MA.vals[r.k][j])?MA.vals[r.k][j]:''}"
        oninput="MA.vals['${r.k}'][${j}]=this.value"
        style="width:58px;background:var(--bg);border:1px solid var(--bdr);border-radius:5px;
          padding:3px 5px;font-size:11px;color:var(--txt);text-align:center"/>
    </td>`).join('');
    return`<tr class="${i%2?'ev':''}"><td class="lbl" style="padding:5px 10px;font-size:11px">${r.l}</td>${cells}</tr>`;
  }).join('');

  document.getElementById('addBody').innerHTML=`
    <p style="font-size:12px;color:var(--muted2);margin-bottom:12px">
      <strong style="color:var(--txt)">${sym} — ${st.name}</strong> · ${st.exchange} · ${st.currency}<br>
      Enter data for ${YEARS[0]}–${YEARS[YEARS.length-1]}. Leave blank for unavailable years.
    </p>
    <div class="tw"><table>
      <thead><tr><th style="min-width:150px">Metric</th>${yH}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div id="aErr" class="err" style="display:none"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
      <button class="btn btn-ghost" onclick="hideAdd()">Cancel</button>
      <button class="btn btn-cyan" onclick="submitManualData()">✓ Save Data</button>
    </div>`;
  document.getElementById('addModal').style.display='flex';
}

function submitManualData(){
  const sym=MA.sym;
  const parsed={};
  for(const r of MKEYS){
    parsed[r.k]=MA.vals[r.k].map(v=>v===''||v===null||v===undefined?null:parseFloat(v));
    if(parsed[r.k].some(v=>v!==null&&isNaN(v))){
      showAErr(`Invalid number in "${r.l}"`);return;
    }
  }
  S.data[sym]={...parsed, fetchedAt:Date.now(), source:'user-edited'};
  S.status[sym]='ok';
  saveLS();hideAdd();render();
  showToast(`✓ ${sym} data saved`,'green');
}

function delStock(k){
  const isBuiltIn = !!BASE_STOCKS[k];
  const isConfigStock = !S.custom[k] && !isBuiltIn; // came from stocks_config.json via data.json
  let msg;
  if(isBuiltIn){
    msg=`Remove ${k} from the dashboard view?\n\nNote: it will reappear on next page refresh since it's built-in. To permanently remove it you'd need to edit fetch_data.py.`;
  } else if(isConfigStock){
    msg=`Remove ${k} from the dashboard?\n\nIMPORTANT: Also remove it from stocks_config.json on GitHub, then run the workflow — otherwise it will reappear next time the page loads from data.json.`;
  } else {
    msg=`Remove ${k} from the dashboard?`;
  }
  if(!confirm(msg)) return;

  // Track explicitly deleted stocks so boot() doesn't re-add them
  if(!S.deleted) S.deleted={};
  S.deleted[k]=true;

  delete S.custom[k]; delete S.stocks[k]; delete S.data[k]; delete S.status[k];
  if(S.sel===k) S.sel = Object.keys(S.stocks)[0] || 'BHP';
  saveLS();
  render();
  showToast(`${k} removed`,'cyan');
}

// ═══════════════════════════════════
// BOOT
// ═══════════════════════════════════
loadLS();
const _hSub = document.getElementById('hSub');

async function boot() {
  let liveData = null;
  if (location.protocol !== 'file:') {
    try {
      const r = await fetch('./data.json?_=' + Date.now());
      if (r.ok) {
        liveData = await r.json();
        console.log('Loaded data.json — generated:', liveData.generated,
                    '— stocks:', Object.keys(liveData.stocks||{}).length);
      }
    } catch(e) {
      console.log('data.json not available, using built-in data');
    }
  }

  if (liveData && liveData.stocks) {
    ANNUALISATION = liveData.annualisation || {};
    const ts = Date.now();

    Object.entries(liveData.stocks).forEach(([sym, sd]) => {
      // Skip stocks the user explicitly deleted
      if (S.deleted && S.deleted[sym]) return;

      // ── REGISTER stock if not already known ──────────────────────
      if (!S.stocks[sym]) {
        S.stocks[sym] = {
          name:     sd.name     || sym,
          exchange: sd.exchange || 'NYSE',
          currency: sd.currency || 'B USD',
        };
      } else {
        S.stocks[sym].name     = sd.name     || S.stocks[sym].name;
        S.stocks[sym].exchange = sd.exchange || S.stocks[sym].exchange;
        S.stocks[sym].currency = sd.currency || S.stocks[sym].currency;
      }

      // ── LOAD data from data.json ──────────────────────────────────
      // Always use data.json if it has real yfinance data — even if
      // the stock was previously added as "custom" via the Add button.
      // This fixes the case where user added CBA/TSM manually before
      // the workflow fetched them.
      const hasRealData = sd.source === 'yfinance' &&
                          Array.isArray(sd.revenue) &&
                          sd.revenue.some(v => v !== null);
      const isUserEdited = S.custom[sym] && S.data[sym] &&
                           S.data[sym].source === 'user-edited';

      if (!isUserEdited) {
        // Load from data.json (covers both base stocks and custom stocks
        // that now have fetched data)
        S.data[sym] = {
          totalAsset:  sd.totalAsset,
          cash:        sd.cash,
          totalDebt:   sd.totalDebt,
          totalEquity: sd.totalEquity,
          revenue:     sd.revenue,
          grossProfit: sd.grossProfit,
          netProfit:   sd.netProfit,
          eps:         sd.eps,
          dps:         sd.dps,
          fetchedAt:   ts,
          source:      sd.source === 'yfinance' ? 'yfinance' : 'built-in',
          ticker:      sd.ticker,
          generated:   liveData.generated,
        };
        S.status[sym] = hasRealData ? 'ok' : 'idle';

        // If this stock was in S.custom but now has real data, it no
        // longer needs to be tracked as custom (workflow handles it)
        if (S.custom[sym] && hasRealData) {
          delete S.custom[sym];
        }
      }
    });

    // ── REMOVE stocks deleted from stocks_config.json ─────────────
    // Any non-built-in stock NOT in data.json AND NOT user-custom → remove
    const liveSyms = new Set(Object.keys(liveData.stocks));
    Object.keys(S.stocks).forEach(sym => {
      if (!BASE_STOCKS[sym] && !S.custom[sym] && !liveSyms.has(sym)) {
        delete S.stocks[sym];
        delete S.data[sym];
        delete S.status[sym];
        console.log('Removed stale stock:', sym);
      }
    });

    const genDate = new Date(liveData.generated).toLocaleDateString();
    const n = Object.keys(liveData.stocks).length;
    if (_hSub) _hSub.textContent =
      `ASX · IDX · NYSE/NASDAQ — Auto-refreshed ${genDate} · ${n} stocks · ${YEARS[0]}–${YEARS[N_YEARS-1]}`;

    // Select first stock if current selection no longer exists
    if (!S.stocks[S.sel]) S.sel = Object.keys(S.stocks)[0] || 'BHP';

  } else {
    // No data.json (local file or first run) — use embedded fallback
    initPreloadedData();
    if (_hSub) _hSub.textContent =
      `ASX · IDX · NYSE/NASDAQ — Built-in data · ${YEARS[0]}–${YEARS[N_YEARS-1]} · Host on GitHub Pages for auto-refresh`;
  }

  // Set status for any remaining untracked stocks
  Object.keys(S.stocks).forEach(k => {
    if (!S.status[k]) S.status[k] = S.data[k] ? 'ok' : 'idle';
  });
  render();
}

boot();

</script>
