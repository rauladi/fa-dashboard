name: Refresh Financial Data

on:
  # Run on the 5th of every month at 06:00 UTC
  # (most companies have published annual results by then)
  schedule:
    - cron: '0 6 5 * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write   # needed to commit data.json back to repo

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Fetch financial data
        run: python scripts/fetch_data.py

      - name: Show what changed
        run: |
          echo "=== data.json summary ==="
          python3 -c "
          import json
          d = json.load(open('data.json'))
          print(f'Generated : {d[\"generated\"]}')
          print(f'Years     : {d[\"years\"]}')
          print(f'Stocks    : {list(d[\"stocks\"].keys())}')
          for sym, s in d['stocks'].items():
              src = s.get('source','?')
              rev = s.get('revenue',[])
              live = sum(1 for v in rev if v is not None)
              print(f'  {sym:6s} [{src:8s}] {live}/{len(rev)} years revenue data')
          "

      - name: Commit and push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to data.json — skipping commit"
          else
            git commit -m "chore: auto-refresh financial data $(date -u '+%Y-%m-%d')"
            git push
            echo "✓ data.json updated and pushed"
          fi
